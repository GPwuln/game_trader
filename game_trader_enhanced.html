      calculatePriceTrend(prices) {
        if (prices.length < 2) return 0;
        
        let trend = 0;
        for (let i = 1; i < prices.length; i++) {
          trend += (prices[i] - prices[i-1]) / prices[i-1];
        }
        return trend / (prices.length - 1);
      }
      
      calculateVolatility(prices) {
        if (prices.length < 2) return 0;
        
        const mean = prices.reduce((sum, price) => sum + price, 0) / prices.length;
        const variance = prices.reduce((sum, price) => sum + Math.pow(price - mean, 2), 0) / prices.length;
        return Math.sqrt(variance) / mean;
      }
      
      // 处理收藏按钮点击
      async handleFavoriteClick(item, favoriteBtn) {
        // 添加点击动画效果
        favoriteBtn.style.transform = 'scale(0.9)';
        setTimeout(() => {
          favoriteBtn.style.transform = '';
        }, 150);
        
        // 切换收藏状态
        item.isFavorite = !item.isFavorite;
        
        // 保存到数据库
        await this.state.saveItemQuick(item);
        
        // 更新按钮状态
        if (item.isFavorite) {
          favoriteBtn.classList.add('favorited');
          favoriteBtn.textContent = '❤️';
          favoriteBtn.title = '已收藏';
          this.showToast('已添加到收藏', '❤️', 'success', item);
        } else {
          favoriteBtn.classList.remove('favorited');
          favoriteBtn.textContent = '🤍';
          favoriteBtn.title = '添加收藏';
          this.showToast('已取消收藏', '🤍', 'success', item);
        }
        
        // 同步更新卡片上的收藏按钮状态
        this.updateFavoriteButton(item);
        
        // 更新分类计数
        this.renderCategories();
      }
      
      // 处理分享按钮点击
      handleShareClick(item, modal) {
        // 添加点击动画效果
        const shareBtn = modal.querySelector('#shareBtn');
        if (shareBtn) {
          shareBtn.style.transform = 'scale(0.9)';
          setTimeout(() => {
            shareBtn.style.transform = '';
          }, 150);
        }
        
        // 生成分享内容
        const shareContent = this.generateShareContent(item, modal);
        
        // 复制到剪贴板
        this.copyToClipboard(shareContent, item);
      }
      
      // 生成分享内容
      generateShareContent(item, modal) {
        const now = new Date();
        const dateStr = now.toLocaleDateString('zh-CN');
        const timeStr = now.toLocaleTimeString('zh-CN');
        
        // 获取价格数据
        const priceData = this.calculatePriceData(item);
        const stats = Utils.calcStats(item.history);
        
        // 获取库存信息
        const inventory = item.inventory || {};
        const currentStock = inventory.currentStock || 0;
        const totalInvestment = inventory.totalInvestment || 0;
        const averageCost = inventory.averageCost || 0;
        
        // 获取AI建议
        const aiSuggestions = this.generateAISuggestions(item);
        const topSuggestions = aiSuggestions.slice(0, 3);
        
        // 构建分享内容
        let shareText = `🎮 游戏道具交易分析报告\n`;
        shareText += `📅 生成时间: ${dateStr} ${timeStr}\n\n`;
        
        shareText += `📦 道具信息\n`;
        shareText += `• 名称: ${item.name}\n`;
        shareText += `• 分类: ${item.category}${item.subCategory ? ' › ' + item.subCategory : ''}\n`;
        shareText += `• 当前价格: ¥${item.price}\n\n`;
        
        shareText += `📊 价格统计\n`;
        shareText += `• 平均价格: ¥${Utils.formatPrice(stats.avg, this.state.enableFormatPrice)}\n`;
        shareText += `• 最高价格: ¥${Utils.formatPrice(stats.max.price, this.state.enableFormatPrice)} (${stats.max.date.split(' ')[0]})\n`;
        shareText += `• 最低价格: ¥${Utils.formatPrice(stats.min.price, this.state.enableFormatPrice)} (${stats.min.date.split(' ')[0]})\n`;
        shareText += `• 价格变动: ${priceData.changePercent}% (${priceData.change > 0 ? '上涨' : '下跌'} ¥${Utils.formatPrice(Math.abs(priceData.change), this.state.enableFormatPrice)})\n`;
        shareText += `• 记录次数: ${stats.count} 次\n\n`;
        
        if (currentStock > 0 || totalInvestment > 0) {
          shareText += `📦 库存管理\n`;
          shareText += `• 当前库存: ${currentStock} 件\n`;
          shareText += `• 平均成本: ¥${Utils.formatPrice(averageCost, this.state.enableFormatPrice)}\n`;
          shareText += `• 总投资: ¥${Utils.formatPrice(totalInvestment, this.state.enableFormatPrice)}\n`;
          
          if (inventory.operationHistory && inventory.operationHistory.length > 0) {
            const recentOps = inventory.operationHistory.slice(0, 5);
            shareText += `• 最近操作:\n`;
            recentOps.forEach(op => {
              const timeAgo = this.formatTimeAgo(op.timestamp);
              const action = op.type === 'buy' ? '购入' : '卖出';
              shareText += `  - ${timeAgo}: ${action} ${op.quantity}件 @ ¥${Utils.formatPrice(op.price, this.state.enableFormatPrice)}\n`;
            });
          }
          shareText += `\n`;
        }
        
        if (topSuggestions.length > 0) {
          shareText += `🤖 AI 智能建议\n`;
          topSuggestions.forEach((suggestion, index) => {
            shareText += `${index + 1}. ${suggestion.icon} ${suggestion.title}\n`;
            shareText += `   ${suggestion.text}\n`;
            shareText += `   信心度: ${suggestion.confidence}%\n\n`;
          });
        }
        
        shareText += `📈 趋势分析\n`;
        if (priceData.trend === 'up') {
          shareText += `• 价格趋势: 📈 上涨趋势\n`;
        } else if (priceData.trend === 'down') {
          shareText += `• 价格趋势: 📉 下跌趋势\n`;
        } else {
          shareText += `• 价格趋势: 📊 平稳趋势\n`;
        }
        
        shareText += `• 波动性: ${priceData.volatility}%\n`;
        shareText += `• 价格区间: ¥${Utils.formatPrice(priceData.min, this.state.enableFormatPrice)} - ¥${Utils.formatPrice(priceData.max, this.state.enableFormatPrice)}\n\n`;
        
        shareText += `💡 投资建议\n`;
        if (item.price < stats.avg * 0.9) {
          shareText += `• 当前价格低于平均价格，可考虑适量购入\n`;
        } else if (item.price > stats.avg * 1.1) {
          shareText += `• 当前价格高于平均价格，建议谨慎操作\n`;
        } else {
          shareText += `• 当前价格接近平均价格，适合正常交易\n`;
        }
        
        shareText += `\n---\n`;
        shareText += `📱 数据来源: 游戏道具交易管理系统\n`;
        shareText += `🔗 更多分析请访问系统查看`;
        
        return shareText;
      }
      
      // 复制到剪贴板
      async copyToClipboard(text, item) {
        try {
          // 使用现代 Clipboard API
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            this.showToast('分享内容已复制到剪贴板！', '🔞', 'success', item);
          } else {
            // 降级方案：使用传统方法
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
              document.execCommand('copy');
              this.showToast('分享内容已复制到剪贴板！', '🔞', 'success', item);
            } catch (err) {
              console.error('复制失败:', err);
              this.showToast('复制失败，请手动复制', '❌', 'error', item);
            } finally {
              document.body.removeChild(textArea);
            }
          }
        } catch (err) {
          console.error('复制到剪贴板失败:', err);
          this.showToast('复制失败，请手动复制', '❌', 'error', item);
        }
      }
      
      
      // 刷新AI建议
      async refreshAISuggestions(item, modal) {
        
        const refreshBtn = modal.querySelector('#refreshAI');
        const aiSuggestionsGrid = modal.querySelector('#aiSuggestions');
        
        if (refreshBtn) {
          refreshBtn.disabled = true;
          refreshBtn.innerHTML = '<div class="refresh-icon">⏳</div><span>分析中...</span>';
        }
        
        if (aiSuggestionsGrid) {
          aiSuggestionsGrid.style.opacity = '0.6';
        }
        
        // 模拟AI分析延迟
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        // 重新生成AI建议
        this.renderAISuggestions(item, modal);
        
        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.innerHTML = '<div class="refresh-icon">🔄</div><span>重新分析</span>';
        }
        
        if (aiSuggestionsGrid) {
          aiSuggestionsGrid.style.opacity = '1';
        }
        
        this.showToast('AI分析已更新', '🤖', 'success', item);
      }
      
      // 渲染AI建议
      renderAISuggestions(item, modal) {
        const aiSuggestionsGrid = modal.querySelector('#aiSuggestions');
        if (!aiSuggestionsGrid) return;
        
        const suggestions = this.generateAISuggestions(item);
        
        // 清空现有内容
        aiSuggestionsGrid.innerHTML = '';
        
        // 渲染建议卡片
        suggestions.forEach(suggestion => {
          const suggestionCard = this.createSuggestionCard(suggestion);
          aiSuggestionsGrid.appendChild(suggestionCard);
        });
      }
      
      // 创建建议卡片
      createSuggestionCard(suggestion) {
        const card = document.createElement('div');
        card.className = 'ai-suggestion-item';
        
        card.innerHTML = `
          <div class="suggestion-icon">${suggestion.icon}</div>
          <div class="suggestion-content">
            <div class="suggestion-title">${suggestion.title}</div>
            <div class="suggestion-text">${suggestion.text}</div>
            <div class="suggestion-confidence">
              <div class="confidence-label">AI信心度</div>
              <div class="confidence-progress">
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${suggestion.confidence}%"></div>
                </div>
                <div class="confidence-value">${suggestion.confidence}%</div>
              </div>
            </div>
          </div>
        `;
        
        return card;
      }
      
      // 生成AI建议
      generateAISuggestions(item) {
        const suggestions = [];
        const priceData = this.calculatePriceData(item);
        const stats = Utils.calcStats(item.history);
        const inventory = item.inventory || {};
        const currentStock = inventory.currentStock || 0;
        const averageCost = inventory.averageCost || 0;
        
        // 1. 库存健康建议
        const stockHealth = this.analyzeStockHealth(currentStock, averageCost, item.price);
        suggestions.push({
          icon: '🧳',
          title: '库存健康',
          text: stockHealth.text,
          confidence: stockHealth.confidence
        });
        
        // 2. 趋势分析建议
        const trendAnalysis = this.analyzeTrend(item.history, item.price);
        suggestions.push({
          icon: '📊',
          title: '趋势分析',
          text: trendAnalysis.text,
          confidence: trendAnalysis.confidence
        });
        
        // 3. 动能分析建议
        const momentumAnalysis = this.analyzeMomentum(inventory.operationHistory || []);
        suggestions.push({
          icon: '⚖️',
          title: '动能分析',
          text: momentumAnalysis.text,
          confidence: momentumAnalysis.confidence
        });
        
        // 4. 销售建议
        const salesAdvice = this.generateSalesAdvice(item.price, averageCost, currentStock, stats);
        suggestions.push({
          icon: '💰',
          title: '销售建议',
          text: salesAdvice.text,
          confidence: salesAdvice.confidence
        });
        
        return suggestions;
      }
      
      // 分析库存健康
      analyzeStockHealth(currentStock, averageCost, currentPrice) {
        const profitMargin = averageCost > 0 ? ((currentPrice - averageCost) / averageCost) * 100 : 0;
        
        if (currentStock === 0) {
          return {
            text: '当前无库存，可考虑适量购入',
            confidence: 85
          };
        } else if (currentStock > 50) {
          return {
            text: '库存量偏高，建议暂停购入',
            confidence: 90
          };
        } else if (currentStock < 5) {
          return {
            text: '库存量偏低，建议适量补充',
            confidence: 88
          };
        } else if (profitMargin > 20) {
          return {
            text: '当前盈利空间较大，库存状态良好',
            confidence: 92
          };
        } else if (profitMargin < -10) {
          return {
            text: '当前处于亏损状态，建议谨慎操作',
            confidence: 85
          };
        } else {
          return {
            text: '库存量适中，可正常操作',
            confidence: 80
          };
        }
      }
      
      // 分析趋势
      analyzeTrend(history, currentPrice) {
        if (!history || history.length < 3) {
          return {
            text: '数据不足，无法进行趋势分析',
            confidence: 60
          };
        }
        
        const recentPrices = history.slice(-7).map(h => h.close);
        const avgPrice = recentPrices.reduce((sum, price) => sum + price, 0) / recentPrices.length;
        const priceChange = ((currentPrice - avgPrice) / avgPrice) * 100;
        
        if (priceChange > 5) {
          return {
            text: '价格呈上涨趋势，建议关注回调时机',
            confidence: 85
          };
        } else if (priceChange < -5) {
          return {
            text: '价格呈下跌趋势，可考虑逢低买入',
            confidence: 80
          };
        } else {
          return {
            text: '价格变化平稳，适合正常操作',
            confidence: 75
          };
        }
      }
      
      // 分析动能
      analyzeMomentum(operationHistory) {
        if (!operationHistory || operationHistory.length === 0) {
          return {
            text: '暂无操作记录，无法分析交易动能',
            confidence: 50
          };
        }
        
        const recentOps = operationHistory.slice(-10);
        const buyOps = recentOps.filter(op => op.type === 'buy').length;
        const sellOps = recentOps.filter(op => op.type === 'sell').length;
        const totalOps = buyOps + sellOps;
        
        if (totalOps === 0) {
          return {
            text: '近期无交易活动，市场较为平静',
            confidence: 70
          };
        }
        
        const buyRatio = buyOps / totalOps;
        
        if (buyRatio > 0.7) {
          return {
            text: '近期买入频繁，需注意库存积压风险',
            confidence: 85
          };
        } else if (buyRatio < 0.3) {
          return {
            text: '近期卖出较多，库存可能不足',
            confidence: 80
          };
        } else {
          return {
            text: '买卖操作相对平衡，运营状态良好',
            confidence: 88
          };
        }
      }
      
      // 生成销售建议
      generateSalesAdvice(currentPrice, averageCost, currentStock, stats) {
        if (currentStock === 0) {
          return {
            text: '无库存可售，建议先购入',
            confidence: 95
          };
        }
        
        const profitMargin = averageCost > 0 ? ((currentPrice - averageCost) / averageCost) * 100 : 0;
        const avgPrice = stats.avg;
        const priceVsAvg = ((currentPrice - avgPrice) / avgPrice) * 100;
        
        if (profitMargin > 30 && priceVsAvg > 10) {
          return {
            text: `当前价格高于成本${profitMargin.toFixed(1)}%，可择机卖出部分库存`,
            confidence: 91
          };
        } else if (profitMargin < -20) {
          return {
            text: '当前处于亏损状态，建议等待价格回升',
            confidence: 88
          };
        } else if (priceVsAvg > 15) {
          return {
            text: '当前价格高于历史平均，可考虑适量卖出',
            confidence: 82
          };
        } else if (priceVsAvg < -10) {
          return {
            text: '当前价格低于历史平均，建议持有观望',
            confidence: 85
          };
        } else {
          return {
            text: '当前价格合理，可根据市场情况灵活操作',
            confidence: 78
          };
        }
      }
      
      // 更新价格统计信息
      updatePriceStats(item, modal = null) {
        if (!modal) {
          modal = document.querySelector('.item-detail-modal');
        }
        
        if (!modal) return;
        
        const stats = Utils.calcStats(item.history);
        
        // 获取统计元素并直接更新数值
        const avgValueEl = modal.querySelector('.stat-avg .stat-value');
        const countValueEl = modal.querySelector('.stat-count .stat-value');
        const highValueEl = modal.querySelector('.stat-high .stat-value');
        const lowValueEl = modal.querySelector('.stat-low .stat-value');
        
        if (avgValueEl) {
          avgValueEl.textContent = `¥${Utils.formatPrice(stats.avg, this.state.enableFormatPrice)}`;
        }
        if (countValueEl) {
          countValueEl.textContent = `${stats.count}`;
        }
        if (highValueEl) {
          highValueEl.textContent = `¥${Utils.formatPrice(stats.max.price, this.state.enableFormatPrice)}`;
        }
        if (lowValueEl) {
          lowValueEl.textContent = `¥${Utils.formatPrice(stats.min.price, this.state.enableFormatPrice)}`;
        }
      }
    }

    const app = new AppState();
    let ui;
    
    // 将ui暴露到全局作用域，方便控制台调试
    window.ui = ui;
    window.app = app;
    
    console.log('🚀 开始初始化应用...');

    app.init().then(() => {
      // 更新加载状态
      const loadingOverlay = document.getElementById('loadingOverlay');
      
      ui = new UIManager(app);
      // 更新全局引用
      window.ui = ui;
      
      // 使用数据库中的主题设置，确保一致性
      ui.setTheme(app.themePref);
      ui.initEventListeners();
      ui.renderCategories();
      ui.renderList();
      console.log('✅ 应用初始化完成, 数据量:', app.data.length);
      
      // 更新用户菜单显示
      ui.updateUserMenu().then(() => {
        console.log('✅ 用户菜单已更新');
      });
      
      // 添加便捷的全局函数，方便控制台调试
      window.getIconStats = () => ui.getIconLoadingStats();
      window.resetIconCache = () => ui.resetIconCache();
      window.cleanIconCache = () => ui.cleanIconCache();
      window.getAppData = () => app.data;
      window.getAppState = () => app;
      
      console.log('🔧 调试函数已加载: getIconStats(), resetIconCache(), cleanIconCache(), getAppData(), getAppState()');
      
      // 确保分页导航栏在数据加载完成后显示
      if (app.dataLoaded && ui.elements.pagination) {
        ui.elements.pagination.style.display = 'flex';
      }
      
      // 隐藏加载动画
      if (loadingOverlay) {
        loadingOverlay.classList.add('hidden');
        // 动画完成后移除元素
        setTimeout(() => {
          loadingOverlay.remove();
        }, 500);
      }
      
      // 页面关闭时保存拼音缓存
      window.addEventListener('beforeunload', () => {
        if (app.pinyinCache.size > 0) {
          app.forceSavePinyinCache().catch(err => console.warn('保存拼音缓存失败:', err));
        }
      });
    }).catch(err => {
      console.error('❌ 应用初始化失败:', err);
      // 出错时也要隐藏加载动画
      if (loadingOverlay) {
        loadingOverlay.classList.add('hidden');
        setTimeout(() => loadingOverlay.remove(), 500);
      }
      this.showToast('数据库初始化失败,请刷新页面重试: ' + err.message, '❌', 'error');
    });
  })();
  </script>

        <!-- 统计信息 -->
