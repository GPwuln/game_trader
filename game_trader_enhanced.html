      async generateSampleData() {
        console.log('🎲 generateSampleData 函数被调用');
        // 检查是否有现有数据
        const hasExistingData = this.state.data && this.state.data.length > 0;
        console.log('📊 现有数据状态:', { hasExistingData, dataLength: this.state.data?.length || 0 });
        
        // 使用新的确认模态框
        const shouldGenerate = await this.showSampleDataConfirm(hasExistingData);
        if (!shouldGenerate) return;
        
        // 关闭设置页面
          this.closeModal();
          
        // 如果有数据，清空现有数据
        if (hasExistingData) {
          this.state.data = [];
          await this.state.saveData();
          
          if (this.elements.itemList) {
            this.elements.itemList.innerHTML = '';
          }
          
          this.renderCategories();
        }
        
        // 固定生成2000条数据
        const baseItems = 2000;
        console.log(`📱 生成数据量: ${baseItems}条`);
        
        // 显示进度模态框并传递总数
        this.showGenerationProgressModal(baseItems);
        
        // 显示开始生成提示
        this.showToast('正在生成示例数据...', '🎲', 'info');
        
        // 记录开始时间
        const startTime = Date.now();
        
        // 使用配置中的默认分类重新生成
        this.state.categories = JSON.parse(JSON.stringify(CONFIG.DEFAULT_CATEGORIES));
        await this.state.saveConfig('categories', this.state.categories);
        
        // 生成虚拟库存数据的内部方法
        const generateInventoryData = (currentPrice) => {
          const now = new Date();
          const operationHistory = [];
          let currentStock = 0;
          let totalInvestment = 0;
          let totalRevenue = 0;
          
          // 生成30-90天的操作历史
          const operationDays = Math.floor(Math.random() * 61) + 30;
          const startDays = Math.floor(Math.random() * 60) + operationDays;
          
          for (let i = startDays; i >= startDays - operationDays + 1; i--) {
            const d = new Date(now);
            d.setDate(d.getDate() - i);
            const timestamp = d.getTime();
            
            // 随机决定是否进行操作（70%概率）
            if (Math.random() > 0.3) {
              const isBuy = Math.random() > 0.4; // 60%概率购入，40%概率卖出
              const quantity = Math.floor(Math.random() * 10) + 1; // 1-10件
              const price = Math.max(1, Math.floor(currentPrice * (0.8 + Math.random() * 0.4))); // 价格波动±20%
              
              if (isBuy) {
                // 购入操作
                const totalCost = quantity * price;
                totalInvestment += totalCost;
                currentStock += quantity;
                
                operationHistory.push({
                  type: 'buy',
                  quantity: quantity,
                  price: price,
                  totalCost: totalCost,
                  stockAfter: currentStock,
                  timestamp: timestamp
                });
              } else if (currentStock >= quantity) {
                // 卖出操作（只有库存足够时才卖出）
                const operationRevenue = quantity * price;
                totalRevenue += operationRevenue;
                currentStock -= quantity;
                
                operationHistory.push({
                  type: 'sell',
                  quantity: quantity,
                  price: price,
                  totalRevenue: operationRevenue,
                  stockAfter: currentStock,
                  timestamp: timestamp
                });
              }
            }
          }
          
          // 确保至少有5个操作记录
          if (operationHistory.length === 0) {
            const quantity = Math.floor(Math.random() * 5) + 5;
            const price = Math.max(1, Math.floor(currentPrice * (0.9 + Math.random() * 0.2)));
            const totalCost = quantity * price;
            totalInvestment += totalCost;
            currentStock += quantity;
            
            operationHistory.push({
              type: 'buy',
              quantity: quantity,
              price: price,
              totalCost: totalCost,
              stockAfter: currentStock,
              timestamp: now.getTime()
            });
          }
          
          // 计算平均成本
          const averageCost = totalInvestment > 0 ? totalInvestment / Math.max(currentStock, 1) : 0;
          
          // 生成模拟的图表数据（简化版）
          const chartData = generateMockChartData(currentPrice, Math.max(0, currentStock), operationDays);
          
          return {
            currentStock: Math.max(0, currentStock),
            totalInvestment: totalInvestment,
            totalRevenue: totalRevenue,
            averageCost: Math.round(averageCost * 100) / 100,
            operationHistory: operationHistory.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)),
            chartData: chartData
          };
        };
        
        // 生成简化的模拟图表数据
        const generateMockChartData = (currentPrice, currentStock, days) => {
          const chartDays = Math.min(days, 90); // 限制图表数据最多90天
          const dates = [];
          const fullDates = [];
          const stock = [];
          const prices = [];
          const profits = [];
          const buyOperations = [];
          const sellOperations = [];
          const holdingValues = [];
          const now = new Date();
          
          // 生成基础时间序列
          for (let i = chartDays - 1; i >= 0; i--) {
            const date = new Date(now);
            date.setDate(date.getDate() - i);
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            dates.push(`${month}-${day}`);
            fullDates.push(date.toLocaleString('zh-CN', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              weekday: 'short'
            }));
          }
          
          // 生成简化的模拟数据
          for (let i = 0; i < chartDays; i++) {
            // 简化的库存数据
            const stockValue = Math.max(0, currentStock + Math.sin(i * 0.2) * 3);
            stock.push(Math.round(stockValue));
            
            // 简化的价格数据
            const priceValue = currentPrice * (1 + Math.sin(i * 0.1) * 0.05);
            prices.push(Math.round(priceValue));
            
            // 简化的盈亏数据
            const profitValue = Math.sin(i * 0.3) * 500;
            profits.push(Math.round(profitValue));
            
            // 简化的操作数据
            buyOperations.push(Math.random() > 0.8 ? 1 : 0);
            sellOperations.push(Math.random() > 0.9 ? 1 : 0);
            
            // 计算持仓价值
            holdingValues.push(Math.round(stockValue * priceValue));
          }
          
          return { dates, fullDates, stock, prices, profits, buyOperations, sellOperations, holdingValues };
        };
        
        this.state.data = [];
        const now = new Date();
        const usedNames = new Set();
        const totalItems = baseItems; // 根据设备性能动态调整
        
        // 预生成一些常用数据以提升性能
        const categoryNames = this.state.categories.map(c => c.name);
        const categoryMap = new Map();
        this.state.categories.forEach(cat => {
          categoryMap.set(cat.name, cat.subs || []);
        });
        const iconCount = CONFIG.DEFAULT_ICONS.length;
        
        // 追踪总记录数
        let totalRecords = 0;
        
        for (let i = 0; i < totalItems; i++) {
          const name = this.generateUniqueName(i, usedNames);
          usedNames.add(name);
          
          // 使用预生成的数组避免重复计算
          const cat = categoryNames[Math.floor(Math.random() * categoryNames.length)];
          const subCategories = categoryMap.get(cat) || [];
          const subCat = subCategories.length > 0 && Math.random() > 0.2
            ? subCategories[Math.floor(Math.random() * subCategories.length)]
            : undefined;
          
          const hist = this.generatePriceHistory(now);
          const inventory = generateInventoryData(hist[hist.length - 1].close);
          const item = { 
            name, 
            price: hist[hist.length - 1].close, 
            category: cat, 
            history: hist,
            icon: CONFIG.DEFAULT_ICONS[Math.floor(Math.random() * iconCount)],
            inventory: inventory,
            isFavorite: false  // 默认不收藏
          };
          
          if (subCat) item.subCategory = subCat;
          this.state.data.push(item);
          
          // 累加记录数：价格历史 + 库存操作历史
          totalRecords += hist.length + (inventory.operationHistory?.length || 0);
          
          // 每生成50个道具后让出控制权，避免UI阻塞
          if (i % 50 === 0 && i > 0) {
            await new Promise(resolve => setTimeout(resolve, 0));
            
            // 更新进度显示
            const progress = Math.round((i / totalItems) * 100);
            const elapsedTime = Math.round((Date.now() - startTime) / 1000);
            
            this.updateGenerationProgress({
              progress: progress,
              current: i,
              total: totalItems,
              time: elapsedTime,
              recordCount: totalRecords,
              status: `正在生成道具数据... (${i}/${totalItems})`
            });
          }
        }
        
        const saved = await this.state.saveData();
        const totalTime = Math.round((Date.now() - startTime) / 1000);
        
        if (saved) {
          this.renderCategories();
          this.renderList(this.elements.searchInput.value.trim());
          
          // 显示完成状态
          this.updateGenerationProgress({
            progress: 100,
            current: totalItems,
            total: totalItems,
            time: totalTime,
            recordCount: totalRecords,
            status: '数据生成完成！正在保存...'
          });
          
          await new Promise(resolve => setTimeout(resolve, 500));
          
          this.hideGenerationProgressModal();
          this.showToast(`已生成${totalItems}条示例数据，使用默认分类配置`, '✅', 'success');
        }
      }

      generateUniqueName(index, usedNames) {
        let name;
        let attempts = 0;
        
        do {
          if (index < CONFIG.WEAPON_NAMES.length && !usedNames.has(CONFIG.WEAPON_NAMES[index])) {
            name = CONFIG.WEAPON_NAMES[index];
          } else {
            const baseName = CONFIG.WEAPON_NAMES[Math.floor(Math.random() * CONFIG.WEAPON_NAMES.length)];
            const prefix = Math.random() > 0.5 ? CONFIG.WEAPON_PREFIXES[Math.floor(Math.random() * CONFIG.WEAPON_PREFIXES.length)] : '';
            const suffix = Math.random() > 0.5 ? CONFIG.WEAPON_SUFFIXES[Math.floor(Math.random() * CONFIG.WEAPON_SUFFIXES.length)] : '';
            const counter = attempts > 0 ? `#${attempts}` : '';
            name = `${prefix}${baseName}${suffix}${counter}`;
          }
          attempts++;
        } while (usedNames.has(name) && attempts < 100);
        
        if (usedNames.has(name)) name = `${name}#${index}`;
        return name;
      }

      generatePriceHistory(now) {
        const hist = [];
        let price = Math.floor(Math.random() * 8000) + 50;
        
        const recordCount = Math.floor(Math.random() * 91) + 30; // 30-120条记录
        const startDays = Math.floor(Math.random() * 90) + recordCount; // 扩展到90天
        
        for (let j = startDays; j >= startDays - recordCount + 1; j--) {
          const d = new Date(now);
          d.setDate(d.getDate() - j);
          const ds = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
          price = Math.max(20, Math.floor(price * (1 + (Math.random() - 0.5) * 0.2)));
          hist.push({close: price, date: ds});
        }
        
        return hist;
      }

      bindSearchEvents() {
        // 初始化搜索管理器
        this.searchManager = new SearchManager(this.elements.searchInput, {
          onSearch: (keyword) => this.performSearch(keyword),
          onAnimation: (type) => this.triggerSearchAnimation(type)
        });
        
        this.searchManager.bindEvents();
        
        // 绑定清除搜索按钮
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        if (clearSearchBtn) {
          clearSearchBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.elements.searchInput.value = '';
            this.elements.searchInput.focus();
            this.performSearch('');
            this.toggleClearButton();
          });
        }
        
        // 监听搜索框输入，控制清除按钮显示
        this.elements.searchInput.addEventListener('input', () => {
          this.toggleClearButton();
        });
        
        // 初始检查清除按钮显示状态
        this.toggleClearButton();
        
        // 绑定高级搜索按钮事件
        const advancedSearchBtn = document.querySelector('.advanced-search-btn');
        if (advancedSearchBtn) {
          advancedSearchBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.showAdvancedSearchModal();
          });
        }
      }
      
      // 切换清除按钮显示
      toggleClearButton() {
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        if (clearSearchBtn && this.elements.searchInput) {
          const hasContent = this.elements.searchInput.value.trim().length > 0;
          clearSearchBtn.style.display = hasContent ? 'block' : 'none';
        }
      }
      
      // 执行搜索的核心逻辑 - 优化版
      performSearch(keyword) {
        const startTime = performance.now();
        
        this.state.currentPage = 1;
        this.state.lastSearchKeyword = keyword;
        this.state.filteredCache = null;
        
        // 使用 requestIdleCallback 优化性能
        if (window.requestIdleCallback) {
          requestIdleCallback(() => {
            this.renderList(keyword);
            this.logSearchPerformance(keyword, startTime);
          });
        } else {
          setTimeout(() => {
            this.renderList(keyword);
            this.logSearchPerformance(keyword, startTime);
          }, 0);
        }
      }
      
      // 搜索性能监控
      logSearchPerformance(keyword, startTime) {
        const endTime = performance.now();
        const duration = endTime - startTime;
        
        // 只在开发环境或性能较差时记录
        if (duration > 50 || (Math.random() < 0.1)) {
          console.log(`🔍 搜索性能: "${keyword}" 耗时 ${duration.toFixed(2)}ms`);
        }
      }
      
      // 触发搜索动画 - 优化版
      triggerSearchAnimation(type) {
        this.addSearchAnimation(type);
      }
      
      // 优化的动画效果管理器
      addSearchAnimation(type) {
        const searchInput = this.elements.searchInput;
        const animationConfig = {
          shake: { duration: 600, className: 'shake' },
          pulse: { duration: 800, className: 'pulse' },
          warning: { duration: 1000, className: 'warning' },
          'no-result': { duration: 1200, className: 'no-result' }
        };
        
        const config = animationConfig[type];
        if (!config) return;
        
        // 移除所有动画类
        Object.values(animationConfig).forEach(anim => {
          searchInput.classList.remove(anim.className);
        });
        
        // 使用 requestAnimationFrame 确保动画流畅
        requestAnimationFrame(() => {
          searchInput.classList.add(config.className);
          
          // 动画结束后移除class
          setTimeout(() => {
            searchInput.classList.remove(config.className);
          }, config.duration);
        });
      }

      // 生成无匹配结果的动画化HTML
      generateNoResultsHTML(searchKeyword) {
        const hasKeyword = searchKeyword && searchKeyword.trim() !== '';
        const suggestions = this.generateSearchSuggestions(searchKeyword);
        const hasData = this.state.data && this.state.data.length > 0;
        
        return `
          <div class="no-results-container">
            <div class="no-results-icon">${hasKeyword ? '🔍' : '📦'}</div>
            <div class="no-results-title">
              ${hasKeyword ? '未找到匹配的道具' : '暂无道具数据'}
            </div>
            <div class="no-results-subtitle">
              ${hasKeyword ? 
                `没有找到包含 "${Utils.esc(searchKeyword)}" 的道具` : 
                (hasData ? '请尝试其他搜索关键词' : '请添加一些道具数据或生成示例数据')
              }
            </div>
            ${suggestions.length > 0 ? `
              <div class="no-results-suggestions">
                ${suggestions.map(suggestion => `
                  <button class="no-results-suggestion" data-suggestion="${Utils.esc(suggestion)}" type="button">
                    ${suggestion}
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }
      
      // 生成搜索建议
      generateSearchSuggestions(searchKeyword) {
        if (!searchKeyword || searchKeyword.trim() === '') {
          return ['生成示例数据', '添加新道具', '查看所有分类'];
        }
        
        const suggestions = [];
        const keyword = searchKeyword.toLowerCase();
        
        // 基于搜索关键词生成建议
        if (keyword.includes('剑') || keyword.includes('刀') || keyword.includes('武器')) {
          suggestions.push('尝试搜索 "武器"', '查看 "装备" 分类', '搜索 "剑"');
        } else if (keyword.includes('药') || keyword.includes('水') || keyword.includes('恢复')) {
          suggestions.push('尝试搜索 "药品"', '查看 "消耗品" 分类', '搜索 "药水"');
        } else if (keyword.includes('石') || keyword.includes('矿') || keyword.includes('材料')) {
          suggestions.push('尝试搜索 "材料"', '查看 "资源" 分类', '搜索 "矿石"');
        } else {
          suggestions.push('尝试其他关键词', '检查拼写', '查看所有分类');
        }
        
        // 添加通用建议
        suggestions.push('清空搜索条件', '生成示例数据');
        
        return suggestions.slice(0, 4); // 最多显示4个建议
      }
      
      // 绑定无结果页面的交互事件
      bindNoResultsEvents() {
        const suggestions = document.querySelectorAll('.no-results-suggestion');
        
        // 清除旧的事件监听器，防止重复绑定
        suggestions.forEach(suggestion => {
          // 克隆节点以移除所有事件监听器
          const newSuggestion = suggestion.cloneNode(true);
          suggestion.parentNode.replaceChild(newSuggestion, suggestion);
          
          // 重新绑定事件
          newSuggestion.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            // 使用 currentTarget 确保获取的是按钮元素，而不是内部文本
            const suggestionText = e.currentTarget.getAttribute('data-suggestion');
            if (suggestionText) {
            this.handleNoResultsSuggestion(suggestionText);
            }
          });
        });
      }
      
      // 处理无结果建议的点击
      handleNoResultsSuggestion(suggestion) {
        switch (suggestion) {
          case '生成示例数据':
            // 直接调用生成示例数据方法
            this.generateSampleData();
            break;
            
          case '添加新道具':
            this.showToast('打开添加道具对话框', '➕', 'info');
            // 触发添加道具 - 使用浮动添加按钮
            const floatingAddBtn = document.getElementById('floatingAddBtn');
            if (floatingAddBtn) {
              floatingAddBtn.click();
            }
            break;
            
          case '查看所有分类':
            this.showToast('显示所有分类', '📂', 'info');
            // 重置分类为全部类型
            this.state.activeCategory = '全部类型';
            this.state.activeSubCategory = null;
            // 清空搜索
            this.elements.searchInput.value = '';
            this.state.currentPage = 1;
            this.state.lastSearchKeyword = '';
            this.state.filteredCache = null;
            this.toggleClearButton(); // 隐藏清除按钮
            this.renderCategories(); // 更新分类标签
            this.renderList(''); // 重新渲染列表
            break;
            
          case '清空搜索条件':
            this.showToast('已清空搜索条件', '🧹', 'success');
            this.elements.searchInput.value = '';
            this.state.currentPage = 1;
            this.state.lastSearchKeyword = '';
            this.state.filteredCache = null;
            this.toggleClearButton(); // 隐藏清除按钮
            this.renderList(''); // 重新渲染列表
            break;
            
          case '尝试搜索 "武器"':
          case '尝试搜索 "药品"':
          case '尝试搜索 "材料"':
            const searchTerm = suggestion.match(/"([^"]+)"/)?.[1];
            if (searchTerm) {
              this.elements.searchInput.value = searchTerm;
              this.state.currentPage = 1;
              this.state.lastSearchKeyword = searchTerm;
              this.state.filteredCache = null;
              this.renderList(searchTerm); // 重新渲染列表
              this.showToast(`搜索: ${searchTerm}`, '🔍', 'info');
            }
            break;
            
          case '查看 "装备" 分类':
          case '查看 "消耗品" 分类':
          case '查看 "资源" 分类':
            const categoryName = suggestion.match(/"([^"]+)"/)?.[1];
            if (categoryName) {
              // 这里可以添加分类切换逻辑
              this.showToast(`切换到 ${categoryName} 分类`, '📂', 'info');
            }
            break;
            
          case '搜索 "剑"':
          case '搜索 "药水"':
          case '搜索 "矿石"':
            const searchWord = suggestion.match(/"([^"]+)"/)?.[1];
            if (searchWord) {
              this.elements.searchInput.value = searchWord;
              this.state.currentPage = 1;
              this.state.lastSearchKeyword = searchWord;
              this.state.filteredCache = null;
              this.renderList(searchWord);
              this.showToast(`搜索: ${searchWord}`, '🔍', 'info');
            }
            break;
            
          case '尝试其他关键词':
            this.showToast('请尝试不同的搜索关键词', '💡', 'info');
            this.elements.searchInput.focus();
            break;
            
          case '检查拼写':
            this.showToast('请检查搜索关键词的拼写', '✏️', 'info');
            this.elements.searchInput.focus();
            break;
            
          default:
            this.showToast(`执行: ${suggestion}`, '⚡', 'info');
        }
      }

      // 应用高级搜索
      applyAdvancedSearch() {
        // 获取搜索条件
        const nameInput = document.getElementById('advancedSearchName');
        const nameKeyword = nameInput ? nameInput.value.trim() : '';
        
        // 获取分类
        const categoryRadio = document.querySelector('input[name="advancedCategory"]:checked');
        const category = categoryRadio ? categoryRadio.value : 'all';
        
        // 获取价格范围
        const priceMinInput = document.getElementById('advancedPriceMin');
        const priceMaxInput = document.getElementById('advancedPriceMax');
        const priceMin = priceMinInput && priceMinInput.value ? parseFloat(priceMinInput.value) : 0;
        const priceMax = priceMaxInput && priceMaxInput.value ? parseFloat(priceMaxInput.value) : Number.MAX_SAFE_INTEGER;
        
        // 获取价格变化筛选
        const priceUp = document.getElementById('advancedPriceUp');
        const priceDown = document.getElementById('advancedPriceDown');
        const priceNeutral = document.getElementById('advancedPriceNeutral');
        const noChange = document.getElementById('advancedNoChange');
        
        const priceChangeFilters = {
          up: priceUp ? priceUp.checked : false,
          down: priceDown ? priceDown.checked : false,
          neutral: priceNeutral ? priceNeutral.checked : false,
          noChange: noChange ? noChange.checked : false
        };
        
        // 获取排序方式
        const sortRadio = document.querySelector('input[name="advancedSort"]:checked');
        const sortBy = sortRadio ? sortRadio.value : 'price';
        
        // 保存高级搜索条件到状态
        this.state.advancedSearchFilters = {
          priceMin,
          priceMax,
          priceChange: priceChangeFilters,
          sortBy
        };
        
        // 应用搜索关键词到主搜索框
        if (nameKeyword) {
          this.elements.searchInput.value = nameKeyword;
        }
        
        // 切换分类 - 使用正确的变量名
        if (category === 'all') {
          this.state.activeCategory = '全部类型';
        } else {
          this.state.activeCategory = category;
        }
        
        // 更新分类显示
        this.renderCategories();
        
        // 执行搜索
        this.state.currentPage = 1;
        this.state.lastSearchKeyword = nameKeyword;
        this.state.filteredCache = null;
        
        // 重新渲染列表
        this.renderList(nameKeyword);
        
        // 关闭模态框
        this.closeModal();
        
        this.showToast('高级搜索已应用', '✅', 'success');
      }
      
      // 清空高级搜索
      clearAdvancedSearch() {
        this.closeModal();
        // 重置所有输入
        const nameInput = document.getElementById('advancedSearchName');
        if (nameInput) nameInput.value = '';
        
        const categoryRadio = document.querySelector('input[name="advancedCategory"][value="all"]');
        if (categoryRadio) categoryRadio.checked = true;
        
        const priceUp = document.getElementById('advancedPriceUp');
        const priceDown = document.getElementById('advancedPriceDown');
        const priceNeutral = document.getElementById('advancedPriceNeutral');
        const noChange = document.getElementById('advancedNoChange');
        
        if (priceUp) priceUp.checked = false;
        if (priceDown) priceDown.checked = false;
        if (priceNeutral) priceNeutral.checked = false;
        if (noChange) noChange.checked = false;
        
        // 同步清空主搜索框和分类
        this.elements.searchInput.value = '';
        this.state.activeCategory = '全部类型';
        this.state.currentPage = 1;
        this.state.lastSearchKeyword = '';
        this.state.filteredCache = null;
        
        // 清空高级搜索过滤器
        this.state.advancedSearchFilters = null;
        
        // 隐藏清除按钮
        this.toggleClearButton();
        
        // 更新分类显示和列表
        this.renderCategories();
        this.renderList('');
        
        this.showToast('搜索条件已重置', '🔄', 'info');

      bindPaginationEvents() {
        this.elements.firstPageBtn.addEventListener('click', () => this.goToPage(1));
        this.elements.prevPageBtn.addEventListener('click', () => {
          if (this.state.currentPage > 1) {
            this.goToPage(this.state.currentPage - 1);
          }
        });
        this.elements.nextPageBtn.addEventListener('click', () => this.goToPage(this.state.currentPage + 1));
        this.elements.lastPageBtn.addEventListener('click', () => {
          const filtered = this.state.filterItems(this.elements.searchInput.value.trim());
          const totalPages = Math.ceil(filtered.length / this.state.pageSize);
          this.goToPage(totalPages);
        });
        this.elements.pageSizeSelect.addEventListener('change', (e) => {
          this.state.pageSize = parseInt(e.target.value);
          this.state.currentPage = 1;
          this.renderList(this.elements.searchInput.value.trim());
        });
      }

      bindThemeEvents() {
        // 使用ThemeManager监听系统主题变化
        if (window.ThemeManager) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (this.state.themePref === 'auto') {
              window.ThemeManager.setTheme('auto');
            }
          });
        } else {
          // 降级处理
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
          if (this.state.themePref === 'auto') {
            this.setTheme('auto');
          }
        });
        }
      }
      
      // ==================== 库存管理功能 ====================
      
      bindInventoryEvents(item, modal) {
        const currentStockEl = modal.querySelector('#currentStock');
        const quantityInput = modal.querySelector('#stockQuantity');
        const buyBtn = modal.querySelector('#buyStock');
        const sellBtn = modal.querySelector('#sellStock');
        const smartSuggestions = modal.querySelector('#smartSuggestions');
        const operationHistory = modal.querySelector('#operationHistory');
        const totalInvestmentEl = modal.querySelector('#totalInvestment');
        const averageCostEl = modal.querySelector('#averageCost');
        const potentialProfitEl = modal.querySelector('#potentialProfit');
        
        // 初始化库存数据
        if (!item.inventory) {
          item.inventory = {
            currentStock: 0,
            totalInvestment: 0,
            averageCost: 0,
            operationHistory: [],
            chartData: []
          };
        }
        
        // 更新库存显示
        this.updateInventoryDisplay(item, modal);
        
        // 更新操作历史
        this.updateOperationHistory(item, modal);
        
        // 防止重复绑定事件
        if (buyBtn && !buyBtn._inventoryEventBound) {
          buyBtn._inventoryEventBound = true;
          
          // 绑定购入按钮事件
          buyBtn.addEventListener('click', () => {
          const quantity = parseInt(quantityInput.value);
          if (!quantity || quantity <= 0) {
            this.showInventoryError(quantityInput, '请输入有效数量');
            this.toast.setCurrentItem(item);
            this.toast.warning('请输入有效数量', '⚠️');
            return;
          }
          
          // 检查数量是否超过限制
          if (quantity > 100000000) {
            this.showInventoryError(quantityInput, '数量过大');
            this.toast.setCurrentItem(item);
            this.toast.warning('购入数量不能超过1亿件', '⚠️');
            return;
          }
          
          this.buyStock(item, quantity, modal);
          });
        }
        
        if (sellBtn && !sellBtn._inventoryEventBound) {
          sellBtn._inventoryEventBound = true;
          
          // 绑定卖出按钮事件
          sellBtn.addEventListener('click', () => {
          const quantity = parseInt(quantityInput.value);
          if (!quantity || quantity <= 0) {
            this.showInventoryError(quantityInput, '请输入有效数量');
            this.toast.setCurrentItem(item);
            this.toast.warning('请输入有效数量', '⚠️');
            return;
          }
          
          if (quantity > item.inventory.currentStock) {
            this.showInventoryError(quantityInput, '库存不足');
            this.toast.setCurrentItem(item);
            this.toast.error('库存不足，无法卖出！', '🚫');
            return;
          }
          
          this.sellStock(item, quantity, modal);
          });
        }
        
        // 绑定图表控制按钮
        const chartBtns = modal.querySelectorAll('.chart-btn');
        chartBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            chartBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // 获取当前选中的图表类型
            const activeChartTab = modal.querySelector('.chart-tab-btn.active');
            const chartType = activeChartTab ? activeChartTab.dataset.chart : 'stock';
            
            const period = btn.dataset.period === 'all' ? 'all' : parseInt(btn.dataset.period);
            
            // 显示对应的toast通知
            this.toast.setCurrentItem(item);
            const periodText = period === 'all' ? '全部数据' : `${period}天`;
            this.toast.info(`切换到${periodText}视图`, '📊');
            
            this.updateInventoryChart(item, period, modal, chartType);
          });
        });
        
        // 绑定图表标签按钮
        const chartTabBtns = modal.querySelectorAll('.chart-tab-btn');
        chartTabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            chartTabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const chartType = btn.dataset.chart;
            this.switchChartType(item, chartType, modal);
          });
        });
        
        // 初始化图表（默认显示库存数量图表）
        this.updateInventoryChart(item, 7, modal, 'stock');
        
        // 绑定历史记录事件
        this.bindHistoryEvents(item, modal);
        
        // 绑定AI建议事件
        this.bindAIEvents(item, modal);
      }
      
      async buyStock(item, quantity, modal) {
        const currentPrice = item.price;
        const totalCost = currentPrice * quantity;
        const beforeStock = item.inventory.currentStock;

        // 更新库存数据
        item.inventory.currentStock += quantity;
        item.inventory.totalInvestment += totalCost;
        item.inventory.averageCost = item.inventory.totalInvestment / item.inventory.currentStock;

        // 添加操作记录
        const operation = {
          type: 'buy',
          quantity: quantity,
          price: currentPrice,
          totalCost: totalCost,
          timestamp: Date.now(),
          stockAfter: item.inventory.currentStock
        };

        item.inventory.operationHistory.unshift(operation);

        // 清除预生成的图表数据，强制使用实时历史记录
        if (item.inventory.chartData) {
          console.log('🗑️ 清除预生成的图表数据，强制使用实时历史记录');
          delete item.inventory.chartData;
        }

        // 更新显示
        this.updateInventoryDisplay(item, modal);
        this.updateSmartSuggestions(item, modal);

        // 更新图表
        this.updateInventoryChartAfterOperation(item, modal);
        // 更新历史记录（如果存在）
        this.updateHistoryDisplay(item, modal);

        // 显示成功提示
        this.toast.setCurrentItem(item);
        this.toast.success(`成功购入 ${quantity} 件！库存 +${quantity}`, '📦');

        // 清空输入框
        const quantityInput = modal.querySelector('#stockQuantity');
        if (quantityInput) {
          quantityInput.value = '';
        }

        // 保存数据
        await this.state.saveItemQuick(item);

        // 保存交易记录到 records 表
        await this.state.db.saveRecord({
          itemId: item.id,
          itemName: item.name,
          opType: 'buy',
          quantity: quantity,
          price: currentPrice,
          totalAmount: totalCost,
          beforeStock: beforeStock,
          afterStock: item.inventory.currentStock,
          note: `购入${quantity}件，单价¥${currentPrice}`
        });

        // 更新用户统计
        await this.state.db.updateUserStats();
      }
      
      async sellStock(item, quantity, modal) {
        const currentPrice = item.price;
        const totalRevenue = currentPrice * quantity;
        const beforeStock = item.inventory.currentStock;

        // 更新库存数据
        item.inventory.currentStock -= quantity;
        if (item.inventory.currentStock > 0) {
          item.inventory.averageCost = item.inventory.totalInvestment / item.inventory.currentStock;
        } else {
          item.inventory.totalInvestment = 0;
          item.inventory.averageCost = 0;
        }

        // 添加操作记录
        const operation = {
          type: 'sell',
          quantity: quantity,
          price: currentPrice,
          totalRevenue: totalRevenue,
          timestamp: Date.now(),
          stockAfter: item.inventory.currentStock
        };

        item.inventory.operationHistory.unshift(operation);

        // 清除预生成的图表数据，强制使用实时历史记录
        if (item.inventory.chartData) {
          console.log('🗑️ 清除预生成的图表数据，强制使用实时历史记录');
          delete item.inventory.chartData;
        }

        // 更新显示
        this.updateInventoryDisplay(item, modal);
        this.updateSmartSuggestions(item, modal);

        // 更新图表
        this.updateInventoryChartAfterOperation(item, modal);
        // 更新历史记录（如果存在）
        this.updateHistoryDisplay(item, modal);
        // 显示成功提示
        this.toast.setCurrentItem(item);
        this.toast.success(`卖出 ${quantity} 件！库存 -${quantity}`, '💰');

        // 清空输入框
        const quantityInput = modal.querySelector('#stockQuantity');
        if (quantityInput) {
          quantityInput.value = '';
        }

        // 保存数据
        await this.state.saveItemQuick(item);

        // 保存交易记录到 records 表
        await this.state.db.saveRecord({
          itemId: item.id,
          itemName: item.name,
          opType: 'sell',
          quantity: quantity,
          price: currentPrice,
          totalAmount: totalRevenue,
          beforeStock: beforeStock,
          afterStock: item.inventory.currentStock,
          note: `卖出${quantity}件，单价¥${currentPrice}`
        });

        // 更新用户统计
        await this.state.db.updateUserStats();
      }
      
      updateInventoryDisplay(item, modal) {
        const currentStockEl = modal.querySelector('#currentStock');
        const totalInvestmentEl = modal.querySelector('#totalInvestment');
        const averageCostEl = modal.querySelector('#averageCost');
        const costRecoveryRateEl = modal.querySelector('#costRecoveryRate');
        const potentialProfitEl = modal.querySelector('#potentialProfit');
        
        // 检查DOM元素是否存在
        if (!currentStockEl || !totalInvestmentEl || !averageCostEl || !costRecoveryRateEl || !potentialProfitEl) {
          console.warn('库存显示元素未找到，跳过更新');
          return;
        }
        
        // 确保inventory对象存在
        if (!item.inventory) {
          console.warn('道具inventory对象不存在，跳过更新');
          return;
        }
        
        // 获取旧的库存值
        const oldStock = parseInt(currentStockEl.textContent) || 0;
        const newStock = item.inventory.currentStock || 0;
        
        // 更新当前库存并添加动画
        currentStockEl.textContent = newStock;
        
        // 移除之前的动画类
        currentStockEl.classList.remove('stock-increase', 'stock-decrease', 'stock-pulse');
        
        // 根据库存变化添加不同的动画
        if (newStock > oldStock) {
          // 库存增加 - 绿色上升动画
          currentStockEl.classList.add('stock-increase');
          setTimeout(() => currentStockEl.classList.remove('stock-increase'), 1200);
        } else if (newStock < oldStock) {
          // 库存减少 - 红色下降动画
          currentStockEl.classList.add('stock-decrease');
          setTimeout(() => currentStockEl.classList.remove('stock-decrease'), 1200);
        } else {
          // 库存未变化 - 脉冲动画
          currentStockEl.classList.add('stock-pulse');
          setTimeout(() => currentStockEl.classList.remove('stock-pulse'), 800);
        }
        
        // 更新统计信息
        totalInvestmentEl.textContent = `¥${Utils.formatPrice(item.inventory.totalInvestment || 0, this.state.enableFormatPrice)}`;
        averageCostEl.textContent = `¥${Utils.formatPrice(item.inventory.averageCost || 0, this.state.enableFormatPrice)}`;
        
        // 计算成本回收率
        const costRecoveryRate = this.calculateCostRecoveryRate(item);
        costRecoveryRateEl.textContent = `${costRecoveryRate.toFixed(1)}%`;
        costRecoveryRateEl.style.color = costRecoveryRate >= 100 ? '#10b981' : costRecoveryRate >= 50 ? '#f59e0b' : '#ef4444';
        
        // 计算潜在收益
        const currentValue = (item.inventory.currentStock || 0) * (item.price || 0);
        const potentialProfit = currentValue - (item.inventory.totalInvestment || 0);
        potentialProfitEl.textContent = `¥${Utils.formatPrice(potentialProfit, this.state.enableFormatPrice)}`;
        potentialProfitEl.style.color = potentialProfit >= 0 ? '#10b981' : '#ef4444';
      }
      
      updateOperationHistory(item, modal) {
        const operationHistoryEl = modal.querySelector('#operationHistory');
        const historyListEl = modal.querySelector('#historyList');
        
        // 检查DOM元素是否存在
        if (!operationHistoryEl && !historyListEl) {
          console.warn('操作历史显示元素未找到，跳过更新');
          return;
        }
        
        // 确保inventory对象存在
        if (!item.inventory || !item.inventory.operationHistory) {
          console.warn('道具inventory对象或操作历史不存在，跳过更新');
          return;
        }
        
        const history = item.inventory.operationHistory;
        const targetEl = operationHistoryEl || historyListEl;
        
        if (!targetEl) return;
        
        // 按时间倒序排列（最新的在前）
        const sortedHistory = [...history].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        // 生成操作历史HTML
        const historyHTML = sortedHistory.slice(0, 20).map(record => {
          const time = new Date(record.timestamp);
          const timeStr = this.formatTimeAgo(time);
          
          let actionText = '';
          let actionClass = '';
          let stockText = '';
          
          switch (record.type) {
            case 'buy':
              actionText = `购入 ${record.quantity} 件`;
              actionClass = 'history-buy';
              stockText = `库存: ${record.newStock || 0}`;
              break;
            case 'sell':
              actionText = `卖出 ${record.quantity} 件`;
              actionClass = 'history-sell';
              stockText = `库存: ${record.newStock || 0}`;
              break;
            case 'price_change':
              actionText = `价格变动: ¥${Utils.formatPrice(record.oldPrice)} → ¥${Utils.formatPrice(record.newPrice)}`;
              actionClass = 'history-price';
              stockText = `库存: ${record.stock || 0}`;
              break;
            case 'system':
              actionText = record.description || '系统调整';
              actionClass = 'history-system';
              stockText = `库存: ${record.stock || 0}`;
              break;
            default:
              actionText = record.description || '未知操作';
              actionClass = 'history-other';
              stockText = `库存: ${record.stock || 0}`;
          }
          
          return `
            <div class="history-item ${actionClass}">
              <span class="history-time">${timeStr}</span>
              <span class="history-action">${actionText}</span>
              <span class="history-stock">${stockText}</span>
            </div>
          `;
        }).join('');
        
        // 更新HTML内容
        targetEl.innerHTML = historyHTML || `
          <div class="history-item">
            <span class="history-time">刚刚</span>
            <span class="history-action">系统初始化</span>
            <span class="history-stock">库存: 0</span>
          </div>
        `;
      }
      
      formatTimeAgo(date) {
        const now = new Date();
        const diff = now - date;
        const seconds = Math.floor(diff / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);
        
        if (seconds < 60) return '刚刚';
        if (minutes < 60) return `${minutes}分钟前`;
        if (hours < 24) return `${hours}小时前`;
        if (days < 7) return `${days}天前`;
        
        return date.toLocaleDateString('zh-CN', {
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
      }
      
      calculateCostRecoveryRate(item) {
        if (!item.inventory || !item.inventory.operationHistory) return 0;
        
        const history = item.inventory.operationHistory;
        let totalBuyAmount = 0;
        let totalSellAmount = 0;
        
        history.forEach(record => {
          if (record.type === 'buy' && record.totalCost) {
            totalBuyAmount += record.totalCost;
          } else if (record.type === 'sell' && record.totalRevenue) {
            totalSellAmount += record.totalRevenue;
          }
        });
        
        if (totalBuyAmount === 0) return 0;
        
        return (totalSellAmount / totalBuyAmount) * 100;
      }
      
      updatePriceStats(item) {
        const priceStatsAvg = document.getElementById('priceStatsAvg');
        const priceStatsCount = document.getElementById('priceStatsCount');
        const priceStatsMax = document.getElementById('priceStatsMax');
        const priceStatsMaxDate = document.getElementById('priceStatsMaxDate');
        const priceStatsMin = document.getElementById('priceStatsMin');
        const priceStatsMinDate = document.getElementById('priceStatsMinDate');
        
        if (!priceStatsAvg || !priceStatsCount || !priceStatsMax || !priceStatsMaxDate || !priceStatsMin || !priceStatsMinDate) {
          return;
        }
        
        if (!item.history || item.history.length === 0) {
          priceStatsAvg.textContent = '-';
          priceStatsCount.textContent = '0';
          priceStatsMax.textContent = '-';
          priceStatsMaxDate.textContent = '-';
          priceStatsMin.textContent = '-';
          priceStatsMinDate.textContent = '-';
          return;
        }
        
        const prices = item.history.map(h => h.close);

      generateSmartSuggestions(item) {
        const suggestions = [];
        const stock = item.inventory.currentStock;
        const recentOps = item.inventory.operationHistory.slice(0, 10);
        const totalOps = item.inventory.operationHistory.length;
        
        // 1. 库存状态建议
        if (stock === 0) {
          suggestions.push({ icon: '🈚', text: '当前库存已清空，请尽快补货' });
        } else if (stock < 5) {
          suggestions.push({ icon: '⚠️', text: '库存严重不足（<5件），建议立即补货' });
        } else if (stock < 30) {
          suggestions.push({ icon: '📦', text: '库存偏低（<30件），建议适量购入' });
        } else if (stock > 300) {
          suggestions.push({ icon: '📊', text: '库存量过高（>300件），建议暂停购入' });
        } else if (stock > 100) {
          suggestions.push({ icon: '📈', text: '库存量偏高（>100件），建议控制购入节奏' });
        } else {
          suggestions.push({ icon: '✅', text: '库存变化平稳，处于安全区间' });
        }
        
        // 2. 操作模式建议
        const buyCount = recentOps.filter(op => op.type === 'buy').length;
        const sellCount = recentOps.filter(op => op.type === 'sell').length;
        const totalRecentOps = buyCount + sellCount;
        
        if (totalRecentOps === 0) {
          suggestions.push({ icon: '💤', text: '近期无操作记录，建议开始交易活动' });
        } else if (buyCount >= 4) {
          suggestions.push({ icon: '🛒', text: '连续多次购入，建议关注平均成本变化' });
        } else if (sellCount >= 4) {
          suggestions.push({ icon: '💰', text: '连续卖出操作，注意保持库存充足' });
        } else if (buyCount > sellCount * 2) {
          suggestions.push({ icon: '📈', text: '购入频率过高，建议平衡买卖节奏' });
        } else if (sellCount > buyCount * 2) {
          suggestions.push({ icon: '📉', text: '卖出频率过高，注意库存补充' });
        } else {
          suggestions.push({ icon: '⚖️', text: '买卖操作平衡，保持良好的交易节奏' });
        }
        
        // 3. 财务分析建议
        const totalInvestment = item.inventory.totalInvestment || 0;
        const totalRevenue = this.calculateTotalRevenue(item);
        const currentValue = stock * item.price;
        const potentialProfit = currentValue - totalInvestment;
        const profitMargin = totalInvestment > 0 ? (potentialProfit / totalInvestment) * 100 : 0;
        
        if (totalInvestment === 0) {
          suggestions.push({ icon: '💡', text: '尚未开始投资，建议制定投资策略' });
        } else if (profitMargin > 50) {
          suggestions.push({ icon: '🎉', text: `投资回报率${profitMargin.toFixed(1)}%，表现优秀` });
        } else if (profitMargin > 20) {
          suggestions.push({ icon: '📊', text: `投资回报率${profitMargin.toFixed(1)}%，表现良好` });
        } else if (profitMargin > 0) {
          suggestions.push({ icon: '📈', text: `投资回报率${profitMargin.toFixed(1)}%，略有盈利` });
        } else if (profitMargin > -20) {
          suggestions.push({ icon: '⚠️', text: `投资回报率${profitMargin.toFixed(1)}%，需要关注` });
        } else {
          suggestions.push({ icon: '🚨', text: `投资回报率${profitMargin.toFixed(1)}%，建议调整策略` });
        }
        
        // 4. 市场趋势建议
        if (recentOps.length >= 3) {
          const recentPrices = recentOps.map(op => op.price);
          const priceTrend = this.calculatePriceTrend(recentPrices);
          const avgPrice = recentPrices.reduce((sum, price) => sum + price, 0) / recentPrices.length;
          const currentPrice = item.price;
          const priceChange = ((currentPrice - avgPrice) / avgPrice) * 100;
          
          if (priceTrend > 0.1) {
            suggestions.push({ icon: '📈', text: '价格呈上涨趋势，可考虑适量卖出' });
          } else if (priceTrend < -0.1) {
            suggestions.push({ icon: '📉', text: '价格呈下跌趋势，可考虑低价购入' });
          } else if (priceChange > 10) {
            suggestions.push({ icon: '💰', text: `当前价格比近期均价高${priceChange.toFixed(1)}%，可考虑卖出` });
          } else if (priceChange < -10) {
            suggestions.push({ icon: '🛒', text: `当前价格比近期均价低${Math.abs(priceChange).toFixed(1)}%，可考虑购入` });
          } else {
            suggestions.push({ icon: '📊', text: '价格波动平稳，适合正常交易' });
          }
        } else {
          suggestions.push({ icon: '🔍', text: '操作记录较少，建议增加交易频次以获取更多数据' });
        }
        
        // 确保返回4个建议
        return suggestions.slice(0, 4);
      }
      
      calculatePriceTrend(prices) {
        if (prices.length < 2) return 0;
        
        const firstHalf = prices.slice(0, Math.floor(prices.length / 2));
        const secondHalf = prices.slice(Math.floor(prices.length / 2));
        
        const firstAvg = firstHalf.reduce((sum, price) => sum + price, 0) / firstHalf.length;
        const secondAvg = secondHalf.reduce((sum, price) => sum + price, 0) / secondHalf.length;
        
        return (secondAvg - firstAvg) / firstAvg;
      }

      updateTrendStats(item, chartData, period, modal) {
        const stockChangeEl = modal.querySelector('#stockChange');

        const avgStockEl = modal.querySelector('#avgStock');
        const stockVolatilityEl = modal.querySelector('#stockVolatility');
        
        if (!stockChangeEl || !stockChangeRateEl || !avgStockEl || !stockVolatilityEl) return;
        
        const stockData = chartData.stock;
        const currentStock = item.inventory.currentStock;
        const initialStock = stockData.length > 0 ? stockData[0] : currentStock;
        
        // 1. 库存变化 - 计算期间内的库存变化
        const stockChange = currentStock - initialStock;
        const changeText = stockChange >= 0 ? `+${stockChange}` : `${stockChange}`;
        stockChangeEl.textContent = changeText;
        stockChangeEl.style.color = stockChange >= 0 ? '#10b981' : '#ef4444';
        
        // 添加趋势图标
        const changeIcon = stockChange > 0 ? '📈' : stockChange < 0 ? '📉' : '➡️';
        stockChangeEl.setAttribute('title', `期间内库存${stockChange > 0 ? '增加' : stockChange < 0 ? '减少' : '无变化'} ${Math.abs(stockChange)}件`);
        
        // 2. 变化率 - 计算相对变化百分比
        const changeRate = initialStock > 0 ? (stockChange / initialStock) * 100 : 0;
        const rateText = `${changeRate >= 0 ? '+' : ''}${changeRate.toFixed(1)}%`;
        stockChangeRateEl.textContent = rateText;
        stockChangeEl.style.color = changeRate >= 0 ? '#10b981' : '#ef4444';
        
        // 添加变化率描述
        let rateDescription = '';
        if (Math.abs(changeRate) > 50) {
          rateDescription = changeRate > 0 ? '大幅增长' : '大幅下降';
        } else if (Math.abs(changeRate) > 20) {
          rateDescription = changeRate > 0 ? '显著增长' : '显著下降';
        } else if (Math.abs(changeRate) > 5) {
          rateDescription = changeRate > 0 ? '温和增长' : '温和下降';
        } else {
          rateDescription = '基本稳定';
        }
        stockChangeRateEl.setAttribute('title', `库存变化率${rateDescription}`);
        
        // 3. 平均库存 - 计算期间内的平均库存水平
        const avgStock = stockData.length > 0 ? stockData.reduce((sum, val) => sum + val, 0) / stockData.length : 0;
        const avgStockText = Math.round(avgStock);
        avgStockEl.textContent = avgStockText;
        
        // 添加平均库存分析
        const avgVsCurrent = ((currentStock - avgStock) / avgStock) * 100;
        let avgDescription = '';
        if (Math.abs(avgVsCurrent) > 20) {
          avgDescription = currentStock > avgStock ? '高于平均水平' : '低于平均水平';
        } else {
          avgDescription = '接近平均水平';
        }
        avgStockEl.setAttribute('title', `期间平均库存${avgStockText}件，当前${avgDescription}`);
        
        // 4. 库存波动 - 计算库存变化的标准差和波动性
        const variance = stockData.length > 1 ? 
          stockData.reduce((sum, val) => sum + Math.pow(val - avgStock, 2), 0) / (stockData.length - 1) : 0;
        const volatility = Math.sqrt(variance);
        const volatilityText = volatility.toFixed(1);
        stockVolatilityEl.textContent = volatilityText;
        
        // 添加波动性分析
        let volatilityDescription = '';
        const volatilityRate = avgStock > 0 ? (volatility / avgStock) * 100 : 0;
        if (volatilityRate > 30) {
          volatilityDescription = '波动剧烈';
          stockVolatilityEl.style.color = '#ef4444';
        } else if (volatilityRate > 15) {
          volatilityDescription = '波动较大';
          stockVolatilityEl.style.color = '#f59e0b';
        } else if (volatilityRate > 5) {
          volatilityDescription = '波动适中';
          stockVolatilityEl.style.color = '#10b981';
        } else {
          volatilityDescription = '波动较小';
          stockVolatilityEl.style.color = '#6b7280';
        }
        stockVolatilityEl.setAttribute('title', `库存波动性${volatilityDescription}，标准差${volatilityText}`);
        
        // 添加额外的趋势分析
        this.addTrendAnalysis(item, chartData, period, modal);
      }
      
      addTrendAnalysis(item, chartData, period, modal) {
        // 计算趋势线斜率
        const stockData = chartData.stock;
        if (stockData.length < 2) return;
        
        // 使用最小二乘法计算趋势线
        const n = stockData.length;
        const xSum = n * (n - 1) / 2;
        const ySum = stockData.reduce((sum, val) => sum + val, 0);
        const xySum = stockData.reduce((sum, val, index) => sum + val * index, 0);
        const x2Sum = n * (n - 1) * (2 * n - 1) / 6;
        
        const slope = (n * xySum - xSum * ySum) / (n * x2Sum - xSum * xSum);
        const trendStrength = Math.abs(slope);
        
        // 在趋势统计区域添加趋势指示器
        const trendStats = modal.querySelector('.trend-stats');
        if (trendStats && !trendStats.querySelector('.trend-indicator')) {
          const trendIndicator = document.createElement('div');
          trendIndicator.className = 'trend-indicator';
          trendIndicator.style.cssText = `
            position: absolute;
            top: -10px;
            right: 10px;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--fg);
          `;
          
          let trendText = '';
          let trendColor = '';
          if (trendStrength < 0.5) {
            trendText = '📊 平稳';
            trendColor = '#6b7280';
          } else if (slope > 0) {
            trendText = '📈 上升';
            trendColor = '#10b981';
          } else {
            trendText = '📉 下降';
            trendColor = '#ef4444';
          }
          
          trendIndicator.textContent = trendText;
          trendIndicator.style.color = trendColor;
          trendIndicator.setAttribute('title', `趋势强度: ${trendStrength.toFixed(2)}`);
          
          trendStats.style.position = 'relative';
          trendStats.appendChild(trendIndicator);
        }
      }

      generateInventoryChartData(item, period) {
        console.log('🔍 generateInventoryChartData 开始:', {
          itemName: item.name,
          hasInventory: !!item.inventory,
          hasOperationHistory: !!(item.inventory && item.inventory.operationHistory),
          operationHistoryLength: item.inventory?.operationHistory?.length || 0,
          period: period
        });
        
        const dates = [];
        const fullDates = []; // 完整日期用于tooltip
        const stock = [];
        const prices = [];
        const profits = [];
        const buyOperations = [];
        const sellOperations = [];
        const holdingValues = [];
        const now = new Date();
        const days = period === 'all' ? 365 : period; // 全部数据设为365天，覆盖一年
        
        // 生成基础时间序列
        for (let i = days - 1; i >= 0; i--) {
          const date = new Date(now);
          date.setDate(date.getDate() - i);
          // 短日期用于x轴显示
          const month = (date.getMonth() + 1).toString().padStart(2, '0');
          const day = date.getDate().toString().padStart(2, '0');
          dates.push(`${month}-${day}`);
          // 完整日期+时间+星期用于tooltip显示
          fullDates.push(date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            weekday: 'short'
          }));
        }
        
        // 如果有预生成的图表数据，直接使用
        if (item.inventory && item.inventory.chartData) {
          console.log('⚠️ 使用预生成的图表数据，跳过历史记录处理:', {
            hasChartData: !!item.inventory.chartData,
            chartDataLength: item.inventory.chartData?.dates?.length || 0
          });

          const chartData = item.inventory.chartData;

          // 检查 chartData 的完整性
          if (!chartData.dates || !Array.isArray(chartData.dates)) {
            console.warn('⚠️ 预生成的图表数据不完整，清除并使用历史记录');
            delete item.inventory.chartData;
          } else {
            const dataLength = Math.min(days, chartData.dates.length);

            return {
              dates: chartData.dates.slice(-dataLength),
              fullDates: (chartData.fullDates || []).slice(-dataLength),
              stock: (chartData.stock || []).slice(-dataLength),
              prices: (chartData.prices || []).slice(-dataLength),
              profits: (chartData.profits || []).slice(-dataLength),
              buyOperations: (chartData.buyOperations || []).slice(-dataLength),
              sellOperations: (chartData.sellOperations || []).slice(-dataLength),
              holdingValues: (chartData.holdingValues || []).slice(-dataLength)
            };
          }
        }
        
        // 根据操作历史生成真实数据
        console.log('🔍 检查历史记录条件:', {
          hasInventory: !!item.inventory,
          hasOperationHistory: !!(item.inventory && item.inventory.operationHistory),
          operationHistoryLength: item.inventory?.operationHistory?.length || 0,
          conditionResult: !!(item.inventory && item.inventory.operationHistory && item.inventory.operationHistory.length > 0)
        });
        
        if (item.inventory && item.inventory.operationHistory && item.inventory.operationHistory.length > 0) {
          console.log('✅ 进入历史记录处理分支');
          const history = item.inventory.operationHistory;
          const sortedHistory = history.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
          
          console.log('📋 操作历史记录:', {
            totalRecords: history.length,
            priceChangeRecords: history.filter(h => h.type === 'price_change').length,
            buyRecords: history.filter(h => h.type === 'buy').length,
            sellRecords: history.filter(h => h.type === 'sell').length
          });
          
          // 按日期分组操作
          const dailyData = {};
          sortedHistory.forEach(op => {
            const opDate = new Date(op.timestamp);
            const month = (opDate.getMonth() + 1).toString().padStart(2, '0');
            const day = opDate.getDate().toString().padStart(2, '0');
            const date = `${month}-${day}`;
            
            if (!dailyData[date]) {
              dailyData[date] = { 
                stockChange: 0, 
                price: op.price, 
                profit: 0,
                buyCount: 0,
                sellCount: 0
              };
            }
            
            if (op.type === 'buy') {
              dailyData[date].stockChange += op.quantity;
              dailyData[date].buyCount += 1;
            } else if (op.type === 'sell') {
              dailyData[date].stockChange -= op.quantity;
              dailyData[date].sellCount += 1;
              dailyData[date].profit += (op.totalRevenue || 0) - (op.quantity * (item.inventory.averageCost || 0));
            } else if (op.type === 'price_change') {
              // 处理价格变动记录
              console.log('💰 处理价格变动记录:', {
                date: date,
                oldPrice: op.oldPrice,
                newPrice: op.newPrice,
                change: op.change,
                changePercent: op.changePercent
              });
              dailyData[date].price = op.newPrice;
            }
          });
          
          // 生成时间序列数据
          let currentStock = item.inventory.currentStock || 0;
          let cumulativeProfit = 0;
          
          // 从最早的数据开始计算
          for (let i = 0; i < dates.length; i++) {
            const dateStr = dates[i];
            
            if (dailyData[dateStr]) {
              currentStock += dailyData[dateStr].stockChange;
              cumulativeProfit += dailyData[dateStr].profit;
              // 使用该日期的价格，如果没有则使用当前价格
              const dayPrice = dailyData[dateStr].price || item.price || 100;
              prices.push(dayPrice);
              buyOperations.push(dailyData[dateStr].buyCount);
              sellOperations.push(dailyData[dateStr].sellCount);
              
              if (dailyData[dateStr].price) {
                console.log(`📅 ${dateStr} 使用历史价格:`, dayPrice);
              }
            } else {
              // 如果没有操作记录，使用当前价格
              prices.push(item.price || 100);
              buyOperations.push(0);
              sellOperations.push(0);
            }
            
            stock.push(Math.max(0, currentStock));
            profits.push(cumulativeProfit);
            // 计算持仓价值 = 当前库存 × 当前价格
            holdingValues.push(Math.max(0, currentStock) * (prices[i] || item.price || 100));
          }
        } else {
          // 没有操作历史时，返回空数据
          for (let i = 0; i < days; i++) {
            stock.push(0);
            prices.push(0);
            profits.push(0);
            buyOperations.push(0);
            sellOperations.push(0);
            holdingValues.push(0);
          }
        }
        
        return { dates, fullDates, stock, prices, profits, buyOperations, sellOperations, holdingValues };
      }
      
      showInventoryError(input, message) {
        input.classList.add('error');
        setTimeout(() => input.classList.remove('error'), 500);
      }
      
      
      calculateTotalRevenue(item) {
        if (!item.inventory || !item.inventory.operationHistory) return 0;
        
        return item.inventory.operationHistory
          .filter(op => op.type === 'sell' && op.totalRevenue)
          .reduce((total, op) => total + op.totalRevenue, 0);
      }
      
      calculateRevenueRatio(item) {
        if (!item.inventory || !item.inventory.operationHistory) return 0;
        
        const totalRevenue = this.calculateTotalRevenue(item);
        const totalInvestment = item.inventory.totalInvestment || 0;
        
        if (totalInvestment === 0) return 0;
        
        return (totalRevenue / totalInvestment) * 100;
      }
      
      formatTimeAgo(timestamp) {
        if (!timestamp) return '未知时间';
        
        const now = new Date();
        const time = new Date(timestamp);
        
        // 检查时间是否有效
        if (isNaN(time.getTime())) {
          return '时间格式错误';
        }
        
        const diffMs = now - time;
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
        const diffMinutes = Math.floor(diffMs / (1000 * 60));
        
        if (diffDays > 0) {
          return `${diffDays}天前`;
        } else if (diffHours > 0) {
          return `${diffHours}小时前`;
        } else if (diffMinutes > 0) {
          return `${diffMinutes}分钟前`;
        } else {
          return '刚刚';
        }
      }

      ensureInventoryExists(item) {

          item.inventory = {
            currentStock: 0,
            totalInvestment: 0,
            averageCost: 0,
            operationHistory: []
          };
        }
        
        if (!item.inventory.operationHistory) {

      bindHistoryEvents(item, modal) {

        const typeFilter = modal.querySelector('#typeFilter');
        const exportBtn = modal.querySelector('#exportHistory');
        const historyList = modal.querySelector('#historyList');
        
        // 确保inventory对象存在
        this.ensureInventoryExists(item);
        
        // 初始化历史记录显示
        this.updateHistoryDisplay(item, modal);
        
        // 防止重复绑定事件
        if (timeFilter && !timeFilter._historyEventBound) {
          timeFilter._historyEventBound = true;
          timeFilter.addEventListener('change', () => {
            this.updateHistoryDisplay(item, modal);
          });
        }
        
        if (typeFilter && !typeFilter._historyEventBound) {
          typeFilter._historyEventBound = true;
          typeFilter.addEventListener('change', () => {

          });
        }

          exportBtn.addEventListener('click', () => {

          });
        }
        
        // 测试价格变动事件
        const testBtn = modal.querySelector('#testPriceChange');

      addTestPriceChangeRecord(item, modal) {
        // 确保inventory对象存在
        this.ensureInventoryExists(item);
        
        // 生成随机价格变动
        const currentPrice = item.price || 100;
        const changePercent = (Math.random() - 0.5) * 40; // -20% 到 +20%
        const newPrice = Math.max(1, currentPrice * (1 + changePercent / 100));
        const change = newPrice - currentPrice;
        
        const priceChangeRecord = {
          type: 'price_change',
          timestamp: Date.now(),
          oldPrice: currentPrice,
          newPrice: newPrice,
          change: change,
          changePercent: changePercent.toFixed(2)
        };
        
        item.inventory.operationHistory.push(priceChangeRecord);
        
        // 更新道具价格
        item.price = newPrice;

      calculateHistoryStats(item, filteredHistory) {
        if (!filteredHistory || filteredHistory.length === 0) {
          return {
            activeDays: 0,
            avgInterval: '-',
            profitCycle: '-',
            timeDistribution: '-',
            operationPreference: '-',
            cashFlow: 0,
            totalOperations: 0,
            lastOperation: '-'
          };
        }
        
        // 1. 活跃天数 - 有交易记录的不同日期数
        const uniqueDates = new Set();
        filteredHistory.forEach(record => {
          const date = new Date(record.timestamp).toDateString();
          uniqueDates.add(date);
        });
        const activeDays = uniqueDates.size;
        
        // 2. 平均操作间隔 - 两次买卖之间的平均时间差
        let avgInterval = '-';
        if (filteredHistory.length > 1) {
          const intervals = [];
          for (let i = 1; i < filteredHistory.length; i++) {
            const prevTime = new Date(filteredHistory[i-1].timestamp).getTime();
            const currTime = new Date(filteredHistory[i].timestamp).getTime();
            intervals.push(currTime - prevTime);
          }
          const avgMs = intervals.reduce((sum, interval) => sum + interval, 0) / intervals.length;
          const avgHours = avgMs / (1000 * 60 * 60);
          if (avgHours < 24) {
            avgInterval = `${avgHours.toFixed(1)}小时`;
          } else {
            avgInterval = `${(avgHours / 24).toFixed(1)}天`;
          }
        }
        
        // 3. 盈利周期 - 从买入到卖出平均耗时
        let profitCycle = '-';
        const buySellPairs = [];
        const buyRecords = filteredHistory.filter(r => r.type === 'buy');
        const sellRecords = filteredHistory.filter(r => r.type === 'sell');
        
        if (buyRecords.length > 0 && sellRecords.length > 0) {
          // 简化计算：取最近的买入和卖出记录的时间差
          const latestBuy = Math.max(...buyRecords.map(r => new Date(r.timestamp).getTime()));
          const latestSell = Math.max(...sellRecords.map(r => new Date(r.timestamp).getTime()));
          const cycleMs = Math.abs(latestSell - latestBuy);
          const cycleDays = cycleMs / (1000 * 60 * 60 * 24);
          profitCycle = `${cycleDays.toFixed(1)}天`;
        }
        
        // 4. 操作时间分布 - 统计操作主要集中时段
        const hourCounts = new Array(24).fill(0);
        filteredHistory.forEach(record => {
          const hour = new Date(record.timestamp).getHours();
          hourCounts[hour]++;
        });
        const maxHour = hourCounts.indexOf(Math.max(...hourCounts));
        const timeDistribution = `${maxHour}:00-${maxHour + 1}:00`;
        
        // 5. 操作偏好 - 买卖比例
        const buyCount = filteredHistory.filter(r => r.type === 'buy').length;
        const sellCount = filteredHistory.filter(r => r.type === 'sell').length;
        const totalOps = buyCount + sellCount;
        let operationPreference = '-';
        if (totalOps > 0) {
          const buyRatio = (buyCount / totalOps * 100).toFixed(1);
          const sellRatio = (sellCount / totalOps * 100).toFixed(1);
          operationPreference = `${buyRatio}/${sellRatio}`;
        }
        
        // 6. 资金流向 - 按时间统计现金变化
        let cashFlow = 0;
        filteredHistory.forEach(record => {
          if (record.type === 'buy' && record.totalCost) {
            cashFlow -= record.totalCost; // 支出
          } else if (record.type === 'sell' && record.totalRevenue) {
            cashFlow += record.totalRevenue; // 收入
          }
        });
        
        // 7. 操作次数 - 总操作记录数
        const totalOperations = filteredHistory.length;
        
        // 8. 最后操作时间 - 最近一次操作的时间
        let lastOperation = '-';
        if (filteredHistory.length > 0) {
          const lastRecord = filteredHistory[0]; // 已按时间排序，第一个是最新的
          lastOperation = this.formatTimeAgo(lastRecord.timestamp);
        }
        
        return {
          activeDays,
          avgInterval,
          profitCycle,
          timeDistribution,
          operationPreference,
          cashFlow,
          totalOperations,
          lastOperation
        };
      }
