  <!-- 优化的主题管理器 -->
  <script>
    (function() {
      const STORAGE_KEY = 'game_trader_theme';
      
      // 获取系统偏好
      const getSystemPreference = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      
      // 设置主题
      const setTheme = (theme) => {
        const actualTheme = theme === 'auto' ? getSystemPreference() : theme;
        document.documentElement.setAttribute('data-theme', actualTheme);
        localStorage.setItem(STORAGE_KEY, theme);
        return actualTheme;
      };
      
      // 初始化主题
      const savedTheme = localStorage.getItem(STORAGE_KEY) || 'auto';
      setTheme(savedTheme);
      
      // 监听系统主题变化
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (savedTheme === 'auto') setTheme('auto');
      });
      
      // 暴露到全局
      window.ThemeManager = { setTheme, getSystemPreference };
    })();
  </script>
  
  <style>

      /* 设计令牌 */
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
      --shadow: 0 2px 8px var(--border); --shadow-lg: 0 8px 24px var(--border);
      --spacing: 16px; --spacing-sm: 8px; --spacing-lg: 24px;
      
      /* 字体系统 */
      --font-family: Inter, system-ui, -apple-system, sans-serif;
      --font-size-xs: 11px; --font-size-sm: 12px; --font-size-base: 14px;
      --font-size-lg: 16px; --font-size-xl: 18px; --font-size-2xl: 22px;
      
      /* 布局系统 */
      --header-height: 60px; --sidebar-width: 280px; --modal-z: 1000;
    }
    
    /* 自动主题检测 - 仅在无手动设置时生效 */
    @media (prefers-color-scheme: dark) {

      --badge-bg: #312e81; --badge-fg: #c4b5fd; --border: rgba(255,255,255,0.1);
      --price-up: #34d399; --price-down: #f87171; --price-neutral: #64748b;
      --shadow-text: rgba(0, 0, 0, 0.8);
      }
    }

      --badge-bg: #e0e7ff; --badge-fg: #4338ca; --border: rgba(2,6,23,0.06);
      --price-up: #10b981; --price-down: #ef4444; --price-neutral: #94a3b8;
      --shadow-text: rgba(0, 0, 0, 0.3);

      --badge-bg: #312e81; --badge-fg: #c4b5fd; --border: rgba(255,255,255,0.1);

    .features-grid {

    .feature-card:hover .feature-icon {

    .feature-card .feature-content h4 {

    .coming-soon-banner {

      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;

    .coming-soon-banner::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;

      height: 200%;

    }
    
    @keyframes shimmer {

    .banner-content {

    .banner-text h4 {

    .banner-text p {

    .btn-primary {

      align-items: center;
      gap: 8px;

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
    }
    
    /* 搜索框容器相对定位 */
    .search-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      gap: 12px;
    }
    
    /* 搜索框容器 */
    .search-container {
      position: relative;
      flex: 1;
      max-width: 680px;
    }
    
    /* 搜索框抖动动画 - 增强版 */
    @keyframes searchShake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
      20%, 40%, 60%, 80% { transform: translateX(3px); }
    }
    .search.shake {
      animation: searchShake 0.6s ease-in-out;
    }
    
    /* 快速输入检测动画 */
    @keyframes searchPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 8px rgba(79, 70, 229, 0.1); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
    }
    .search.pulse {
      animation: searchPulse 0.8s ease-out;
    }
    
    /* 输入过快警告动画 */
    @keyframes searchWarning {
      0%, 100% { border-color: var(--accent); }
      25% { border-color: #f59e0b; }
      50% { border-color: #ef4444; }
      75% { border-color: #f59e0b; }
    }
    .search.warning {
      animation: searchWarning 1s ease-in-out;
    }
    
    /* 无结果输入红色边框动画 */
    @keyframes searchNoResult {
      0% { border-color: var(--accent); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      25% { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); }
      50% { border-color: #dc2626; box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.1); }
      75% { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); }
      100% { border-color: var(--accent); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .search.no-result {
      animation: searchNoResult 1.2s ease-in-out;
    }
    
    /* 无匹配结果页面动画 */
    .no-results-container {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #999;
      position: relative;
      overflow: hidden;
    }
    
    .no-results-icon {
      font-size: 64px;
      margin-bottom: 20px;
      display: block;
      animation: noResultsFloat 3s ease-in-out infinite;
    }
    
    .no-results-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--fg);
      animation: noResultsFadeIn 0.8s ease-out 0.3s both;
    }
    
    .no-results-subtitle {
      font-size: 16px;
      margin-bottom: 24px;
      color: var(--muted);
      animation: noResultsFadeIn 0.8s ease-out 0.5s both;
    }
    
    .no-results-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      animation: noResultsFadeIn 0.8s ease-out 0.7s both;
    }
    
    .no-results-suggestion {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.3s ease;
      animation: noResultsPulse 2s ease-in-out infinite;
      font-family: inherit;
      outline: none;
    }
    
    .no-results-suggestion:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      border-color: var(--accent);
    }
    
    .no-results-suggestion:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.2);
    }
    
    .no-results-suggestion:nth-child(1) { animation-delay: 0.1s; }
    .no-results-suggestion:nth-child(2) { animation-delay: 0.2s; }
    .no-results-suggestion:nth-child(3) { animation-delay: 0.3s; }
    
    /* 背景装饰动画 */
    .no-results-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.05) 0%, transparent 70%);
      animation: noResultsRotate 20s linear infinite;
      pointer-events: none;
    }
    
    .no-results-container::after {
      content: '';
      position: absolute;
      top: 20%;
      right: 10%;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: noResultsFloat 4s ease-in-out infinite reverse;
      pointer-events: none;
    }
    
    /* 动画关键帧 */
    @keyframes noResultsFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    
    @keyframes noResultsFadeIn {
      0% { 
        opacity: 0; 
        transform: translateY(20px); 
      }
      100% { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    @keyframes noResultsPulse {
      0%, 100% { 
        transform: scale(1); 
        opacity: 0.8; 
      }
      50% { 
        transform: scale(1.05); 
        opacity: 1; 
      }
    }
    
    @keyframes noResultsRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* 确认对话框样式 */
    .confirm-dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: confirmDialogFadeIn 0.3s ease-out;
    }
    
    .confirm-dialog {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 90%;
      animation: confirmDialogSlideIn 0.3s ease-out;
    }
    
    .confirm-dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    
    .confirm-dialog-header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--fg);
    }
    
    .confirm-dialog-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--muted);

    .confirm-dialog-close:hover {
      background: var(--border);
      color: var(--fg);
    }
    
    .confirm-dialog-body {
      padding: 20px 24px;
    }
    
    .confirm-dialog-body p {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
      color: var(--fg);
    }
    
    .confirm-dialog-footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      padding: 16px 24px 20px;
    }
    
    .confirm-dialog-footer .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;

      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .confirm-dialog-footer .btn-secondary {
      background: var(--border);
      color: var(--fg);
      border: 1px solid var(--border);
    }
    
    .confirm-dialog-footer .btn-secondary:hover {
      background: var(--muted);
    }
    
    .confirm-dialog-footer .btn-danger {
      background: #ef4444;
      color: white;
      border: 1px solid #ef4444;
    }
    
    .confirm-dialog-footer .btn-danger:hover {
      background: #dc2626;

    }
    
    @keyframes confirmDialogFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    @keyframes confirmDialogSlideIn {
      0% { 
        opacity: 0; 
        transform: translateY(-20px) scale(0.95); 
      }
      100% { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      }
    }

    /* 模态框覆盖层 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
      display: flex;
    }

    /* 模态框内容 */
    .modal-content {
      background: var(--bg-color);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-height: 80vh;
      overflow: hidden;
      transition: transform 0.3s ease;
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    /* ===== 模态框系统 ===== */
    
    /* 关键帧动画定义 */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes lightSweep {
      0% { left: -100%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { left: 100%; opacity: 0; }
    }

    @keyframes particleFloat {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-20px) rotate(360deg); }
    }

    @keyframes textGlow {
      0% { text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3), 0 0 10px rgba(255, 255, 255, 0.2); }
      100% { text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.4), 0 0 30px rgba(255, 255, 255, 0.2); }
    }

    /* 模态框覆盖层状态 */
    .modal-overlay.show .modal-content {
      transform: scale(1);
    }

    /* 模态框基础容器 */
    .modal-root { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(2, 6, 23, 0.7); 
      backdrop-filter: blur(6px); 
      align-items: center; 
      justify-content: center; 
      z-index: 1000; 
      padding: 20px; 
    }
    
    .modal { 
      width: 100%; 
      max-width: 660px; 
      background: var(--card); 
      border-radius: 16px; 
      max-height: calc(100vh - 40px); 
      overflow: visible; 
    }
    
    .modal-wide {
      width: 95%;
      background: var(--card);
      border-radius: 16px;
      max-height: calc(100vh - 40px);
      overflow: visible;
    }

    /* 模态框头部 */
    .modal-header {
      background: linear-gradient(45deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%) !important;
      background-size: 300% 300% !important;
      position: relative;
      overflow: hidden;
      animation: gradientShift 4s ease infinite;
      color: white;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
      border-radius: 12px 12px 0 0;
    }

    /* 模态框头部伪元素 */
    .modal-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.4) 25%, 
        rgba(255, 255, 255, 0.8) 50%, 
        rgba(255, 255, 255, 0.4) 75%, 
        transparent 100%);
      animation: lightSweep 2.5s ease-in-out infinite;
      z-index: 1;
    }

    .modal-header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.3) 1px, transparent 1px),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
        radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.25) 1px, transparent 1px);
      background-size: 50px 50px, 80px 80px, 60px 60px;
      animation: particleFloat 6s linear infinite;
      z-index: 2;
    }

    /* 模态框标题 */
    .modal-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
      z-index: 3;
      flex: 1;
      min-width: 0;
    }

    .modal-icon {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .modal-icon svg {
      color: white;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: white !important;
      position: relative;
      z-index: 3;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      animation: textGlow 2s ease-in-out infinite alternate;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 模态框关闭按钮 */
    .modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.3s ease;
      position: relative;
      z-index: 3;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
      margin-left: 16px;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }
    /* 模态框主体 */
    .modal-body {
      padding: 1.5rem;
      max-height: 80vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    .modal-body::-webkit-scrollbar {
      width: 8px;
    }
    
    .modal-body::-webkit-scrollbar-track {
      background: var(--hover-bg);
      border-radius: 4px;
    }
    
    .modal-body::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    
    .modal-body::-webkit-scrollbar-thumb:hover {
      background: var(--primary-color);
    }

    .modal-body p {
      margin: 0;
      color: var(--text-color);
      line-height: 1.5;
    }

    /* 模态框页脚 */
    .modal-footer {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      padding: 0 1.5rem 1.5rem 1.5rem;
      border-top: 1px solid var(--border-color);
      width: 100%;

    /* 按钮动画 */
    @keyframes saveButtonPulse {
      0% {
        background-position: 0% 50%;
        box-shadow: 0 4px 15px rgba(0, 200, 81, 0.3);
      }
      50% {
        background-position: 100% 50%;
        box-shadow: 0 6px 20px rgba(0, 200, 81, 0.5);
      }
      100% {
        background-position: 0% 50%;
        box-shadow: 0 4px 15px rgba(0, 200, 81, 0.3);
      }
    }

    @keyframes saveButtonHover {
      0% {
        transform: translateY(-2px) scale(1.1);
      }
      50% {
        transform: translateY(-3px) scale(1.15);
      }
      100% {
        transform: translateY(-2px) scale(1.1);
      }
    }

    @keyframes saveButtonShine {
      0% {
        left: -100%;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        left: 100%;
        opacity: 0;
      }
    }

    @keyframes saveButtonParticles {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      50% {
        opacity: 0.4;
      }
      100% {
        transform: translateY(-10px) rotate(180deg);
        opacity: 0.8;
      }
    }

    @keyframes saveIconRotate {
      0% {
        transform: rotate(0deg) scale(1);
      }
      25% {
        transform: rotate(5deg) scale(1.1);
      }
      75% {
        transform: rotate(-5deg) scale(1.1);
      }
      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    @keyframes cancelButtonPulse {
      0% {
        background-position: 0% 50%;
        box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
      }
      50% {
        background-position: 100% 50%;
        box-shadow: 0 6px 20px rgba(108, 117, 125, 0.5);
      }
      100% {
        background-position: 0% 50%;
        box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
      }
    }

    @keyframes cancelButtonHover {
      0% {
        transform: translateY(-2px) scale(1.1);
      }
      50% {
        transform: translateY(-3px) scale(1.15);
      }
      100% {

    @keyframes cancelButtonShine {

    /* 悬浮添加按钮样式 - 使用blacklist.html的动画效果 */
    .floating-add-btn {
      position: fixed !important;
      bottom: 2rem !important;
      right: 2rem !important;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: all 0.3s ease;
      z-index: 9999 !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      /* 性能优化 */
      will-change: transform, box-shadow;
      transform: translateZ(0);
      backface-visibility: hidden;
      /* 脉冲动画 */
      animation: floatingButtonPulse 4s ease-in-out infinite;
      /* 用于伪元素定位 */
      overflow: hidden;
      /* 确保始终可见 */
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* 悬浮按钮光效 */
    .floating-add-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, 
        transparent 30%, 
        rgba(255, 255, 255, 0.3) 50%, 
        transparent 70%);
      animation: floatingButtonShine 3s linear infinite;
    }

    /* 悬浮按钮粒子效果 */
    .floating-add-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.4) 2px, transparent 2px),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.3) 2px, transparent 2px),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.35) 2px, transparent 2px);
      background-size: 30px 30px, 40px 40px, 35px 35px;
      animation: floatingButtonParticles 6s linear infinite;
    }

    /* 悬浮按钮图标动画 */
    .floating-add-btn svg {
      position: relative;
      z-index: 3;
      width: 28px;
      height: 28px;
      animation: floatingIconSpin 4s ease-in-out infinite;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    /* 悬浮按钮悬停效果 */
    .floating-add-btn:hover {
      transform: scale(1.2) rotate(90deg) translateZ(0) !important;
      box-shadow: 0 15px 40px rgba(79, 70, 229, 0.7) !important;
      animation: floatingButtonHover 1s ease-in-out infinite;
    }

    .floating-add-btn:active {
      transform: scale(0.95) translateZ(0);
      transition: all 0.1s ease;
    }

    /* 悬浮按钮脉冲动画 */
    @keyframes floatingButtonPulse {
      0% {
        background-position: 0% 50%;
        box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        transform: scale(1);
      }
      50% {
        background-position: 100% 50%;
        box-shadow: 0 12px 35px rgba(79, 70, 229, 0.6);
        transform: scale(1.05);
      }
      100% {
        background-position: 0% 50%;
        box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        transform: scale(1);
      }
    }

    /* 光效扫过动画 */
    @keyframes floatingButtonShine {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* 粒子浮动动画 */
    @keyframes floatingButtonParticles {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.8;
      }
      50% {
        opacity: 0.4;
      }
      100% {
        transform: translateY(-15px) scale(1.1);
        opacity: 0.8;
      }
    }

    /* 图标旋转动画 */
    @keyframes floatingIconSpin {
      0% {
        transform: rotate(0deg) scale(1);
      }
      25% {
        transform: rotate(10deg) scale(1.1);
      }
      50% {
        transform: rotate(0deg) scale(1);
      }
      75% {
        transform: rotate(-10deg) scale(1.1);
      }
      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    /* 悬停呼吸动画 */
    @keyframes floatingButtonHover {
      0% {
        box-shadow: 0 15px 40px rgba(79, 70, 229, 0.7);
      }
      50% {
        box-shadow: 0 20px 50px rgba(79, 70, 229, 0.9);
      }
      100% {
        box-shadow: 0 15px 40px rgba(79, 70, 229, 0.7);
      }
    }

    /* 平均价格图标 - 数据波动动画 */
    .stat-card.stat-avg { border-color: rgba(79, 70, 229, 0.3); }
    .stat-card.stat-avg .stat-icon {
      animation: dataPulse 3s ease-in-out infinite;
    }
    .stat-card.stat-avg .stat-icon::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      background: #4f46e5;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: dataPoint 2s ease-in-out infinite;
    }
    .stat-card.stat-avg:hover { border-color: #4f46e5; box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3); }
    .stat-card.stat-avg:hover .stat-icon {
      transform: scale(1.2) rotate(5deg);
      animation: dataPulse 1s ease-in-out infinite;
    }
    
    /* 编辑次数图标 - 书写动画 */
    .stat-card.stat-count { border-color: rgba(148, 163, 184, 0.3); }
    .stat-card.stat-count .stat-icon {
      animation: writePulse 2.5s ease-in-out infinite;
      position: relative;
      overflow: visible;
    }
    .stat-card.stat-count .stat-icon::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #94a3b8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: writeDot 2s ease-in-out infinite;
    }
    .stat-card.stat-count .stat-icon::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent, rgba(148, 163, 184, 0.15), transparent);
      animation: writeShine 3s linear infinite;
      border-radius: 50%;
    }
    .stat-card.stat-count:hover { border-color: #94a3b8; box-shadow: 0 6px 20px rgba(148, 163, 184, 0.3); }
    .stat-card.stat-count:hover .stat-icon {
      transform: scale(1.2) rotate(8deg);
      animation: writePulse 1.5s ease-in-out infinite;
    }
    
    /* 最高价图标 - 上升动画 */
    .stat-card.stat-high { border-color: rgba(16, 185, 129, 0.3); }
    .stat-card.stat-high .stat-icon {
      animation: priceRise 2.8s ease-in-out infinite;
    }
    .stat-card.stat-high .stat-icon::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      width: 2px;
      height: 6px;
      background: #10b981;
      border-radius: 1px;
      transform: translateX(-50%);
      animation: priceArrow 2s ease-in-out infinite;
    }
    .stat-card.stat-high:hover { border-color: #10b981; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); }
    .stat-card.stat-high:hover .stat-icon {
      transform: scale(1.2) rotate(-5deg);
      animation: priceRise 1.2s ease-in-out infinite;
    }
    
    /* 最低价图标 - 下降动画 */
    .stat-card.stat-low { border-color: rgba(239, 68, 68, 0.3); }
    .stat-card.stat-low .stat-icon {
      animation: priceFall 2.6s ease-in-out infinite;
    }
    .stat-card.stat-low .stat-icon::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      width: 2px;
      height: 6px;
      background: #ef4444;
      border-radius: 1px;
      transform: translateX(-50%);
      animation: priceArrowDown 2.2s ease-in-out infinite;
    }
    .stat-card.stat-low:hover { border-color: #ef4444; box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3); }
    .stat-card.stat-low:hover .stat-icon {
      transform: scale(1.2) rotate(5deg);
      animation: priceFall 1.3s ease-in-out infinite;
    }
    
    /* 动画关键帧 */
    @keyframes dataPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes dataPoint {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
    }
    
    @keyframes writePulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.1) rotate(2deg); }
      75% { transform: scale(1.05) rotate(-1deg); }
    }
    
    @keyframes writeShine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }
    
    @keyframes writeDot {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    }
    
    @keyframes priceRise {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    
    @keyframes priceArrow {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scaleY(1); }
      50% { opacity: 1; transform: translateX(-50%) scaleY(1.3); }
    }
    
    @keyframes priceFall {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(2px); }
    }
    
    @keyframes priceArrowDown {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scaleY(1); }
      50% { opacity: 1; transform: translateX(-50%) scaleY(1.3); }
    }

    /* 加载动画样式 */
    /* ===== 全新设计的加载动画样式 ===== */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(124, 58, 237, 0.1));
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      pointer-events: none;
    }
    
    .loading-overlay.hidden {
      opacity: 0;
      transform: scale(0.9) translateY(20px);
      pointer-events: none;
    }
    
    .loading-container {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 24px;
      padding: 48px 56px;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      background-clip: padding-box;
    }
    
    .loading-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, 
        var(--accent), 
        #7c3aed, 
        #ec4899, 
        #f59e0b, 
        var(--accent)
      );
      border-radius: 24px;
      padding: 2px;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: xor;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      animation: borderRotate 3s linear infinite;
    }
    
    @keyframes borderRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-spinner {
      width: 80px;
      height: 80px;
      position: relative;
      margin-bottom: 32px;
    }
    
    .loading-spinner::before,
    .loading-spinner::after {
      content: '';
      position: absolute;
      border-radius: 50%;
    }
    
    .loading-spinner::before {
      width: 100%;
      height: 100%;
      background: conic-gradient(
        from 0deg,
        var(--accent) 0deg,
        #7c3aed 90deg,
        #ec4899 180deg,
        #f59e0b 270deg,
        var(--accent) 360deg
      );
      animation: spin 2s linear infinite;
      filter: blur(1px);
    }
    
    .loading-spinner::after {
      width: 60px;
      height: 60px;
      top: 10px;
      left: 10px;
      background: var(--card);
      animation: pulse 2s ease-in-out infinite;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { 
        transform: scale(1); 
        opacity: 1; 
      }
      50% { 
        transform: scale(1.05); 
        opacity: 0.9; 
      }
    }
    
    .loading-text {
      color: var(--fg);
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      background: linear-gradient(45deg, 
        var(--accent), 
        #7c3aed, 
        #ec4899, 
        #f59e0b
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 3s ease-in-out infinite;
      letter-spacing: 0.5px;
    }
    
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .loading-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotBounce 1.4s ease-in-out infinite both;
    }
    
    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
    .loading-dots span:nth-child(3) { animation-delay: 0s; }
    
    @keyframes dotBounce {
      0%, 80%, 100% { 
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% { 
        transform: scale(1.2);
        opacity: 1;
      }
    }
    
    /* ==================== Toast 优化设计 - 堆叠显示 ==================== */
    .toastify {
      padding: 0 !important;
      border-radius: 12px !important;
      min-height: 64px !important;
      max-width: 350px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1) !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: stretch !important;
      font-family: Inter, system-ui, -apple-system, sans-serif !important;
      backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      margin-bottom: 12px !important;
    }
    
    .toastify::before {
      content: '';
      width: 4px;
      background: currentColor;
      flex-shrink: 0;
    }
    
    .toastify::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.5);
      animation: toastProgress 3s linear forwards;
      transform-origin: left;
    }
    
    @keyframes toastProgress {
      from {
        width: 100%;
      }
      to {
        width: 0%;
      }
    }
    
    .toastify-content {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      padding: 14px 18px !important;
      flex: 1 !important;
    }
    
    .toastify-icon {
      font-size: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    
    .toastify-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .toastify-text {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      color: white;
    }
    
    .toastify.success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      color: #10b981 !important;
    }
    
    .toastify.error {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
      color: #ef4444 !important;
    }
    
    .toastify.warning {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
      color: #f59e0b !important;
    }
    
    .toastify.info {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%) !important;
      color: #3b82f6 !important;
    }
    
    .toastify.on {
      animation: toastSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    
    @keyframes toastSlideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* 库存管理模块 */
    .inventory-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    /* 库存管理主区域 */
    .inventory-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 20px;
    }
    
    /* 左侧：库存显示 */
    .inventory-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(124, 58, 237, 0.1));
      border-radius: 16px;
      border: 1px solid var(--border);
      text-align: center;
    }
    
    .inventory-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .inventory-icon {
      font-size: 24px;
    }
    
    .inventory-title h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--fg);
    }
    
    .current-stock-display {
      text-align: center;
    }
    
    .stock-number {
      font-size: 64px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
      position: relative;
      display: inline-block;
    }
    
    /* 库存数字动画效果 */
    .stock-number.stock-increase {
      animation: stockIncrease 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: #10b981;
    }
    
    .stock-number.stock-decrease {
      animation: stockDecrease 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: #ef4444;
    }
    
    .stock-number.stock-pulse {
      animation: stockPulse 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* 库存增加动画 */
    @keyframes stockIncrease {
      0% { 
        transform: scale(1) translateY(0);
        color: var(--accent);
      }
      20% { 
        transform: scale(1.3) translateY(-15px);
        color: #10b981;
        text-shadow: 0 6px 12px rgba(16, 185, 129, 0.6);
      }
      40% { 
        transform: scale(1.25) translateY(-12px);
        color: #10b981;
        text-shadow: 0 8px 16px rgba(16, 185, 129, 0.8);
      }
      60% { 
        transform: scale(1.2) translateY(-8px);
        color: #10b981;
        text-shadow: 0 6px 12px rgba(16, 185, 129, 0.7);
      }
      80% { 
        transform: scale(1.1) translateY(-4px);
        color: #10b981;
        text-shadow: 0 4px 8px rgba(16, 185, 129, 0.5);
      }
      100% { 
        transform: scale(1) translateY(0);
        color: #10b981;
        text-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
      }
    }
    
    /* 库存减少动画 */
    @keyframes stockDecrease {
      0% { 
        transform: scale(1) translateY(0);
        color: var(--accent);
      }
      20% { 
        transform: scale(0.7) translateY(15px);
        color: #ef4444;
        text-shadow: 0 6px 12px rgba(239, 68, 68, 0.6);
      }
      40% { 
        transform: scale(0.75) translateY(12px);
        color: #ef4444;
        text-shadow: 0 8px 16px rgba(239, 68, 68, 0.8);
      }
      60% { 
        transform: scale(0.8) translateY(8px);
        color: #ef4444;
        text-shadow: 0 6px 12px rgba(239, 68, 68, 0.7);
      }
      80% { 
        transform: scale(0.9) translateY(4px);
        color: #ef4444;
        text-shadow: 0 4px 8px rgba(239, 68, 68, 0.5);
      }
      100% { 
        transform: scale(1) translateY(0);
        color: #ef4444;
        text-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
      }
    }
    
    /* 库存脉冲动画 */
    @keyframes stockPulse {
      0% { 
        transform: scale(1);
        text-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
      }
      30% { 
        transform: scale(1.4);
        text-shadow: 0 6px 12px rgba(79, 70, 229, 0.6);
      }
      60% { 
        transform: scale(1.2);
        text-shadow: 0 4px 8px rgba(79, 70, 229, 0.4);
      }
      100% { 
        transform: scale(1);
        text-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
      }
    }
    
    /* 库存数字发光效果 */
    .stock-number::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: -1;
    }
    
    .stock-number.stock-increase::before {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, transparent 70%);
      animation: glowExpand 1.2s ease-out;
    }
    
    .stock-number.stock-decrease::before {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.3) 0%, transparent 70%);
      animation: glowExpand 1.2s ease-out;
    }
    
    @keyframes glowExpand {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }
      30% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.8;
      }
      60% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -50%) scale(2);
        opacity: 0;
      }
    }
    
    .stock-label {
      font-size: 16px;
      color: var(--fg);
      opacity: 0.7;
      font-weight: 500;
    }

      left: 0;
      opacity: 1;
    }

      left: 25%;
      opacity: 0.8;

    50% {

  .analytics-grid {

    grid-template-columns: repeat(4, 1fr);
    gap: 16px;

  .analytics-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    /*background: linear-gradient(135deg, var(--badge-bg) 0%, rgba(79, 70, 229, 0.05) 100%);*/
    border-radius: 12px;
    border: 1px solid var(--border);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  
  .analytics-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.3s ease;
  }
  /* 悬停时的增强动画效果 */
  .analytics-card:hover .trend-up {
    animation: trendFloat 1s ease-in-out infinite, trendHover 0.3s ease;
    transform: scale(1.1);
    background: linear-gradient(135deg, var(--accent) 0%, #4338ca 100%);
    color: white;
  }
  
  .analytics-card:hover .status-good {
    animation: statusHeartbeat 1.5s ease-in-out infinite, statusHover 0.3s ease;
    transform: scale(1.1);
    background: linear-gradient(135deg, var(--accent) 0%, #4338ca 100%);
    color: white;
  }
  
  .analytics-card:hover .frequency-high {
    animation: frequencyFlash 1s ease-in-out infinite, frequencyHover 0.3s ease;
    transform: scale(1.1);
    background: linear-gradient(135deg, var(--accent) 0%, #4338ca 100%);
    color: white;
  }
  
  .analytics-card:hover .risk-medium {
    animation: riskWarning 1s ease-in-out infinite, riskHover 0.3s ease;
  }
  
  @keyframes trendHover {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-2px) scale(1.05); }
  }
  
  @keyframes statusHover {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
  }
  
  @keyframes frequencyHover {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.05) rotate(5deg); }
  }
  
  @keyframes riskHover {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(3deg) scale(1.05); }
  }
  .analytics-card:hover::before {
    transform: scaleY(1);
  }
  
  .analytics-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    border-color: var(--accent);
  }
  
  .analytics-icon {
    font-size: 20px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    flex-shrink: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  
  /* 趋势上涨图标 - 向上浮动动画 */
  .trend-up { 
    background: rgba(16, 185, 129, 0.1);
    animation: trendFloat 3s ease-in-out infinite;
  }
  
  .trend-up::before {
    content: '';
    position: absolute;
    top: -2px;
    left: 50%;
    width: 2px;
    height: 8px;
    background: #10b981;
    border-radius: 1px;
    transform: translateX(-50%);
    animation: trendPulse 2s ease-in-out infinite;
  }
  
  @keyframes trendFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }
  
  @keyframes trendPulse {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleY(1.2); }
  }
  
  /* 状态良好图标 - 心跳动画 */
  .status-good { 
    background: rgba(59, 130, 246, 0.1);
    animation: statusHeartbeat 2.5s ease-in-out infinite;
  }
  
  @keyframes statusHeartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.1); }
    50% { transform: scale(1.05); }
    75% { transform: scale(1.1); }
  }
  
  /* 频率高图标 - 闪电闪烁动画 */
  .frequency-high { 
    background: rgba(245, 158, 11, 0.1);
    animation: frequencyFlash 1.8s ease-in-out infinite;
  }
  
  .frequency-high::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, transparent, rgba(245, 158, 11, 0.3), transparent);
    animation: frequencyShine 2s linear infinite;
  }
  
  @keyframes frequencyFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  
  @keyframes frequencyShine {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
    100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
  }
  
  /* 风险中等图标 - 警告闪烁动画 */
  .risk-medium { 
    background: rgba(239, 68, 68, 0.1);
    animation: riskWarning 2s ease-in-out infinite;
  }
  
  .risk-medium::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background: #ef4444;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: riskPulse 1.5s ease-in-out infinite;
  }

  <script>
  (function() {
    'use strict';
    
    // ==================== 全局工具函数 ====================
    
    /**
     * 修复ECharts的passive事件监听器问题
     * 解决移动端滚动性能问题
     */
    const fixEChartsPassiveEvents = () => {
      const originalAddEventListener = EventTarget.prototype.addEventListener;
      const PASSIVE_EVENT_TYPES = ['touchstart', 'touchmove', 'touchend', 'mousewheel', 'wheel', 'scroll'];
      
      EventTarget.prototype.addEventListener = function(type, listener, options) {
        if (PASSIVE_EVENT_TYPES.includes(type)) {
          options = options || {};
          if (typeof options === 'boolean') {
            options = { capture: options, passive: true };
          } else if (typeof options === 'object') {
            options.passive = true;
          }
        }
        return originalAddEventListener.call(this, type, listener, options);
      };
    };
    
    /**
     * 修复ECharts内部事件监听器
     */
    const fixEChartsInternalEvents = () => {
      // 等待ECharts加载完成
      const checkECharts = () => {
        if (window.echarts) {
          // 修复ECharts的ZRender事件处理器
          const originalEChartsInit = window.echarts.init;
          window.echarts.init = function(dom, theme, opts) {
            const chart = originalEChartsInit.call(this, dom, theme, opts);
            
            // 修复ZRender事件处理器
            if (chart.getZr) {
              const zr = chart.getZr();
              if (zr && zr.handler) {
                const originalHandlerAddEventListener = zr.handler.addEventListener;
                zr.handler.addEventListener = function(type, listener, options) {
                  const PASSIVE_EVENT_TYPES = ['touchstart', 'touchmove', 'touchend', 'mousewheel', 'wheel', 'scroll'];
                  
                  if (PASSIVE_EVENT_TYPES.includes(type)) {
                    options = options || {};
                    if (typeof options === 'boolean') {
                      options = { capture: options, passive: true };
                    } else if (typeof options === 'object') {
                      options.passive = true;
                    }
                  }
                  
                  return originalHandlerAddEventListener.call(this, type, listener, options);
                };
              }
            }
            
            // 修复DOM事件处理器
            if (chart.getDom) {
              const chartDom = chart.getDom();
              if (chartDom) {
                const originalDomAddEventListener = chartDom.addEventListener;
                chartDom.addEventListener = function(type, listener, options) {
                  const PASSIVE_EVENT_TYPES = ['touchstart', 'touchmove', 'touchend', 'mousewheel', 'wheel', 'scroll'];
                  
                  if (PASSIVE_EVENT_TYPES.includes(type)) {
                    options = options || {};
                    if (typeof options === 'boolean') {
                      options = { capture: options, passive: true };
                    } else if (typeof options === 'object') {
                      options.passive = true;
                    }
                  }
                  
                  return originalDomAddEventListener.call(this, type, listener, options);
                };
              }
            }
            
            return chart;
          };
        } else {
          // 如果ECharts还没加载，等待100ms后重试
          setTimeout(checkECharts, 100);
        }
      };
      
      checkECharts();
    };
    
    // 立即执行修复
    fixEChartsPassiveEvents();
    fixEChartsInternalEvents();
    
    /**
     * 修复ECharts preventDefault问题
     */
    const fixEChartsPreventDefault = () => {
      // 等待ECharts加载完成
      const checkECharts = () => {
        if (window.echarts) {
          // 重写ECharts的事件处理器，避免preventDefault问题
          const originalEChartsInit = window.echarts.init;
          window.echarts.init = function(dom, theme, opts) {
            const chart = originalEChartsInit.call(this, dom, theme, opts);
            
            // 修复事件处理器中的preventDefault调用
            if (chart.getZr) {
              const zr = chart.getZr();
              if (zr && zr.handler) {
                const originalHandler = zr.handler;
                
                // 重写事件处理方法
                const originalDispatch = originalHandler.dispatch;
                if (originalDispatch) {
                  originalHandler.dispatch = function(type, event) {
                    // 对于需要preventDefault的事件，先检查是否在passive监听器中
                    if (event && event.preventDefault) {
                      try {
                        return originalDispatch.call(this, type, event);
                      } catch (e) {
                        // 如果preventDefault失败，忽略错误继续执行
                        if (e.message && e.message.includes('passive')) {

       * @param {boolean} immediate - 是否立即执行
       * @returns {Function} 防抖后的函数，带有cancel和flush方法
       */
      debounce: (func, wait, immediate = false) => {
        let timeout;
        let result;

        const debounced = function(...args) {
          const context = this;

          const later = () => {
            timeout = null;
            if (!immediate) {
              result = func.apply(context, args);
            }
          };

          const callNow = immediate && !timeout;
          clearTimeout(timeout);
          timeout = setTimeout(later, wait);

          if (callNow) {
            result = func.apply(context, args);
          }

          return result;
        };

        // 取消防抖
        debounced.cancel = () => {
          clearTimeout(timeout);
          timeout = null;
        };

        // 立即执行
        debounced.flush = function(...args) {
          if (timeout) {
            clearTimeout(timeout);
            timeout = null;
            return func.apply(this, args);
          }
          return result;
        };

        return debounced;
      },

      /**

       * @param {Object} options - 配置选项 {leading: boolean, trailing: boolean}
       * @returns {Function} 节流后的函数，带有cancel方法
       */
      throttle: (func, limit, options = {}) => {
        let timeout;
        let previous = 0;
        let result;
        const { leading = true, trailing = true } = options;

        const throttled = function(...args) {
          const context = this;
          const now = Date.now();

          if (!previous && !leading) previous = now;

          const remaining = limit - (now - previous);

          if (remaining <= 0 || remaining > limit) {
            if (timeout) {
              clearTimeout(timeout);
              timeout = null;
            }
            previous = now;
            result = func.apply(context, args);
          } else if (!timeout && trailing) {
            timeout = setTimeout(() => {
              previous = leading ? Date.now() : 0;
              timeout = null;
              result = func.apply(context, args);
            }, remaining);
          }

          return result;
        };

        // 取消节流
        throttled.cancel = () => {
          clearTimeout(timeout);
          timeout = null;
          previous = 0;
        };

        return throttled;
      },

      createDOMCache: () => {
        const cache = new Map();
        const observer = new MutationObserver(() => cache.clear());

        return {
          get: (selector, context = document) => {
            const key = `${selector}:${context === document ? 'doc' : 'ctx'}`;
            if (!cache.has(key)) {
              const element = context.querySelector(selector);
              if (element) cache.set(key, element);
              return element;
            }
            return cache.get(key);
          },
          getAll: (selector, context = document) => {
            const key = `all:${selector}:${context === document ? 'doc' : 'ctx'}`;
            if (!cache.has(key)) {
              const elements = Array.from(context.querySelectorAll(selector));
              cache.set(key, elements);
              return elements;
            }
            return cache.get(key);
          },
          clear: () => cache.clear(),
          observe: (target) => {
            observer.observe(target, { childList: true, subtree: true });

          if (target && parent.contains(target)) {
            handler.call(target, event, target);
          }

        parent.addEventListener(eventType, listener, options);
        return () => parent.removeEventListener(eventType, listener, options);

      /**

      getVisibleRange: (container, itemHeight, buffer = 5) => {
        const scrollTop = container.scrollTop;
        const containerHeight = container.clientHeight;
        const start = Math.max(0, Math.floor(scrollTop / itemHeight) - buffer);
        const end = Math.min(
          Math.ceil((scrollTop + containerHeight) / itemHeight) + buffer,
          container.children.length
        );
        return { start, end };

      /**

       * @param {Function} processor - 处理函数
       * @param {number} chunkSize - 每块大小
       * @param {Function} onProgress - 进度回调
       */
      processInChunks: async (array, processor, chunkSize = 100, onProgress = null) => {
        const results = [];
        const totalChunks = Math.ceil(array.length / chunkSize);

        for (let i = 0; i < array.length; i += chunkSize) {
          const chunk = array.slice(i, i + chunkSize);
          const chunkResults = await new Promise(resolve => {
            requestAnimationFrame(() => {
              const processed = chunk.map(processor);
              resolve(processed);
            });
          });
          results.push(...chunkResults);

          if (onProgress) {
            const progress = Math.min(100, Math.round(((i + chunkSize) / array.length) * 100));
            onProgress(progress, Math.floor(i / chunkSize) + 1, totalChunks);
          }
        }

        return results;
      },

      /**

      lazyLoadImages: (selector = 'img[data-src]', options = {}) => {
        const config = {
          root: null,
          rootMargin: '50px',
          threshold: 0.01,
          ...options
        };

        const imageObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              const src = img.getAttribute('data-src');
              if (src) {
                img.src = src;
                img.removeAttribute('data-src');
                observer.unobserve(img);
              }
            }
          });
        }, config);

        document.querySelectorAll(selector).forEach(img => imageObserver.observe(img));

        return imageObserver;

      calcChange(hist) {
        if (!hist?.length || hist.length < 2) return {change: 0, percent: 0};
        const [latest, prev] = [hist[hist.length - 1].close, hist[hist.length - 2].close];
        return {change: latest - prev, percent: prev === 0 ? 0 : ((latest - prev) / prev * 100)};

        if (!history?.length) return { avg: 0, max: { price: 0, date: '-' }, min: { price: 0, date: '-' }, count: 0 };
        const prices = history.map(h => h.close);
        const avg = prices.reduce((sum, p) => sum + p, 0) / prices.length;
        const maxIdx = prices.indexOf(Math.max(...prices));
        const minIdx = prices.indexOf(Math.min(...prices));
        return { avg: Math.round(avg), max: { price: prices[maxIdx], date: history[maxIdx].date }, min: { price: prices[minIdx], date: history[minIdx].date }, count: history.length };

      /**
       * 趋势分析函数
       * @param {Array} prices - 价格数组
       * @param {number} currentIndex - 当前价格索引
       * @returns {Object} 趋势分析结果
       */
      calculateTrend(prices, currentIndex) {
        if (!prices || prices.length < 2 || currentIndex < 1) {
          return { direction: 'neutral', consecutive: 0 };
        }
        
        let consecutive = 0;
        let direction = 'neutral';
        
        // 从当前索引向前查找连续趋势
        for (let i = currentIndex; i > 0; i--) {
          const current = prices[i];
          const previous = prices[i - 1];
          
          if (current > previous) {
            if (direction === 'up' || direction === 'neutral') {
              direction = 'up';
              consecutive++;
            } else {
              break;
            }
          } else if (current < previous) {
            if (direction === 'down' || direction === 'neutral') {
              direction = 'down';
              consecutive++;
            } else {
              break;
            }
          } else {
            break; // 价格相等，趋势中断
          }
        }
        
        return { direction, consecutive };
      },

      /**
       * 百分位计算函数
       * @param {number} currentPrice - 当前价格
       * @param {Array} allPrices - 所有历史价格
       * @returns {number} 百分位数 (0-100)
       */
      calculatePercentile(currentPrice, allPrices) {
        if (!allPrices || allPrices.length === 0) return 50;
        
        const sortedPrices = [...allPrices].sort((a, b) => a - b);
        const lowerCount = sortedPrices.filter(price => price < currentPrice).length;
        return Math.round((lowerCount / sortedPrices.length) * 100);
      },

      /**
       * 波动率计算函数
       * @param {Array} prices - 价格数组
       * @returns {Object} 波动率分析结果
       */
      calculateVolatility(prices) {
        if (!prices || prices.length < 2) {
          return { volatility: 0, level: 'stable', label: '稳定' };
        }
        
        // 计算价格变化率
        const changes = [];
        for (let i = 1; i < prices.length; i++) {
          const change = Math.abs((prices[i] - prices[i - 1]) / prices[i - 1]) * 100;
          changes.push(change);
        }
        
        // 计算平均波动率
        const avgVolatility = changes.reduce((sum, change) => sum + change, 0) / changes.length;
        
        // 波动率等级分类
        let level, label, color;
        if (avgVolatility < 5) {
          level = 'stable';
          label = '稳定';
          color = '🟢';
        } else if (avgVolatility < 15) {
          level = 'normal';
          label = '正常';
          color = '🔵';
        } else if (avgVolatility < 30) {
          level = 'volatile';
          label = '波动';
          color = '🟡';
        } else {
          level = 'extreme';
          label = '剧烈';
          color = '🔴';
        }

        return {
          volatility: avgVolatility,
          level,
          label,
          color
        };

      /**
       * 价格区间分析
       * @param {Array} prices - 价格数组
       * @returns {Object} 价格区间信息

      calculatePriceRange(prices) {
        if (!prices || prices.length === 0) {
          return { min: 0, max: 0, range: 0, rangePercent: 0 };
        }
        
        const min = Math.min(...prices);
        const max = Math.max(...prices);
        const range = max - min;
        const rangePercent = min > 0 ? (range / min) * 100 : 0;
        
        return { min, max, range, rangePercent };

      /**

      calculateMomentum(prices, currentIndex) {
        if (!prices || prices.length < 3 || currentIndex < 2) {
          return { momentum: 0, strength: 'neutral', label: '平稳', color: '⚪' };
        }
        
        // 计算短期和中期动量
        const current = prices[currentIndex];
        const prev1 = prices[currentIndex - 1];
        const prev2 = prices[currentIndex - 2];
        
        // 短期动量（最近2次变化）
        const shortTermMomentum = ((current - prev1) / prev1) * 100;
        const mediumTermMomentum = ((current - prev2) / prev2) * 100;
        
        // 综合动量
        const momentum = (shortTermMomentum + mediumTermMomentum) / 2;
        
        // 动能强度分级
        let strength, label, color;
        const absMomentum = Math.abs(momentum);
        
        if (absMomentum < 1) {
          strength = 'weak';
          label = '平稳';
          color = '⚪';
        } else if (absMomentum < 3) {
          strength = 'moderate';
          label = '温和';
          color = momentum > 0 ? '🟡' : '🟠';
        } else if (absMomentum < 8) {
          strength = 'strong';
          label = '强劲';
          color = momentum > 0 ? '🟢' : '🔴';
        } else {
          strength = 'extreme';
          label = '剧烈';
          color = momentum > 0 ? '💚' : '❤️';
        }
        
        return {
          momentum,
          strength,
          label,
          color,
          direction: momentum > 0 ? 'up' : momentum < 0 ? 'down' : 'neutral'
        };

              action = 'hold';
              icon = '📊';
              color = '#3b82f6';
              confidence = 60;
            }
          } else if (trend.direction === 'down') {
            if (percentile < 20) {
              suggestion = '低位下跌，建议抄底';
              action = 'buy';
              icon = '💰';
              color = '#22c55e';
              confidence = 70;
            } else if (percentile > 70) {
              suggestion = '高位下跌，建议止损';
              action = 'sell';
              icon = '🛑';
              color = '#ef4444';
              confidence = 85;
            } else {
              suggestion = '下跌趋势，建议观望';
              action = 'hold';
              icon = '👀';
              color = '#f59e0b';
              confidence = 65;
            }
          }
        }
        
        // 基于动能的调整
        if (momentum.strength === 'extreme') {
          if (momentum.direction === 'up' && action === 'buy') {
            suggestion = '动能过强，建议分批买入';
            confidence = Math.min(confidence + 10, 95);
          } else if (momentum.direction === 'down' && action === 'sell') {
            suggestion = '动能过强，建议分批卖出';
            confidence = Math.min(confidence + 10, 95);
          }
        }
        
        // 基于波动率的调整
        if (volatility.level === 'extreme') {
          suggestion += '（高波动，谨慎操作）';
          confidence = Math.max(confidence - 15, 30);
          color = '#f59e0b';
        } else if (volatility.level === 'stable') {
          suggestion += '（低波动，稳定）';
          confidence = Math.min(confidence + 5, 95);
        }
        
        // 基于价格区间的调整
        const pricePosition = (currentPrice - priceRange.min) / (priceRange.max - priceRange.min);
        if (pricePosition > 0.9) {
          suggestion += '（接近历史高位）';
          confidence = Math.max(confidence - 10, 40);
        } else if (pricePosition < 0.1) {
          suggestion += '（接近历史低位）';
          confidence = Math.min(confidence + 10, 95);
        }
        
        return {
          suggestion,
          action,
          icon,
          color,
          confidence: Math.round(confidence),
          risk: volatility.level === 'extreme' ? 'high' : volatility.level === 'volatile' ? 'medium' : 'low'
        };
      },

      /**
       * 生成智能总结
       * @param {Array} history - 历史价格数据
       * @param {number} days - 分析天数，默认30天
       * @returns {Object} 智能总结结果
       */
      generateSmartSummary(history, days = 30) {
        if (!history || history.length === 0) {
          return { summary: '暂无数据', trend: 'neutral', trendIcon: '➡️' };
        }
        
        // 获取最近N天的数据
        const recentHistory = history.slice(-days);
        if (recentHistory.length === 0) {
          return { summary: '暂无数据', trend: 'neutral', trendIcon: '➡️' };
        }
        
        const prices = recentHistory.map(h => h.close);
        const dates = recentHistory.map(h => h.date);
        
        // 计算高低点
        const highPrice = Math.max(...prices);
        const lowPrice = Math.min(...prices);
        
        // 计算波动区间
        const rangePercent = lowPrice > 0 ? ((highPrice - lowPrice) / lowPrice * 100) : 0;
        
        // 计算趋势
        const firstPrice = prices[0];
        const lastPrice = prices[prices.length - 1];
        const priceChange = lastPrice - firstPrice;
        const priceChangePercent = firstPrice > 0 ? (priceChange / firstPrice * 100) : 0;
        
        let trend = 'neutral';
        let trendIcon = '➡️';
        
        if (priceChangePercent > 5) {
          trend = 'up';
          trendIcon = '📈';
        } else if (priceChangePercent < -5) {
          trend = 'down';
          trendIcon = '📉';
        }
        
        // 生成简洁的总结文本
        const trendText = trend === 'up' ? '上升' : trend === 'down' ? '下降' : '平稳';
        const summary = `${trendText} ${trendIcon} | 波动 ${rangePercent.toFixed(0)}% | 最高 ¥${highPrice.toLocaleString()}`;
        
        return {
          summary,
          trend,
          trendIcon,
          highPrice,
          lowPrice,
          rangePercent: Math.round(rangePercent * 10) / 10,
          priceChange,
          priceChangePercent: Math.round(priceChangePercent * 10) / 10,
          days: recentHistory.length
        };
      },

      downloadFile(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        Object.assign(a, { href: url, download: filename });
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 100);
      },

      debounce: (fn, delay = 300) => { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); }; },
      throttle: (fn, delay = 100) => { let lastCall = 0; return (...args) => { const now = Date.now(); if (now - lastCall >= delay) { lastCall = now; return fn(...args); } }; },
      debounceThrottle: (fn, debounceDelay = 300, throttleDelay = 100) => { let timer, lastCall = 0; return (...args) => { const now = Date.now(); clearTimeout(timer); if (now - lastCall >= throttleDelay) { lastCall = now; return fn(...args); } timer = setTimeout(() => { lastCall = Date.now(); fn(...args); }, debounceDelay); }; },
      
      measurePerformance: (name, fn) => {

      },
      
      getMemoryUsage: () => performance.memory ? { used: Math.round(performance.memory.usedJSHeapSize / 1024 / 1024), total: Math.round(performance.memory.totalJSHeapSize / 1024 / 1024), limit: Math.round(performance.memory.jsHeapSizeLimit / 1024 / 1024) } : null,
      
      processLocalFilePath: (path) => {
        if (!path) return '';
        const cleanPath = path.trim().replace(/[\u200E\u200F\u202A-\u202E]/g, '');
        return /^[A-Za-z]:\\/.test(cleanPath) ? 'file:///' + cleanPath.replace(/\\/g, '/') : cleanPath;
      },
      
      testIconPath: (iconPath) => {

        img.onerror = () => console.error(`❌ 图标加载失败: ${convertedPath}`);
        img.src = convertedPath;

      },
      
      createElement: (tag, className = '', content = '') => { 
        const el = document.createElement(tag); 
        if (className) el.className = className; 
        if (content) el.innerHTML = content; 
        return el; 
      },
      
      bindEvents: (events) => {
        Object.entries(events).forEach(([selector, handlers]) => {
          const element = typeof selector === 'string' ? document.querySelector(selector) : selector;
          if (element) {
            Object.entries(handlers).forEach(([event, handler]) => {
              element.addEventListener(event, handler);
            });
          }
        });
      },
      
      validateForm: (fields) => {
        const errors = [];
        Object.entries(fields).forEach(([name, rules]) => {
          const element = document.getElementById(name);
          if (!element) return;
          
          const value = element.value.trim();
          const label = rules.label || name;
          
          // 必填验证
          if (rules.required && !value) {
            errors.push(`${label}不能为空`);
            return;
          }
          
          // 数字类型验证
          if (rules.type === 'number' && value) {
            const num = parseFloat(value);
            if (isNaN(num)) {
              errors.push(`${label}必须是有效数字`);
            } else {
              if (rules.min !== undefined && num < rules.min) {
                errors.push(`${label}不能小于${rules.min}`);
              }
              if (rules.max !== undefined && num > rules.max) {
                errors.push(`${label}不能大于${rules.max}`);
              }
            }
          }
          
          // 正则表达式验证
          if (rules.pattern && value && !rules.pattern.test(value)) {
            errors.push(`${label}格式不正确`);
          }
        });
        
        return { isValid: errors.length === 0, errors };
      },
      
      animate: (element, keyframes, options = {}) => element.animate ? element.animate(keyframes, { duration: 300, fill: 'forwards', ...options }) : Promise.resolve(),
      
      formatTimeAgo: (timestamp) => {
        const now = new Date();
        const time = new Date(timestamp);
        const diffMs = now - time;
        const diffSeconds = Math.floor(diffMs / 1000);
        const diffMinutes = Math.floor(diffSeconds / 60);
        const diffHours = Math.floor(diffMinutes / 60);
        const diffDays = Math.floor(diffHours / 24);
        
        if (diffSeconds < 60) {
          return '刚刚';
        } else if (diffMinutes < 60) {
          return `${diffMinutes}分钟前`;
        } else if (diffHours < 24) {
          return `${diffHours}小时前`;
        } else if (diffDays < 7) {
          return `${diffDays}天前`;
        } else if (diffDays < 30) {
          const weeks = Math.floor(diffDays / 7);
          return `${weeks}周前`;
        } else if (diffDays < 365) {
          const months = Math.floor(diffDays / 30);
          return `${months}个月前`;
        } else {
          const years = Math.floor(diffDays / 365);
          return `${years}年前`;
        }
      }
    };

    // ==================== 数据库管理器 ====================
    class DatabaseManager {
      constructor() {
        this.db = null;
        this.currentUserId = CONFIG.DEFAULT_USER_ID; // 当前用户ID（数字）
      }

      /**
       * 初始化数据库连接 - 支持8表结构
       */
      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => {
            this.db = request.result;
            console.log('✅ 数据库初始化成功 - 8表架构');
            resolve(this.db);
          };
          request.onupgradeneeded = (event) => {
            console.log(`🔄 数据库升级: ${event.oldVersion} → ${event.newVersion}`);
            this._createStores(event.target.result, event.oldVersion);
          };
        });
      }

      /**
       * 创建8表数据库结构
       */
      _createStores(db, oldVersion) {
        // 1. users 表 - 使用自动递增的数字ID
        if (!db.objectStoreNames.contains(CONFIG.STORE_USERS)) {
          const usersStore = db.createObjectStore(CONFIG.STORE_USERS, { keyPath: 'uId', autoIncrement: true });
          usersStore.createIndex('username', 'username', { unique: false });
          usersStore.createIndex('email', 'email', { unique: false });
          usersStore.createIndex('createdAt', 'createdAt', { unique: false });
          console.log('✅ 创建 users 表（uId自动递增）');
        } else if (oldVersion < 6) {
          // 数据库升级：从版本5升级到版本6
          // 需要重建users表以支持自动递增
          console.log('🔄 升级 users 表以支持uId自动递增...');
          // 注意：由于IndexedDB限制，无法直接修改objectStore的keyPath
          // 这里只是标记，实际迁移会在数据加载时处理
        }

        // 2. items 表（全局道具市场数据）
        if (!db.objectStoreNames.contains(CONFIG.STORE_ITEMS)) {
          const itemsStore = db.createObjectStore(CONFIG.STORE_ITEMS, { keyPath: 'id', autoIncrement: true });
          itemsStore.createIndex('name', 'name', { unique: true });
          itemsStore.createIndex('category', 'category', { unique: false });
          itemsStore.createIndex('subCategory', 'subCategory', { unique: false });
          itemsStore.createIndex('price', 'price', { unique: false });
          itemsStore.createIndex('marketTrend', 'marketTrend', { unique: false });
          itemsStore.createIndex('updatedAt', 'updatedAt', { unique: false });
          console.log('✅ 创建 items 表');
        }

        // 3. user_holdings 表（用户持仓）
        if (!db.objectStoreNames.contains(CONFIG.STORE_HOLDINGS)) {
          const holdingsStore = db.createObjectStore(CONFIG.STORE_HOLDINGS, { keyPath: 'holdingId' });
          holdingsStore.createIndex('uId', 'uId', { unique: false });
          holdingsStore.createIndex('itemId', 'itemId', { unique: false });
          holdingsStore.createIndex('profitRate', 'profitRate', { unique: false });
          holdingsStore.createIndex('synced', 'synced', { unique: false });
          console.log('✅ 创建 user_holdings 表');
        }

        // 4. records 表（交易记录）
        if (!db.objectStoreNames.contains(CONFIG.STORE_RECORDS)) {
          const recordsStore = db.createObjectStore(CONFIG.STORE_RECORDS, { keyPath: 'id', autoIncrement: true });
          recordsStore.createIndex('uId', 'uId', { unique: false });
          recordsStore.createIndex('itemId', 'itemId', { unique: false });
          recordsStore.createIndex('type', 'type', { unique: false });
          recordsStore.createIndex('timestamp', 'timestamp', { unique: false });
          console.log('✅ 创建 records 表');
        }

        // 5. price_history 表（价格历史）
        if (!db.objectStoreNames.contains(CONFIG.STORE_PRICE_HISTORY)) {
          const priceHistoryStore = db.createObjectStore(CONFIG.STORE_PRICE_HISTORY, { keyPath: 'id', autoIncrement: true });
          priceHistoryStore.createIndex('itemId', 'itemId', { unique: false });
          priceHistoryStore.createIndex('date', 'date', { unique: false });
          priceHistoryStore.createIndex('price', 'price', { unique: false });
          console.log('✅ 创建 price_history 表');
        }

        // 6. user_stats 表（用户统计）
        if (!db.objectStoreNames.contains(CONFIG.STORE_USER_STATS)) {
          const userStatsStore = db.createObjectStore(CONFIG.STORE_USER_STATS, { keyPath: 'uId' });
          userStatsStore.createIndex('profitRate', 'profitRate', { unique: false });
          userStatsStore.createIndex('totalInvestment', 'totalInvestment', { unique: false });
          userStatsStore.createIndex('activeDays', 'activeDays', { unique: false });
          console.log('✅ 创建 user_stats 表');
        }

        // 7. pinyin_cache 表
        if (!db.objectStoreNames.contains(CONFIG.STORE_PINYIN)) {
          const pinyinStore = db.createObjectStore(CONFIG.STORE_PINYIN, { keyPath: 'name' });
          pinyinStore.createIndex('pinyin', 'pinyin', { unique: false });
          pinyinStore.createIndex('initials', 'initials', { unique: false });
          console.log('✅ 创建 pinyin_cache 表');

        // 8. config 表
        if (!db.objectStoreNames.contains(CONFIG.STORE_CONFIG)) {
