          configStore.createIndex('category', 'category', { unique: false });
          console.log('✅ 创建 config 表');
        }
      }

      /**
       * 通用数据库请求执行方法
       */
      async _executeRequest(storeName, mode, operation) {
        const transaction = this.db.transaction([storeName], mode);
        const store = transaction.objectStore(storeName);
        return new Promise((resolve, reject) => {
          const request = operation(store);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      // ==================== 基础CRUD操作 ====================

      async get(storeName, key) {
        return this._executeRequest(storeName, 'readonly', store => store.get(key));
      }

      async getAll(storeName) {
        return this._executeRequest(storeName, 'readonly', store => store.getAll())
          .then(result => result || []);
      }

      async put(storeName, value) {
        return this._executeRequest(storeName, 'readwrite', store => store.put(value));
      }

      async add(storeName, value) {
        return this._executeRequest(storeName, 'readwrite', store => store.add(value));
      }

      async delete(storeName, key) {
        return this._executeRequest(storeName, 'readwrite', store => store.delete(key));
      }

      async getByIndex(storeName, indexName, value) {
        const transaction = this.db.transaction([storeName], 'readonly');
        const store = transaction.objectStore(storeName);
        const index = store.index(indexName);
        return new Promise((resolve, reject) => {
          const request = index.getAll(value);
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      // ==================== 道具相关操作 ====================

      /**
       * 保存道具（数据转换适配器）
       * 将前端数据格式转换为新的8表结构并保存
       */
      async saveItem(item) {
        // 将前端item数据拆分保存到新的8表结构

        const itemId = item.id || await this._getNextItemId();

        // 1. 保存到items表（全局市场数据）
        const itemData = {
          id: itemId,
          name: item.name,
          price: item.price || 0,
          basePrice: item.basePrice || item.price || 0,
          marketTrend: this._calculateTrend(item.history || []),
          category: item.category || '未分类',
          subCategory: item.subCategory || '',
          icon: item.icon || '',
          rarityLevel: item.rarityLevel || '普通',
          isFavorite: item.isFavorite || false,
          supply: 0,
          demand: 0,
          totalTransactions: (item.history || []).length,
          createdAt: item.createdAt || Date.now(),
          updatedAt: Date.now(),
          priceUpdatedAt: Date.now()
        };
        await this.put(CONFIG.STORE_ITEMS, itemData);

        // 2. 保存持仓到user_holdings表 - 从inventory结构读取
        if (item.inventory && item.inventory.currentStock !== undefined) {
          const holdingId = `${this.currentUserId}#${itemId}`;
          const holding = {
            holdingId,
            uId: this.currentUserId,
            itemId,
            batches: item.inventory.batches || [],
            currentStock: item.inventory.currentStock,
            lockedStock: 0,
            totalInvestment: item.inventory.totalInvestment || 0,
            totalRevenue: 0,
            averageCost: item.inventory.averageCost || 0,
            averageSellPrice: 0,
            profit: 0,
            unrealizedProfit: 0,
            profitRate: 0,
            lastOperation: 'update',
            lastUpdated: Date.now(),
            version: 1,
            synced: false,
            lastSyncTime: 0
          };
          await this.put(CONFIG.STORE_HOLDINGS, holding);
        }

        // 3. 保存历史记录到price_history和records表
        if (item.history && item.history.length > 0) {
          for (const h of item.history) {
            // 保存到price_history
            await this.add(CONFIG.STORE_PRICE_HISTORY, {
              itemId,
              date: h.date,
              open: h.open || h.close,
              high: h.high || h.close,
              low: h.low || h.close,
              close: h.close,
              volume: h.volume || 0,
              change: h.change || 0,
              changePercent: h.changePercent || 0,
              metadata: {}
            }).catch(() => {}); // 忽略重复错误
          }
        }

        return itemId;
      }

      async _getNextItemId() {
        const items = await this.getAll(CONFIG.STORE_ITEMS);
        return items.length > 0 ? Math.max(...items.map(i => i.id || 0)) + 1 : 1;
      }

      _calculateTrend(history) {
        if (!history || history.length < 2) return 'stable';
        const recent = history.slice(-5);
        const first = recent[0]?.close || 0;
        const last = recent[recent.length - 1]?.close || 0;
        const change = ((last - first) / first) * 100;
        if (change > 5) return 'up';
        if (change < -5) return 'down';
        return 'stable';
      }

      /**
       * 批量保存数据（数据转换适配器）
       * 将多个前端数据格式转换为新的8表结构并保存
       */
      async bulkSave(items) {
        console.log(`📊 批量保存 ${items.length} 个道具到8表结构...`);

        for (const item of items) {
          await this.saveItem(item);
        }

        console.log('✅ 批量保存完成');
        return true;
      }

      /**
       * 删除道具（级联删除所有相关数据）
       */
      async deleteItem(itemId) {
        console.log(`🗑️ 开始删除道具 ID=${itemId}，级联删除所有相关数据...`);

        try {
          // 1. 删除 items 表中的道具
          await this.delete(CONFIG.STORE_ITEMS, itemId);

          // 2. 删除 user_holdings 表中的所有持仓记录
          const holdings = await this.getByIndex(CONFIG.STORE_HOLDINGS, 'itemId', itemId);
          for (const holding of holdings) {
            await this.delete(CONFIG.STORE_HOLDINGS, holding.holdingId);
          }

          // 3. 删除 price_history 表中的所有价格历史
          const priceHistory = await this.getByIndex(CONFIG.STORE_PRICE_HISTORY, 'itemId', itemId);
          for (const history of priceHistory) {
            await this.delete(CONFIG.STORE_PRICE_HISTORY, history.historyId);
          }

          // 4. 删除 records 表中的所有相关记录
          const records = await this.getByIndex(CONFIG.STORE_RECORDS, 'itemId', itemId);
          for (const record of records) {
            await this.delete(CONFIG.STORE_RECORDS, record.recordId);
          }

          console.log(`✅ 道具 ID=${itemId} 及所有相关数据删除完成`);
          return true;
        } catch (err) {
          console.error(`❌ 删除道具 ID=${itemId} 失败:`, err);
          throw err;
        }
      }

        try {

          const items = await this.db.getAll(CONFIG.STORE_ITEMS);

          // 2. 从user_holdings表加载当前用户的持仓
          const holdings = await this.db.getByIndex(CONFIG.STORE_HOLDINGS, 'uId', this.db.currentUserId);
          console.log(`✅ 加载了 ${holdings.length} 个持仓记录，用户ID: ${this.db.currentUserId}`);

          // 3. 从records表加载当前用户的交易记录
          const records = await this.db.getByIndex(CONFIG.STORE_RECORDS, 'uId', this.db.currentUserId);
          console.log(`✅ 加载了 ${records.length} 条交易记录`);

          // 4. 从price_history表加载价格历史
          const priceHistory = await this.db.getAll(CONFIG.STORE_PRICE_HISTORY);
          console.log(`✅ 加载了 ${priceHistory.length} 条价格历史`);

          // 5. 将数据合并为UI层需要的格式
          this.data = items.map(item => {
            // 查找该道具的持仓信息
            const holding = holdings.find(h => h.itemId === item.id);

            // 查找该道具的交易记录（用于operationHistory）
            const itemRecords = records
              .filter(r => r.itemId === item.id)
              .sort((a, b) => a.timestamp - b.timestamp)
              .map(r => ({
                type: r.type, // 'buy', 'sell', 'price_change'
                quantity: r.quantity || 0,
                price: r.price || 0,
                timestamp: r.timestamp,
                note: r.note || '',
                stockAfter: r.afterStock || 0,
                totalRevenue: r.type === 'sell' ? r.totalAmount || 0 : undefined,
                totalCost: r.type === 'buy' ? r.totalAmount || 0 : undefined,
                // 价格变动相关字段
                oldPrice: r.metadata?.oldPrice,
                newPrice: r.metadata?.newPrice,
                change: r.metadata?.change,
                changePercent: r.metadata?.changePercent
              }));

            // 查找该道具的价格历史
            const history = priceHistory
              .filter(h => h.itemId === item.id)
              .sort((a, b) => a.date - b.date)
              .map(h => ({
                date: h.date,
                open: h.open,
                high: h.high,
                low: h.low,
                close: h.close,
                volume: h.volume,
                change: h.change,
                changePercent: h.changePercent
              }));

            // 合并为UI需要的格式
            return {
              id: item.id,
              name: item.name,
              price: item.price,
              basePrice: item.basePrice,
              category: item.category,
              subCategory: item.subCategory,
              icon: item.icon,
              isFavorite: item.isFavorite || false,
              rarityLevel: item.rarityLevel,

              // 持仓信息 - 使用inventory结构（与UI层一致）
              inventory: holding ? {
                currentStock: holding.currentStock,
                totalInvestment: holding.totalInvestment,
                averageCost: holding.averageCost,
                operationHistory: itemRecords // 从records表加载操作历史
              } : {
                currentStock: 0,
                totalInvestment: 0,
                averageCost: 0,
                operationHistory: itemRecords // 即使没有持仓，也要加载历史记录
              },

              // 价格历史
              history: history,

              // 其他字段
              createdAt: item.createdAt,
              updatedAt: item.updatedAt
            };
          });

          console.log(`✅ 数据合并完成，共 ${this.data.length} 个道具`);

          // 为现有道具添加isFavorite字段（如果不存在）
          let dataChanged = false;
          this.data.forEach(item => {
            if (item.isFavorite === undefined) {
              item.isFavorite = false;
              dataChanged = true;
            }
          });

          // 如果有数据变更，保存到数据库
          if (dataChanged) {
            await this.saveData();
            console.log('✅ 已为现有道具添加收藏字段');
          }

          // 加载配置
          const configCats = await this.db.get(CONFIG.STORE_CONFIG, 'categories');
          const configTheme = await this.db.get(CONFIG.STORE_CONFIG, 'theme');
          const featureToggles = await this.db.get(CONFIG.STORE_CONFIG, 'feature_toggles');
          const pinyinCache = await this.db.get(CONFIG.STORE_CONFIG, 'pinyin_cache');

          if (configCats) this.categories = configCats.value;
          if (configTheme) {
            this.themePref = configTheme.value;
            // 同时保存到localStorage以便立即读取
            localStorage.setItem('game_trader_theme', configTheme.value);
          }
          if (pinyinCache && pinyinCache.value) {
            this.pinyinCache = new Map(Object.entries(pinyinCache.value));
            console.log('📚 已加载拼音缓存:', this.pinyinCache.size, '条记录');
          }
          if (featureToggles && typeof featureToggles.value === 'object') {
            const v = featureToggles.value;
            if (typeof v.icons === 'boolean') this.enableIcons = v.icons;
            if (typeof v.toast === 'boolean') this.enableToast = v.toast;
            if (typeof v.chartDelete === 'boolean') this.enableChartDelete = v.chartDelete;
            if (typeof v.categoryTag === 'boolean') this.enableCategoryTag = v.categoryTag;
            if (typeof v.formatPrice === 'boolean') this.enableFormatPrice = v.formatPrice;
            if (typeof v.hideChartDeleteHint === 'boolean') this.hideChartDeleteHint = v.hideChartDeleteHint;
          }

      buildIndexes() {
        this.dataMap.clear();
        this.categoryIndex.clear();
        
        this.data.forEach(item => {
          this.dataMap.set(item.name, item);
          
          const catKey = item.category || '未分类';
          const subKey = item.subCategory ? `${catKey}>${item.subCategory}` : catKey;
          
          if (!this.categoryIndex.has(catKey)) {
            this.categoryIndex.set(catKey, []);
          }
          this.categoryIndex.get(catKey).push(item);
          
          if (item.subCategory) {
            if (!this.categoryIndex.has(subKey)) {
              this.categoryIndex.set(subKey, []);
            }
            this.categoryIndex.get(subKey).push(item);
          }
        });
        
        // 数据加载和索引构建完成
        this.dataLoaded = true;
      }

      async _saveOperation(operation, errorMsg) {
        try {
          await operation();
          // 使用微任务延迟索引重建，避免阻塞 IndexedDB 的 success handler
          Promise.resolve().then(() => {
          this.buildIndexes();
          this.filteredCache = null;
          });
          return true;
        } catch (err) {
          console.error(errorMsg, err);
          if (errorMsg.includes('数据')) this.showToast('保存失败: ' + err.message, '❌', 'error');
          return false;
        }
      }

      async saveItemQuick(item) { return this._saveOperation(() => this.db.saveItem(item), '保存item失败:'); }
      async saveData() { return this._saveOperation(() => this.db.bulkSave(this.data), '保存数据失败:'); }
      async saveConfig(key, value) { return this._saveOperation(() => this.db.put(CONFIG.STORE_CONFIG, { key, value }), '保存配置失败:'); }
      async savePinyinCache() { 
        const cacheObj = Object.fromEntries(this.pinyinCache);
        console.log('💾 保存拼音缓存到数据库:', this.pinyinCache.size, '条记录');

          console.log('💾 强制保存拼音缓存:', this.pinyinCache.size, '条记录');

        } catch (err) {

          }
        }
      }

      getPinyin(name) {
        if (this.pinyinCache.has(name)) return this.pinyinCache.get(name);
        
        try {
          if (window.pinyinPro?.pinyin) {
            const full = window.pinyinPro.pinyin(name, {toneType: 'none'}).replace(/\s+/g, '').toLowerCase();
            const arr = window.pinyinPro.pinyin(name, {toneType: 'none', type: 'array'});
            const initials = arr.map(s => s[0] || '').join('').toLowerCase();
            const result = [full, initials, name.toLowerCase()];
            this.pinyinCache.set(name, result);
            
            // 异步保存拼音缓存到数据库（不阻塞主线程）
            const now = Date.now();
            if (this.pinyinCache.size % 50 === 0 && now - this.lastPinyinSaveTime > 10000) {
              this.lastPinyinSaveTime = now;
              this.savePinyinCache().catch(err => console.warn('保存拼音缓存失败:', err));
            }
            
            return result;
          }
        } catch (e) {
          console.error('拼音转换错误:', e);
        }
        
        const low = name.toLowerCase();
        const result = [low, low, low];
        this.pinyinCache.set(name, result);
        return result;
      }

      getCategoryCounts() {
        const counts = {'全部类型': this.data.length};
        
        // 计算收藏道具数量
        counts['收藏'] = this.data.filter(item => item.isFavorite === true).length;
        
        this.categories.forEach(cat => {
          const catItems = this.categoryIndex.get(cat.name) || [];
          counts[cat.name] = catItems.length;
          
          if (cat.subs) {
            cat.subs.forEach(sub => {
              const subKey = `${cat.name}>${sub}`;
              counts[subKey] = (this.categoryIndex.get(subKey) || []).length;
            });
          }
        });
        
        counts['未分类'] = this.categoryIndex.get('未分类')?.length || 0;
        return counts;
      }

      filterItems(searchKeyword) {
        this.lastSearchKeyword = searchKeyword;
        
        let baseData;
        if (this.activeCategory === '全部类型') {
          baseData = this.data;
        } else if (this.activeCategory === '收藏') {
          baseData = this.data.filter(item => item.isFavorite === true);
        } else if (this.activeSubCategory) {
          const subKey = `${this.activeCategory}>${this.activeSubCategory}`;
          baseData = this.categoryIndex.get(subKey) || [];
        } else {
          baseData = this.categoryIndex.get(this.activeCategory) || [];
        }
        
        // 应用搜索关键词过滤
        if (searchKeyword && searchKeyword.trim() !== '') {
          const kw = searchKeyword.trim().toLowerCase();
          baseData = baseData.filter(item => this.matchesSearch(item, kw));
        }
        
        // 应用高级搜索过滤器
        if (this.advancedSearchFilters) {
          const filters = this.advancedSearchFilters;
          
          // 价格范围过滤
          if (filters.priceMin !== 0 || filters.priceMax !== Number.MAX_SAFE_INTEGER) {
            baseData = baseData.filter(item => {
              const price = item.price || 0;
              return price >= filters.priceMin && price <= filters.priceMax;
            });
          }
          
          // 价格变化过滤
          let hasActiveChangeFilter = false;
          const changeFilters = Object.values(filters.priceChange || {});
          if (changeFilters.some(v => v === true)) {
            hasActiveChangeFilter = true;
            baseData = baseData.filter(item => {
              const history = item.history || [];
              
              // 处理历史记录少于2条的情况：只能匹配"无变化"
              if (history.length < 2) {
                return filters.priceChange.noChange === true;
              }
              
              // 有足够历史记录：计算价格变化
              const prevPrice = history[history.length - 2].close || 0;
              const currentPrice = history[history.length - 1].close || 0;
              const change = currentPrice - prevPrice;
              
              // 价格变化逻辑
              if (change > 0 && filters.priceChange.up) return true;
              if (change < 0 && filters.priceChange.down) return true;
              if (change === 0 && filters.priceChange.neutral) return true;
              
              return false;
            });
          }
        }
        
        this.filteredCache = baseData;
        return baseData;
      }

      matchesSearch(item, kw) {
        const [full, initials, orig] = this.getPinyin(item.name);
        
        if (orig.includes(kw) || full.includes(kw) || initials.includes(kw)) return true;
        
        let i = 0, j = 0;
        while (i < kw.length && j < full.length) {
          if (kw[i] === full[j]) i++;
          j++;
        }
        if (i === kw.length) return true;
        
        i = 0; j = 0;
        while (i < kw.length && j < initials.length) {
          if (kw[i] === initials[j]) i++;
          j++;
        }
        return i === kw.length;
      }

      disposeChart() {
        if (this.chartInstance) {
          this.chartInstance.dispose();
          this.chartInstance = null;
        }
      }

    class ToastManager {
      constructor() {
        this.enabled = true;
        this.currentItem = null;
      }

      setCurrentItem(item) {
        this.currentItem = item;
      }

      show(message, icon = '✅', type = 'success') {
        if (!this.enabled) return;
        
        let iconHtml = '';
        if (this.currentItem && this.currentItem.icon) {
          iconHtml = `<img src="${this.currentItem.icon}" alt="icon" onerror="this.style.display='none';this.parentElement.textContent='${icon}'">`;
        } else if (this.currentItem) {
          const defaultIcon = Utils.getItemIcon(this.currentItem);
          iconHtml = `<img src="${defaultIcon}" alt="icon" onerror="this.style.display='none';this.parentElement.textContent='${icon}'">`;
        } else {
          iconHtml = icon;
        }
        
        const toast = Toastify({
          text: `<div class="toastify-content"><span class="toastify-icon">${iconHtml}</span><span class="toastify-text">${message}</span></div>`,
          duration: 3000,
          gravity: "top",
          position: "right",
          stopOnFocus: true,
          className: type,
          escapeMarkup: false,
          offset: {
            x: 20,// horizontal axis - can be a number or a string indicating unity. eg: '2em'
            y: 20// vertical axis - can be a number or a string indicating unity. eg: '2em'
          },
          style: {
            background: "transparent",
            boxShadow: "none",
            padding: "0"
          }
        });
        
        toast.showToast();
        
        this.currentItem = null;
      }

      success(message, icon = '✅') {
        this.show(message, icon, 'success');
      }

      error(message, icon = '❌') {
        this.show(message, icon, 'error');
      }

      warning(message, icon = '⚠️') {
        this.show(message, icon, 'warning');
      }

      info(message, icon = 'ℹ️') {
        this.show(message, icon, 'info');
      }

      setEnabled(enabled) {
        this.enabled = enabled;
      }
    }

    // 搜索管理器类
    class SearchManager {
      constructor(inputElement, callbacks) {
        this.input = inputElement;
        this.callbacks = callbacks;
        this.state = {
          inputCount: 0,
          lastInputTime: 0,
          isTypingFast: false,
          lastKeyword: ''
        };
        this.config = {
          fastInputThreshold: 100, // 快速输入阈值(ms)
          burstInputThreshold: 300, // 爆发输入阈值(ms)
          burstInputCount: 3, // 爆发输入次数
          resetDelay: 500, // 重置延迟(ms)
          normalSearchDelay: 200, // 正常搜索延迟(ms)
          fastSearchDelay: 400 // 快速搜索延迟(ms)
        };

        // 使用优化的防抖函数
        this.debouncedSearch = Utils.debounce((keyword) => {
          this.callbacks.onSearch(keyword);
          if (this.state.isTypingFast) {
            this.callbacks.onAnimation('shake');
          }
        }, this.config.normalSearchDelay);

        this.fastDebouncedSearch = Utils.debounce((keyword) => {
          this.callbacks.onSearch(keyword);
        }, this.config.fastSearchDelay);

        // 绑定处理器（保持this上下文）
        this._handleInput = this.handleInput.bind(this);
        this._handleKeydown = this.handleKeydown.bind(this);
        this._handlePaste = this.handlePaste.bind(this);

        // 使用节流的重置函数
        this.throttledReset = Utils.throttle(() => {
          if (Date.now() - this.state.lastInputTime > this.config.resetDelay) {
            this.state.inputCount = 0;
            this.state.isTypingFast = false;
          }
        }, this.config.resetDelay);
      }

      bindEvents() {
        this.input.addEventListener('input', this._handleInput, { passive: true });
        this.input.addEventListener('keydown', this._handleKeydown);
        this.input.addEventListener('paste', this._handlePaste, { passive: true });
      }

      handleInput(e) {
        const currentTime = Date.now();
        const keyword = e.target.value.trim();

        // 检测快速输入
        this.detectFastInput(currentTime);

        // 更新状态
        this.state.lastInputTime = currentTime;

        // 重置计数器（使用节流）
        this.throttledReset();

        // 清空搜索检测
        if (keyword === '' && this.state.lastKeyword !== '') {
          this.callbacks.onAnimation('shake');
        }

        // 执行搜索（根据输入速度选择不同的防抖）
        if (keyword !== this.state.lastKeyword) {
          if (this.state.isTypingFast) {
            this.debouncedSearch.cancel();
            this.fastDebouncedSearch(keyword);
          } else {
            this.fastDebouncedSearch.cancel();
            this.debouncedSearch(keyword);
          }
        }

        this.state.lastKeyword = keyword;
      }

      handleKeydown(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          this.executeImmediateSearch();
        } else if (e.key === 'Escape') {
          // ESC键清空搜索
          this.input.value = '';
          this.executeImmediateSearch();
        }
      }

      handlePaste(e) {
        // 使用requestAnimationFrame优化粘贴动画
        requestAnimationFrame(() => {
          this.callbacks.onAnimation('pulse');
        });
      }

      detectFastInput(currentTime) {
        this.state.inputCount++;
        const timeDiff = currentTime - this.state.lastInputTime;

        if (timeDiff < this.config.fastInputThreshold) {
          this.state.isTypingFast = true;
          this.callbacks.onAnimation('pulse');
        } else if (this.state.inputCount > this.config.burstInputCount &&
                   timeDiff < this.config.burstInputThreshold) {
          this.state.isTypingFast = true;
          this.callbacks.onAnimation('warning');
        } else {
          this.state.isTypingFast = false;
        }
      }

      executeImmediateSearch() {
        // 取消所有待处理的搜索
        this.debouncedSearch.cancel();
        this.fastDebouncedSearch.cancel();

        const keyword = this.input.value.trim();
        this.callbacks.onSearch(keyword);
        this.callbacks.onAnimation('shake');
      }

      // 清空搜索
      clear() {
        this.input.value = '';
        this.state.lastKeyword = '';
        this.executeImmediateSearch();
      }

      // 设置搜索关键词
      setKeyword(keyword) {
        this.input.value = keyword;
        this.executeImmediateSearch();
      }

      destroy() {
        // 取消所有待处理的操作
        this.debouncedSearch.cancel();
        this.fastDebouncedSearch.cancel();
        this.throttledReset.cancel();

        // 移除事件监听器
        this.input.removeEventListener('input', this._handleInput);
        this.input.removeEventListener('keydown', this._handleKeydown);
        this.input.removeEventListener('paste', this._handlePaste);

        // 清空引用
        this.input = null;
        this.callbacks = null;
      }
    }

    class UIManager {
      constructor(state) {
        this.state = state;
        this.currentUserId = 1; // 当前用户ID，默认为1（数字）

        // 使用批量DOM查询优化初始化
        this._initializeElements();

        this.toast = new ToastManager();
        this.iconCache = new Map(); // 图标加载缓存
        this.loadingQueue = []; // 图标加载队列
        this.maxConcurrentLoads = 6; // 最大并发加载数
        this.currentLoads = 0; // 当前加载数

        // 创建DOM缓存
        this.domCache = Utils.createDOMCache();

        // 使用节流的缓存清理（每10分钟）
        this.cacheCleanupInterval = setInterval(
          Utils.throttle(() => {
            this.cleanIconCache();
            this.domCache.clear();
          }, 60000),
          10 * 60 * 1000
        );
      }

      // 优化的元素初始化方法
      _initializeElements() {
        // 使用对象解构和单次批量查询
        const elementIds = [
          'itemList', 'categoryMenu', 'categoryLabel', 'categoryBtn',
          'searchInput', 'modalRoot', 'modalBox', 'pagination',
          'paginationInfo', 'paginationPages', 'firstPageBtn',
          'prevPageBtn', 'nextPageBtn', 'lastPageBtn', 'pageSizeSelect'
        ];

        this.elements = {};

        // 批量获取元素（减少DOM访问次数）
        requestAnimationFrame(() => {
          elementIds.forEach(id => {
            this.elements[id] = document.getElementById(id);
          });
        });

        // 立即返回一个Proxy，延迟获取元素直到真正需要时
        const elementsProxy = new Proxy({}, {
          get: (target, prop) => {
            if (!target[prop] && elementIds.includes(prop)) {
              target[prop] = document.getElementById(prop);
            }
            return target[prop];
          }
        });

        this.elements = elementsProxy;
      }

      openModal(html, wide = false) {
        this.elements.modalBox.innerHTML = html;
        this.elements.modalBox.className = wide ? 'modal modal-wide' : 'modal';
        this.elements.modalRoot.style.display = 'flex';
      }

      closeModal() {
        this._cleanupModalResources();
        this.elements.modalRoot.style.display = 'none';
      }
      
      // 清理模态框资源
      _cleanupModalResources() {
        this.state.disposeChart();
        if (this.state.chartResizeHandler) {
          window.removeEventListener('resize', this.state.chartResizeHandler);
          this.state.chartResizeHandler = null;
        }
        // 隐藏移动端提示框
        this.hideMobileTooltip();
        // 重置渲染状态
        this.state.isRendering = false;
        this.state.isRenderingList = false;
        // 清理主题颜色缓存
        this.state.themeColors = null;
      }

            if (e.target === dialog) {

        // 防抖变量
        let isTransitioning = false;
        
        // 标签切换函数
        const switchTab = (targetTab) => {
          // 防止快速连续点击
          if (isTransitioning) {
            return;
          }
          
          // 验证目标标签是否存在
          const targetContent = modal.querySelector(`[data-content="${targetTab}"]`);
          if (!targetContent) {
            console.warn(`标签内容不存在: ${targetTab}`);
            return;
          }
          
          // 如果目标内容已经是激活状态，直接返回
          if (targetContent.classList.contains('active')) {
            return;
          }
          
          isTransitioning = true;
          
          // 更新标签状态
          tabs.forEach(t => t.classList.remove('active'));
          const activeTab = modal.querySelector(`[data-tab="${targetTab}"]`);
          if (activeTab) {
            activeTab.classList.add('active');
          }
          
          // 更新内容显示 - 先隐藏所有内容，再显示目标内容
          contents.forEach(content => {
            if (content.classList.contains('active')) {
              content.classList.remove('active');
            }
          });
          
          // 立即显示目标内容，避免闪现
          targetContent.classList.add('active');
          
          // 重置防抖状态
          setTimeout(() => {
            isTransitioning = false;
          }, 300);
        };
        
        tabs.forEach(tab => {
          tab.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const targetTab = tab.dataset.tab;
            switchTab(targetTab);
          });
          
          // 添加键盘导航支持
          tab.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              e.stopPropagation();
              const targetTab = tab.dataset.tab;
              switchTab(targetTab);
            }
          });
          
          // 设置tabindex以支持键盘导航
          tab.setAttribute('tabindex', '0');
          tab.setAttribute('role', 'tab');
        });
        
        // 初始化第一个标签页为激活状态

      showToast(message, icon = '✅', type = 'success', item = null) {
        if (!this.state.enableToast) return;
        if (item) this.toast.setCurrentItem(item);
        this.toast.show(message, icon, type);
      }
      
      // 应用排序
      applySort(items, sortBy) {
        const sorted = [...items];
        
        switch (sortBy) {
          case 'name':
            sorted.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
            break;
          case 'price':
            sorted.sort((a, b) => (b.price || 0) - (a.price || 0));
            break;
          case 'change':
            sorted.sort((a, b) => {
              const aHistory = a.history || [];
              const bHistory = b.history || [];
              const aChange = aHistory.length > 1 ? aHistory[aHistory.length - 1].close - aHistory[aHistory.length - 2].close : 0;
              const bChange = bHistory.length > 1 ? bHistory[bHistory.length - 1].close - bHistory[bHistory.length - 2].close : 0;
              return bChange - aChange;
            });
            break;
          case 'category':
            sorted.sort((a, b) => {
              const catA = a.category || '未分类';
              const catB = b.category || '未分类';
              return catA.localeCompare(catB, 'zh-CN');
            });
            break;
        }
        
        return sorted;
      }

      renderList(searchKeyword = '') {
        // 防止重复渲染
        if (this.state.isRenderingList) return;
        this.state.isRenderingList = true;
        
        return Utils.measurePerformance('renderList', () => {
        const list = this.elements.itemList;
        let filtered = this.state.filterItems(searchKeyword);
        
        // 应用高级搜索排序
        if (this.state.advancedSearchFilters && this.state.advancedSearchFilters.sortBy) {
          filtered = this.applySort(filtered, this.state.advancedSearchFilters.sortBy);
        }

        if (filtered.length === 0) {
          list.innerHTML = this.generateNoResultsHTML(searchKeyword);
          this.elements.pagination.style.display = 'none';
          
          // 绑定建议按钮事件
          this.bindNoResultsEvents();
          
          // 如果有搜索关键词且不是空字符串，触发无结果动画
          if (searchKeyword && searchKeyword.trim() !== '') {
            this.addSearchAnimation('no-result');
          }
          
          this.state.isRenderingList = false;
          return;
        }

        const totalPages = Math.ceil(filtered.length / this.state.pageSize);
        this.state.currentPage = Math.min(Math.max(1, this.state.currentPage), totalPages);

        const startIndex = (this.state.currentPage - 1) * this.state.pageSize;
        const endIndex = Math.min(startIndex + this.state.pageSize, filtered.length);
        const pageItems = filtered.slice(startIndex, endIndex);

        // 清空列表
        list.innerHTML = '';
        
        // 渐进式加载配置
        const BATCH_SIZE = pageItems.length > 20 ? 8 : 6; // 大量数据时每批8个，少量数据时6个
        const BATCH_DELAY = pageItems.length > 20 ? 30 : 50; // 大量数据时间隔更短
        
        // 分批渲染卡片
        this.renderCardsInBatches(list, pageItems, BATCH_SIZE, BATCH_DELAY, () => {
          // 渲染完成后的回调
          // 只有在数据完全加载完成后才显示分页导航栏
          if (this.state.dataLoaded) {
            this.elements.pagination.style.display = 'flex';
            this.updatePagination(filtered.length, totalPages);
          }
          
          this.state.isRenderingList = false;
          
          // 减少内存监控频率
          if (Math.random() < 0.1) { // 只有10%的概率进行内存监控
            const memory = Utils.getMemoryUsage();
            if (memory && memory.used > 100) { // 只在内存使用超过100MB时记录
              console.log(`💾 内存使用: ${memory.used}MB / ${memory.total}MB (限制: ${memory.limit}MB)`);
            }
          }
        });
        });
      }
      
      renderCardsInBatches(container, items, batchSize, delay, onComplete) {
        let currentIndex = 0;
        const startTime = performance.now();
        
        const renderBatch = () => {
          const batchStartTime = performance.now();
          const endIndex = Math.min(currentIndex + batchSize, items.length);
          const batch = items.slice(currentIndex, endIndex);
          
          // 使用DocumentFragment提高性能
          const fragment = document.createDocumentFragment();
          
          batch.forEach(item => {
            const card = this.createItemCard(item);
            // 添加渐入动画
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            fragment.appendChild(card);
          });
          
          container.appendChild(fragment);
          
          // 为这批卡片添加渐入动画
          const cards = Array.from(container.children).slice(-batch.length);
          cards.forEach((card, index) => {
            setTimeout(() => {
              card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
              card.style.opacity = '1';
              card.style.transform = 'translateY(0)';
            }, index * 20); // 每个卡片间隔20ms动画
          });
          
          currentIndex = endIndex;
          
          // 性能监控
          const batchTime = performance.now() - batchStartTime;
          if (batchTime > 20) { // 如果单批渲染超过20ms，调整策略
            console.warn(`⚠️ 批次渲染耗时 ${batchTime.toFixed(2)}ms，考虑优化`);
          }
          
          if (currentIndex < items.length) {
            // 继续渲染下一批
            setTimeout(renderBatch, delay);
          } else {
            // 所有卡片渲染完成
            const totalTime = performance.now() - startTime;
            console.log(`✅ 卡片渲染完成: ${items.length}个卡片，耗时 ${totalTime.toFixed(2)}ms`);
            if (onComplete) onComplete();
          }
        };
        
        // 开始渲染
        renderBatch();
      }

      updatePagination(totalItems, totalPages) {
        const { currentPage } = this.state;
        
        const startIndex = (currentPage - 1) * this.state.pageSize + 1;
        const endIndex = Math.min(currentPage * this.state.pageSize, totalItems);
        this.elements.paginationInfo.textContent = `${startIndex}-${endIndex} / 共 ${totalItems} 条`;

        this.elements.firstPageBtn.disabled = currentPage === 1;
        this.elements.prevPageBtn.disabled = currentPage === 1;
        this.elements.nextPageBtn.disabled = currentPage === totalPages;
        this.elements.lastPageBtn.disabled = currentPage === totalPages;

        this.renderPaginationButtons(totalPages);
      }

      renderPaginationButtons(totalPages) {
        const { currentPage } = this.state;
        this.elements.paginationPages.innerHTML = '';
        
        const maxVisiblePages = Utils.isMobile() ? 3 : 5;
        const halfVisible = Math.floor(maxVisiblePages / 2);
        
        let startPage = Math.max(1, currentPage - halfVisible);
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
        
        if (endPage - startPage + 1 < maxVisiblePages) {
          startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        const addEllipsis = () => {
          const ellipsis = document.createElement('span');
          ellipsis.textContent = '...';
          ellipsis.style.padding = '8px';
          this.elements.paginationPages.appendChild(ellipsis);
        };

        if (startPage > 1) {
          this.addPageButton(1);
          if (startPage > 2) addEllipsis();
        }

        for (let i = startPage; i <= endPage; i++) {
          this.addPageButton(i);
        }

        if (endPage < totalPages) {
          if (endPage < totalPages - 1) addEllipsis();
          this.addPageButton(totalPages);
        }
      }

      addPageButton(pageNum) {

      scheduleIconLoad(card, item) {
        // 使用requestIdleCallback优化非关键任务
        if (window.requestIdleCallback) {
          requestIdleCallback(() => {
            this.setCardBackground(card, item);
          }, { timeout: 2000 }); // 2秒超时
        } else {
          // 降级处理：分批延迟加载
          const delay = Math.random() * 200 + 100; // 100-300ms随机延迟
          setTimeout(() => {
            this.setCardBackground(card, item);
          }, delay);
        }
      }
      
      setCardBackground(card, item) {
        if (!this.state.enableIcons) {
          this.clearCardBackground(card);
          return;
        }
        
          const iconUrl = Utils.getItemIcon(item);
        
        // 如果图标URL为空，直接清除背景
        if (!iconUrl || !iconUrl.trim()) {
          this.clearCardBackground(card);
          return;
        }
        
        // 检查缓存
        if (this.iconCache.has(iconUrl)) {
          const cachedResult = this.iconCache.get(iconUrl);
          if (cachedResult.success) {
            this.setBackgroundImage(card, iconUrl);
          } else {
            this.clearCardBackground(card);
          }
          return;
        }
        
        // 添加到加载队列
        this.loadingQueue.push({ card, item, iconUrl });
        this.processLoadingQueue();
      }
      
      processLoadingQueue() {
        if (this.currentLoads >= this.maxConcurrentLoads || this.loadingQueue.length === 0) {
          return;
        }
        
        const { card, item, iconUrl } = this.loadingQueue.shift();
        this.currentLoads++;
        
        // 使用requestAnimationFrame优化加载时机
        requestAnimationFrame(() => {
          this.loadIconImage(card, iconUrl);
        });
      }
      
      loadIconImage(card, iconUrl) {
          const img = new Image();
        const startTime = performance.now();
        
        // 设置超时处理
        const timeout = setTimeout(() => {
          img.onload = null;
          img.onerror = null;
          this.clearCardBackground(card);
          this.iconCache.set(iconUrl, { 
            success: false, 
            loadTime: 5000, // 超时时间
            timestamp: Date.now(),
            timeout: true
          });
          this.finishLoading();
        }, 5000); // 5秒超时
          
          img.onload = () => {
          clearTimeout(timeout);
          const loadTime = performance.now() - startTime;
            this.setBackgroundImage(card, iconUrl);
          this.iconCache.set(iconUrl, { 
            success: true, 
            loadTime: loadTime,
            timestamp: Date.now()
          });
          this.finishLoading();
          };
          
          img.onerror = () => {
          clearTimeout(timeout);
          const loadTime = performance.now() - startTime;
          this.clearCardBackground(card);
          this.iconCache.set(iconUrl, { 
            success: false, 
            loadTime: loadTime,
            timestamp: Date.now()
          });
          this.finishLoading();
          };
          
          img.src = iconUrl;
      }
      
      finishLoading() {
        this.currentLoads--;
        this.processLoadingQueue(); // 处理下一个
      }
      
      setBackgroundImage(card, url) {
        if (url && url.trim()) {
        card.style.backgroundImage = `url(${url})`;
          card.style.backgroundSize = '120px';
          card.style.backgroundRepeat = 'no-repeat';
          card.style.backgroundPosition = '-20px center';
        } else {
          this.clearCardBackground(card);
        }
      }
      
      clearCardBackground(card) {
        card.style.backgroundImage = '';
        card.style.backgroundSize = '';
        card.style.backgroundRepeat = '';
        card.style.backgroundPosition = '';
      }

      // 清理过期的缓存条目
      cleanIconCache() {
        const now = Date.now();
        const maxAge = 30 * 60 * 1000; // 30分钟
        
        for (const [url, data] of this.iconCache.entries()) {
          if (now - data.timestamp > maxAge) {
            this.iconCache.delete(url);
          }
        }
      }
      
      // 获取图标加载统计信息
      getIconLoadingStats() {
        const stats = {
          totalCached: this.iconCache.size,
          successful: 0,
          failed: 0,
          averageLoadTime: 0,
          timeoutCount: 0
        };
        
        let totalLoadTime = 0;
        
        for (const [url, data] of this.iconCache.entries()) {
          if (data.success) {
            stats.successful++;
          } else {
            stats.failed++;
            if (data.timeout) {
              stats.timeoutCount++;
            }
          }
          totalLoadTime += data.loadTime || 0;
        }
        
        if (this.iconCache.size > 0) {
          stats.averageLoadTime = totalLoadTime / this.iconCache.size;
        }
        
        return stats;
      }
      
      // 重置图标缓存
      resetIconCache() {
        this.iconCache.clear();
        this.loadingQueue = [];
        this.currentLoads = 0;
      }
      
      
        
      calculatePriceData(item) {
        const last = item.history?.length ? item.history[item.history.length - 1].close : item.price || 0;
        const {change, percent} = Utils.calcChange(item.history);
        const priceClass = change === 0 ? '' : (change >= 0 ? 'price-up' : 'price-down');
        const arrow = change === 0 ? '' : (change >= 0 ? '↑' : '↓');
        return { last, change, percent, priceClass, arrow };
      }
      
      generateCategoryTag(item) {
        if (!this.state.enableCategoryTag || !item.category) return '';
        return item.subCategory ? 
          `<span class='category-tag'>${Utils.esc(item.category)}<span class="category-tag-sep">›</span>${Utils.esc(item.subCategory)}</span>` :
          `<span class='category-tag'>${Utils.esc(item.category)}</span>`;
      }
        
      generateCardHTML(item, priceData, catTag) {
        const { last, change, percent, priceClass, arrow } = priceData;
        
        // 获取价格颜色
        const priceColor = Utils.getPriceColor(last);
        
        const priceChangeHTML = change !== 0 
          ? `<div class="price-change ${priceClass}">${arrow} ${Utils.formatPrice(Math.abs(change), this.state.enableFormatPrice)} (${Math.abs(percent).toFixed(2)}%)</div>`
          : '';
        
        return `
          <div class="card-favorite">
            <button class="favorite-btn ${item.isFavorite ? 'favorited' : ''}" data-item-name="${CSS.escape(item.name)}" title="${item.isFavorite ? '取消收藏' : '添加收藏'}">
              ${item.isFavorite ? '❤️' : '🤍'}
            </button>
          </div>
          <div class="card-top">
            <div class="card-name-wrap">
              <div class="card-name">${Utils.esc(item.name)}</div>
            </div>
            <div class="card-price ${priceClass}" data-price="${last}" style="color: ${priceColor}">
              ${Utils.formatPrice(last, this.state.enableFormatPrice)}
            </div>
          </div>
          <div class="card-bottom">
            <div>${catTag}</div>
            <div class="card-change">${priceChangeHTML}</div>
          </div>
        `;
      }

      updateItemCard(item) {

      renderCategories() {
        const menu = this.elements.categoryMenu;
        const label = this.elements.categoryLabel;
        const counts = this.state.getCategoryCounts();
        
        let labelText = this.state.activeCategory;
        if (this.state.activeSubCategory) {
          labelText = `${this.state.activeCategory} › ${this.state.activeSubCategory}`;
        }
        label.textContent = `📋 ${labelText} (${counts[this.state.activeSubCategory ? `${this.state.activeCategory}>${this.state.activeSubCategory}` : this.state.activeCategory] || 0})`;
        
        menu.innerHTML = '';

        const addMenuItem = (name, count, isParent = true, parentName = null) => {
          const item = document.createElement('div');
          const isActive = isParent 
            ? (this.state.activeCategory === name && !this.state.activeSubCategory)
            : (this.state.activeCategory === parentName && this.state.activeSubCategory === name);
          
          item.className = 'category-menu-item' + (isActive ? ' active' : '') + (isParent ? ' parent' : ' child');
          item.innerHTML = `<span>${name}</span><span class='badge'>${count}</span>`;
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isParent) {
              this.state.activeCategory = name;
              this.state.activeSubCategory = null;
            } else {
              this.state.activeCategory = parentName;
              this.state.activeSubCategory = name;
            }
            this.state.filteredCache = null;
            this.state.currentPage = 1;
            menu.classList.remove('show');
            this.elements.categoryBtn.classList.remove('open');
            this.renderCategories();
            this.renderList(this.elements.searchInput.value.trim());
          });
          menu.appendChild(item);
        };

        addMenuItem('全部类型', counts['全部类型']);
        addMenuItem('收藏', counts['收藏'] || 0);
        
        this.state.categories.forEach(cat => {
          addMenuItem(cat.name, counts[cat.name] || 0);
          if (cat.subs && cat.subs.length > 0) {
            cat.subs.forEach(sub => {
              const subKey = `${cat.name}>${sub}`;
              addMenuItem(sub, counts[subKey] || 0, false, cat.name);
            });
          }
        });
        
        if (counts['未分类'] > 0) addMenuItem('未分类', counts['未分类']);
      }

      bindChartEvents(item, modal) {
        const events = {
          '#closeChart': { click: () => this.closeItemDetailModal(modal) },
          '#closeHint': { click: async () => { this.state.hideChartDeleteHint = true; await this.state.saveConfig('feature_toggles', { icons: this.state.enableIcons, toast: this.state.enableToast, chartDelete: this.state.enableChartDelete, categoryTag: this.state.enableCategoryTag, formatPrice: this.state.enableFormatPrice, hideChartDeleteHint: true }); document.getElementById('closeHint').parentElement.style.display = 'none'; } },
          '#itemCategory': { change: (e) => { const subSelect = document.getElementById('itemSubCategory'); const selectedCat = e.target.value; if (!selectedCat) { subSelect.style.display = 'none'; subSelect.innerHTML = '<option value="">无二级分类</option>'; return; } const parentCat = this.state.categories.find(c => c.name === selectedCat); if (parentCat?.subs?.length) { subSelect.innerHTML = '<option value="">无二级分类</option>' + parentCat.subs.map(sub => `<option value="${Utils.esc(sub)}">${Utils.esc(sub)}</option>`).join(''); subSelect.style.display = ''; } else { subSelect.style.display = 'none'; subSelect.innerHTML = '<option value="">无二级分类</option>'; } } },
          '#updateCategory': { click: async () => { const selectedCat = document.getElementById('itemCategory').value; const selectedSubCat = document.getElementById('itemSubCategory').value; item.category = selectedCat || undefined; item.subCategory = selectedSubCat || undefined; await this.state.saveItemQuick(item); this.showToast('分类已更新', '🏷️', 'success', item); this.closeItemDetailModal(modal); this.renderCategories(); this.updateItemCard(item); } },
          '#quickAddPrice': { click: this.addPriceHandler(item, modal) },
          '#newPrice': { keypress: (e) => e.key === 'Enter' && this.addPriceHandler(item, modal)() },
          '#deleteItem': { click: async () => {
            const confirmed = await this.showConfirmDialog(
              `确定要删除道具"${item.name}"吗？\n\n此操作将删除所有相关数据（持仓、历史价格、交易记录等），不可恢复！`,
              '删除道具',
              '删除',
              '取消'
            );
            if (confirmed) {
              // 立即关闭模态框，避免在点击处理器中执行耗时操作
              this.closeItemDetailModal(modal);

              // 使用 setTimeout 将耗时操作延迟到下一个事件循环
              setTimeout(async () => {
                try {
                  // 使用新的级联删除方法
                  await this.state.db.deleteItem(item.id);

                  // 从内存中移除
                  this.state.data = this.state.data.filter(it => it !== item);
                  this.state.dataMap.delete(item.name);

                }
              }, 0);
            }
          }}
        };
        Utils.bindEvents(events);

              this.showToast('价格输入框未找到', '❌', 'error', item);

            }
            
            const inputValue = newPriceInput.value.trim();
            if (!inputValue) {
              this.showToast('请输入价格', '⚠️', 'warning', item);
              newPriceInput.focus();
              return;
            }
            
            const newPrice = parseFloat(inputValue);
            if (isNaN(newPrice)) {
              this.showToast('请输入有效的数字', '⚠️', 'warning', item);
              newPriceInput.focus();
              return;
            }
            
            if (newPrice < 0) {
              this.showToast('价格不能为负数', '⚠️', 'warning', item);
              newPriceInput.focus();
              return;
            }
            
            if (newPrice > 999999999999) {
              this.showToast('价格过大，请输入小于1万亿的数值', '⚠️', 'warning', item);
              newPriceInput.focus();
              return;
            }
          // 保存旧价格
          const oldPrice = item.price || 0;
          item.price = newPrice;
          item.history = item.history || [];
          item.history.push({close: newPrice, date: Utils.getCurrentDateTime()});

          // 记录价格变动到操作历史
          if (oldPrice !== newPrice) {
            if (!item.inventory) {
              item.inventory = {
                currentStock: 0,
                totalInvestment: 0,
                averageCost: 0,
                operationHistory: []
              };
            }

            const priceChangeRecord = {
              type: 'price_change',
              timestamp: Date.now(),
              oldPrice: oldPrice,
              newPrice: newPrice,
              change: newPrice - oldPrice,
              changePercent: oldPrice > 0 ? ((newPrice - oldPrice) / oldPrice * 100).toFixed(2) : 0
            };

            item.inventory.operationHistory.push(priceChangeRecord);

            // 保存价格变动记录到 records 表
            await this.state.db.saveRecord({
              itemId: item.id,
              itemName: item.name,
              opType: 'price_update',
              quantity: 0,
              price: newPrice,
              totalAmount: 0,
              beforeStock: item.inventory.currentStock,
              afterStock: item.inventory.currentStock,
              note: `价格更新: ¥${oldPrice} → ¥${newPrice} (${priceChangeRecord.changePercent}%)`,
              metadata: {
                oldPrice: oldPrice,
                newPrice: newPrice,
                change: newPrice - oldPrice,
                changePercent: priceChangeRecord.changePercent
              }
            });

            // 更新用户统计（价格变化会影响持仓价值）
            await this.state.db.updateUserStats();
          }

          await this.state.saveItemQuick(item);
          this.showToast('金额已更新', '💰', 'success', item);

          // 更新价格统计信息
          this.updatePriceStats(item);

          this.closeItemDetailModal(modal);
          this.updateItemCard(item);
        } catch (error) {
          console.error('更新价格时发生错误:', error);
          this.showToast('更新价格失败', '❌', 'error', item);
        }
      };
    }

      updateIconPreview(iconPath) {
        const previewEl = document.getElementById('iconPreview');
        if (!previewEl) return;
        
        if (!iconPath) {
          previewEl.innerHTML = '🎮';
          previewEl.style.backgroundImage = 'none';
          return;
        }
        
        // 检查是否是URL
        if (iconPath.startsWith('http://') || iconPath.startsWith('https://')) {
          previewEl.innerHTML = '';
          previewEl.style.backgroundImage = `url(${iconPath})`;
          previewEl.style.backgroundSize = 'cover';
          previewEl.style.backgroundPosition = 'center';
          previewEl.style.backgroundRepeat = 'no-repeat';
        } else {
          // 使用emoji或字符
          previewEl.innerHTML = iconPath;
          previewEl.style.backgroundImage = 'none';
        }
      }

      saveItem() {
        const validation = Utils.validateForm({
          itemName: { required: true, label: '道具名称' },
          itemPrice: { required: true, type: 'number', min: 0, label: '价格' }
        });
        
        if (!validation.isValid) {
          this.showToast(`⚠️ ${validation.errors.join('，')}`, '⚠️', 'error');
          document.getElementById(validation.errors[0].includes('道具名称') ? 'itemName' : 'itemPrice').focus();
          return;
        }
        
        const name = document.getElementById('itemName').value.trim();
        const price = parseFloat(document.getElementById('itemPrice').value);
        const cat = document.getElementById('itemCat').value;
        const subCat = document.getElementById('itemSubCat').value;
        const iconInput = document.getElementById('itemIcon').value.trim();
        
        // 如果没有填写图标内容，就不使用图标
        const icon = iconInput ? Utils.convertIconPath(iconInput) : null;
        if (iconInput && !icon) {
          this.showToast('检测到本地路径，已自动使用默认图标。请使用在线图片链接', '⚠️', 'warning');
        }
        
        let item = this.state.dataMap.get(name);
        
        if (item) {
          const oldPrice = item.price;
          item.price = price;
          
          // 记录价格变动到操作历史
          if (oldPrice !== price) {
            if (!item.inventory) {
              item.inventory = {
                currentStock: 0,
                totalInvestment: 0,
                averageCost: 0,
                operationHistory: []
              };
            }
            
            const priceChangeRecord = {
              type: 'price_change',
              timestamp: Date.now(),
              oldPrice: oldPrice,
              newPrice: price,
              change: price - oldPrice,
              changePercent: oldPrice > 0 ? ((price - oldPrice) / oldPrice * 100).toFixed(2) : 0
            };
            
            item.inventory.operationHistory.push(priceChangeRecord);
            
            // 调试信息
            console.log('价格变动记录已添加:', {
              itemName: name,
              oldPrice: oldPrice,
              newPrice: price,
              change: price - oldPrice,
              changePercent: priceChangeRecord.changePercent + '%',
              totalRecords: item.inventory.operationHistory.length
            });
          }
          
          if (cat) {
            item.category = cat;
            item.subCategory = subCat || undefined;
          } else {
            delete item.category;
            delete item.subCategory;
          }
          
          // 总是设置icon属性，如果没有填写图标就设置为空字符串
          item.icon = icon || '';
          
          item.history = item.history || [];
          item.history.push({close: price, date: Utils.getCurrentDateTime()});
          this.showToast('数据已更新', '✅', 'success', item);
        } else {
          const newItem = {
            name,
            price,
            history: [{close: price, date: Utils.getCurrentDateTime()}],
            isFavorite: false,  // 默认不收藏
            inventory: {  // 初始化库存结构
              currentStock: 0,
              totalInvestment: 0,
              averageCost: 0,
              operationHistory: []
            }
          };

          if (cat) {
            newItem.category = cat;
            if (subCat) newItem.subCategory = subCat;
          }

          // 总是设置icon属性，如果没有填写图标就设置为空字符串
          newItem.icon = icon || '';

          this.state.data.push(newItem);
          this.showToast('数据已添加', '✅', 'success', newItem);
        }
        
        this.state.saveData();
        this.closeModal();
        this.renderCategories();
        this.renderList(this.elements.searchInput.value.trim());
      }

      // 获取功能开关配置
      getFeatureTogglesConfig() {
        return [
          { id: 'toggleIcons', label: '图标加载', state: this.state.enableIcons },
          { id: 'toggleToast', label: 'Toast通知', state: this.state.enableToast },
          { id: 'toggleChartDelete', label: '删除历史', state: this.state.enableChartDelete },
          { id: 'toggleCategoryTag', label: '道具类型', state: this.state.enableCategoryTag },
          { id: 'toggleFormatPrice', label: '友好金额', state: this.state.enableFormatPrice },
          { id: 'toggleDragSort', label: '拖拽排序', state: this.state.enableDragSort, disabled: true }
        ];
      }
      
      // 绑定功能开关事件
      bindFeatureToggles() {
        const togglesConfig = this.getFeatureTogglesConfig();
        
        togglesConfig.forEach(toggle => {
          const element = document.getElementById(toggle.id);
          if (!element) return;
          
          // 设置初始状态
          element.checked = !!toggle.state;
          
          // 绑定事件处理器
          const handler = this.getFeatureToggleHandler(toggle.id);
          if (handler) {
            element.addEventListener('change', handler);
          }
        });
      }

      bindThemeSwitchEvents() {
        document.querySelectorAll('.theme-option').forEach(option => {

      // 导出JSON数据
      exportDataJson() {
        const data = {items: this.state.data, categories: this.state.categories};
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        Utils.downloadFile(blob, `game_items_${Date.now()}.json`);
        this.showToast('JSON已导出', '📥', 'info');
      }
      
      // 导出CSV数据
      exportDataCsv() {
        let csv = '\uFEFF道具名称,当前价格,一级分类,二级分类,历史数据\n';
        this.state.data.forEach(item => {
          const histStr = item.history ? item.history.map(h => `${h.date}:${h.close}`).join(';') : '';
          csv += `"${item.name}","${item.price || 0}","${item.category || '未分类'}","${item.subCategory || ''}","${histStr}"\n`;
        });
        const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
        Utils.downloadFile(blob, `game_items_${Date.now()}.csv`);
        this.showToast('CSV已导出', '📊', 'info');
      }
      
      // 导入JSON数据
      async importDataJson() {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'application/json';
        inp.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            
            if (parsed.items) {
              this.state.data = parsed.items;
              if (parsed.categories) this.state.categories = parsed.categories;
            } else if (Array.isArray(parsed)) {
              this.state.data = parsed;
            } else {
              this.showToast('⚠️ 格式错误:需要包含items数组的JSON对象', '⚠️', 'error');
              return;
            }
            
            await this.state.saveData();
            if (parsed.categories) {
              await this.state.saveConfig('categories', this.state.categories);
            }
        this.closeModal();
            this.renderCategories();
            this.renderList(this.elements.searchInput.value.trim());
            this.showToast('✅ 数据导入成功', '📤', 'success');
          } catch (err) {
            this.showToast('❌ 导入失败: ' + err.message, '❌', 'error');
          }
        };
        inp.click();
      }

      // 显示生成进度模态框
      showGenerationProgressModal(totalItems = 0) {
        // 隐藏搜索区域和分页
        const searchWrap = document.querySelector('.search-wrap');
        const pagination = document.getElementById('pagination');
        if (searchWrap) searchWrap.style.display = 'none';
        if (pagination) pagination.style.display = 'none';
        
        const modal = document.getElementById('loadingProgressModal');
        if (modal) {
          modal.classList.add('show');
          // 初始化进度
          this.updateGenerationProgress({
            progress: 0,
            current: 0,
            total: totalItems,
            time: 0,
            recordCount: 0,
            status: '正在初始化数据生成器...'
          });
        }
      }
      
      // 更新生成进度
      updateGenerationProgress({ progress, current, total, time, status, recordCount }) {
        const progressBar = document.getElementById('generationProgress');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const statusInfo = document.getElementById('statusInfo');
        const statItems = document.getElementById('statItems');
        const statHistory = document.getElementById('statHistory');
        const statTime = document.getElementById('statTime');
        
        if (progressBar) progressBar.style.width = `${progress}%`;
        if (progressPercent) progressPercent.textContent = `${progress}%`;
        // 进度条下方显示简洁描述
        if (progressText) {
          if (total > 0) {
            const simpleStatus = `${current} / ${total} 道具`;
            progressText.textContent = simpleStatus;
          } else {
            progressText.textContent = '准备中...';
          }
        }
        // 状态信息区域显示详细描述
        if (statusInfo) statusInfo.textContent = status || '准备中...';
        if (statItems) statItems.textContent = current || 0;
        // 显示记录数量，每个道具大约有30-120条历史记录
        if (statHistory) {
          const estimatedRecords = recordCount || (current * 75); // 估算平均75条记录
          statHistory.textContent = estimatedRecords;
        }
        if (statTime) statTime.textContent = `${time}s`;
      }
      
      // 隐藏生成进度模态框
      hideGenerationProgressModal() {
        const modal = document.getElementById('loadingProgressModal');
        if (modal) {
          modal.classList.remove('show');
        }
        
        // 重新显示搜索区域和分页
        const searchWrap = document.querySelector('.search-wrap');
        const pagination = document.getElementById('pagination');
        if (searchWrap) searchWrap.style.display = '';
        if (pagination && this.elements.pagination) {
          // 检查是否需要显示分页（如果有数据才显示）
          const filtered = this.state.filterItems(this.elements.searchInput.value.trim());
          if (filtered.length > 0) {
            pagination.style.display = '';
          }
        }
      }

      async savePersonalSettings() {
        const nickname = document.getElementById('userNickname').value;
        const avatar = document.getElementById('userAvatar').value;
        const theme = document.getElementById('userTheme').value;
        const language = document.getElementById('userLanguage').value;
        const timezone = document.getElementById('userTimezone').value;
        
        // 获取当前用户ID（从全局变量或用户菜单获取）
        const currentUserId = this.currentUserId || 1;
        const userKey = `user_${currentUserId}`;

        // 获取现有用户数据
        let userData = await this.state.db.get(CONFIG.STORE_CONFIG, userKey);
        
        // 创建或更新用户数据
        const now = new Date().toISOString();
        if (!userData || !userData.value) {
          // 新用户，设置创建时间
          const newUserData = {
            nickname: nickname,
            avatar: avatar,
            createdAt: now,
            updatedAt: now,
            theme: theme,
            language: language,
            timezone: timezone
          };
          await this.state.saveConfig(userKey, newUserData);
        } else {
          // 更新现有用户数据
          userData.value.nickname = nickname;
          userData.value.avatar = avatar;
          userData.value.updatedAt = now;
          userData.value.theme = theme;
          userData.value.language = language;
          userData.value.timezone = timezone;
          
          await this.state.saveConfig(userKey, userData.value);
        }
        
        // 更新用户菜单显示
        await this.updateUserMenu();
        
        this.showToast('个人设置已保存', '✅', 'success');
        this.closeModal();
      }

        let selectedUserId = 1;

        for (let i = 0; i < userItems.length; i++) {
          const item = userItems[i];
          const nameElement = item.querySelector('.user-name');
          if (nameElement && nameElement.textContent === userName) {
            selectedUserId = i + 1; // 数字类型
            break;

        // 更新右上角用户按钮

      // 更新用户菜单
      async updateUserMenu() {
        // 从数据库加载所有用户数据
        const userItems = document.querySelectorAll('.user-item');
        const currentUserId = this.currentUserId || 1;

        for (let i = 0; i < Math.min(userItems.length, 5); i++) {
          const userId = i + 1; // 数字类型
          const userData = await this.loadUserData(userId);
          const userItem = userItems[i];
          
          if (userItem) {
            // 设置当前用户状态
            if (userId === currentUserId) {
              userItem.classList.add('current-user');
            } else {
              userItem.classList.remove('current-user');
            }
            
            const userNameElement = userItem.querySelector('.user-name');
            if (userNameElement) {
              userNameElement.textContent = userData.nickname;
            }
            
            // 更新头像
            const avatarElement = userItem.querySelector('.user-avatar');
            if (avatarElement) {
              // 如果有头像链接，显示图片
              if (userData.avatar && userData.avatar.trim() !== '') {
                avatarElement.innerHTML = '';
                avatarElement.style.cssText = 'width: 36px; height: 36px; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; flex-shrink: 0; overflow: hidden;';
                const img = document.createElement('img');
                img.src = userData.avatar;
                img.alt = '头像';
                img.style.cssText = 'width: 100%; height: 100%; object-fit: cover;';
                img.onerror = function() {
                  avatarElement.innerHTML = userId;

          option.addEventListener('click', () => {
            themeOptions.forEach(opt => opt.classList.remove('active'));
            option.classList.add('active');
          });
        });

        document.getElementById('exportJsonBtn').addEventListener('click', () => {
          const data = {items: this.state.data, categories: this.state.categories};
          const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
          Utils.downloadFile(blob, `game_items_${Date.now()}.json`);
          this.showToast('JSON已导出', '📥', 'info');
        });

        document.getElementById('exportCsvBtn').addEventListener('click', () => {
          let csv = '\uFEFF道具名称,当前价格,一级分类,二级分类,历史数据\n';
          this.state.data.forEach(item => {
            const histStr = item.history ? item.history.map(h => `${h.date}:${h.close}`).join(';') : '';
            csv += `"${item.name}","${item.price || 0}","${item.category || '未分类'}","${item.subCategory || ''}","${histStr}"\n`;
          });
          const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
          Utils.downloadFile(blob, `game_items_${Date.now()}.csv`);
          this.showToast('CSV已导出', '📊', 'info');
        });

        document.getElementById('importBtn').addEventListener('click', () => {
          const inp = document.createElement('input');
          inp.type = 'file';
          inp.accept = 'application/json';
          inp.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            try {
              const text = await file.text();
              const parsed = JSON.parse(text);
              
              if (parsed.items) {
                this.state.data = parsed.items;
                if (parsed.categories) this.state.categories = parsed.categories;
              } else if (Array.isArray(parsed)) {
                this.state.data = parsed;
              } else {
                this.showToast('⚠️ 格式错误:需要包含items数组的JSON对象', '⚠️', 'error');
                return;
              }
              
              await this.state.saveData();
              await this.state.saveConfig('categories', this.state.categories);
              this.closeModal();
              this.renderCategories();
              this.renderList(this.elements.searchInput.value.trim());
              this.showToast('导入成功', '📤', 'success');
            } catch (err) {
              console.error('导入错误:', err);

            let next = parent.nextElementSibling;
            while (next && next.classList.contains('sub-cat') && next.getAttribute('data-parent-idx') === parentIdx) {
              insertAfter = next;
              next = next.nextElementSibling;
            }
            
            insertAfter.parentNode.insertBefore(subDiv, insertAfter.nextSibling);
            subDiv.querySelector('input').focus();
          });

        document.querySelectorAll('.del-sub-cat').forEach(btn => {
          btn.addEventListener('click', async () => {

              '删除子分类',
              '删除',
              '取消'
            );
            if (confirmed) btn.closest('.sub-cat').remove();
          });
        });

        const toggleIcons = document.getElementById('toggleIcons');
        const toggleToast = document.getElementById('toggleToast');
        const toggleChartDelete = document.getElementById('toggleChartDelete');
        const toggleCategoryTag = document.getElementById('toggleCategoryTag');
        const toggleFormatPrice = document.getElementById('toggleFormatPrice');
        const toggleDragSort = document.getElementById('toggleDragSort');
        if (toggleIcons) toggleIcons.checked = !!this.state.enableIcons;
        if (toggleToast) toggleToast.checked = !!this.state.enableToast;
        if (toggleChartDelete) toggleChartDelete.checked = !!this.state.enableChartDelete;
        if (toggleCategoryTag) toggleCategoryTag.checked = !!this.state.enableCategoryTag;
        if (toggleFormatPrice) toggleFormatPrice.checked = !!this.state.enableFormatPrice;
        if (toggleDragSort) toggleDragSort.checked = !!this.state.enableDragSort;

        toggleIcons?.addEventListener('change', () => { this.state.enableIcons = toggleIcons.checked; this.renderList(this.elements.searchInput.value.trim()); });
        toggleToast?.addEventListener('change', () => { 
          this.state.enableToast = toggleToast.checked; 
          this.toast.setEnabled(toggleToast.checked);
        });
        toggleChartDelete?.addEventListener('change', () => { this.state.enableChartDelete = toggleChartDelete.checked; });
        toggleCategoryTag?.addEventListener('change', () => { this.state.enableCategoryTag = toggleCategoryTag.checked; this.renderList(this.elements.searchInput.value.trim()); });
        toggleFormatPrice?.addEventListener('change', () => { this.state.enableFormatPrice = toggleFormatPrice.checked; this.renderList(this.elements.searchInput.value.trim()); });
        toggleDragSort?.addEventListener('change', () => { this.state.enableDragSort = toggleDragSort.checked; });

        // 绑定标签页切换事件
        document.querySelectorAll('.system-tab').forEach(tab => {
          tab.addEventListener('click', (e) => {
            const tabName = e.currentTarget.dataset.tab;
            this.switchSystemTab(tabName);
          });
        });
        
        document.getElementById('saveSystemSettings')?.addEventListener('click', async () => {
          // 先关闭设置页面并显示开始提示
          this.closeModal();
          this.showToast('正在保存设置...', '⚙️', 'info');
          
          const newCategories = [];
          const parentCats = document.querySelectorAll('.parent-cat');
          
          parentCats.forEach(parent => {
            const parentName = parent.querySelector('.parent-cat-input').value.trim();
            if (!parentName) return;
            
            const catObj = { name: parentName, subs: [] };
            
            let next = parent.nextElementSibling;
            while (next && next.classList.contains('sub-cat')) {
              const subInput = next.querySelector('.sub-cat-input');
              if (subInput) {
                const subName = subInput.value.trim();
                if (subName) catObj.subs.push(subName);
              }
              next = next.nextElementSibling;
            }
            
            newCategories.push(catObj);
          });
          
          this.state.categories = newCategories;

          // 异步清理已删除分类/子分类在道具数据中的引用
          const validParents = new Set(newCategories.map(c => c.name));
          const validSubsMap = new Map();
          newCategories.forEach(c => validSubsMap.set(c.name, new Set(Array.isArray(c.subs) ? c.subs : [])));

          let dataChanged = false;
          let cleanedCount = 0;
          
          // 使用异步批处理避免UI阻塞
          if (Array.isArray(this.state.data) && this.state.data.length > 0) {
            const batchSize = 100; // 每批处理100个道具
            const totalItems = this.state.data.length;
            
            for (let i = 0; i < totalItems; i += batchSize) {
              const batch = this.state.data.slice(i, i + batchSize);
              
              batch.forEach(item => {
                let itemChanged = false;
                const parent = item.category;
                const sub = item.subCategory;
                
                if (parent && !validParents.has(parent)) {
                  delete item.category;
                  if (sub) delete item.subCategory;
                  itemChanged = true;
                } else if (parent && sub) {
                  const validSubs = validSubsMap.get(parent) || new Set();
                  if (!validSubs.has(sub)) {
                    delete item.subCategory;
                    itemChanged = true;
                  }
                }
                
                if (itemChanged) { 
                  dataChanged = true; 
                  cleanedCount++; 
                }
              });
              
              // 每处理一批后让出控制权，避免阻塞UI
              if (i + batchSize < totalItems) {
                await new Promise(resolve => setTimeout(resolve, 0));
              }
            }
          }
